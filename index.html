:root{

.seg{display:flex;height:40px;border:1px solid var(--outline);border-radius:20px;

.seg-b{display:flex;align-items:center;gap:8px;height:100%;padding:0 22px 0 18px;

.seg-b + .seg-b{border-left:1px solid var(--outline)}

.seg-b:active{background:rgba(26,27,33,.12)}

.seg-b.on{background:var(--secondary-container);color:var(--on-secondary-container)}

/* 这里曾有外壳顶栏那颗「演示 · AI托管页排法」分段器。删了：原型自己已经有了入口
   （「我的」页那张「演示」卡），两处入口各亮各的选中态——外壳读不到 iframe 里的排法状态，
   在 App 里切完，顶栏那颗还亮着旧的，同一屏两个答案。留原型里那一处，它在外壳与 APK 里都在。
   （2026-10-16 追记：原型里那一处也随托管清单一屏删了——它比的两种排法都是清单的排法，
   清单没了就没有可排的东西，见 ADR-0065。所以「AI托管页排法」这件事现在两边都没有入口，

/* 不顶到最右——右上角留给历史版本切换器（_history/switcher.js）的悬浮钮 */

/* ---- 视图区：两帧并存、显隐切换（fade-through，纯透明度——不给 iframe 祖先加
        transform，避免内部 position:fixed 锚点漂移）；各自状态互不干扰 ---- */
#views{flex:1;position:relative}
.view{position:absolute;inset:0;opacity:0;visibility:hidden;

.view.on{opacity:1;visibility:visible;transition:opacity .25s var(--emph)}
.view iframe{display:block;width:100%;height:100%;border:0}

/* 视图③（线上后台复刻）：iframe 撑满整块，不再另挂一条页签栏——

   旧版那条 chip 栏已删：它与真实后台的观感不搭，且菜单本来就在。
   注：#viewsReal 靠 .view 的 absolute+inset:0 撑满整块，**别在这里再写 position**

   下面那条兜底提示的绝对定位挂在同尺寸的 #views 上，位置一样。 */
#viewsReal{display:flex;flex-direction:column}
#viewsReal iframe{flex:1 1 auto;height:auto;min-height:0}
/* 载体加载失败时的兜底提示：平时是空的 → 不占位、不可见（:empty 兜住） */
#reaMsg:empty{display:none}
#reaMsg{position:absolute;left:16px;right:16px;bottom:16px;z-index:2;

  color:var(--on-surface-variant);border:1px solid var(--outline-variant);
  font:400 12px/1.5 var(--f)}
</style>

<!-- 载体①·销售端 App 原型原文（原 prototype/index.html；闭标签已转义为 <\/script>，编辑时沿用该写法） -->
<script type="text/plain" id="srcApp"><!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>素材库 · 高保真交互原型 v2.0 · Material Design 3</title>
<style>
/* ============================================================
   素材库 高保真交互原型 · 单文件交付（零依赖，双击即用）
   平台：Android · 设计语言：Material Design 3（Material You）
   规范：/.claude/skills/android-md3-prototype/SKILL.md
   目录：令牌 → 舞台 → 手机框架 → 通用组件 → 各屏 → 微信场景
   ============================================================ */
:root{
  /* M3 光主题 · 种子色 #5A54F9 */
  --primary:#5A54F9; --on-primary:#FFFFFF;
  --primary-container:#E4E0FF; --on-primary-container:#12005E;
  --secondary:#5B5D72; --secondary-container:#E0E0F9; --on-secondary-container:#181A2C;
  --tertiary:#77536D; --tertiary-container:#FFD7F1; --on-tertiary-container:#2D1228;
  --error:#BA1A1A; --on-error:#FFF; --error-container:#FFDAD6; --on-error-container:#410002;
  --surface:#FAF8FE; --on-surface:#1A1B21;
  --surface-variant:#E3E1EC; --on-surface-variant:#46464F;
  --sc-lowest:#FFFFFF; --sc-low:#F4F1FB; --sc:#EFEDF6; --sc-high:#E9E7F0; --sc-highest:#E3E1EB;
  --outline:#777680; --outline-variant:#C7C5D0;
  --inverse-surface:#2F3036; --inverse-on-surface:#F1F0F7; --inverse-primary:#C3C0FF;
  --wx:#07C160; --wx-deep:#06AD56; --wx-container:#E3F8ED; --on-wx-container:#06703F;
  --amber:#B25E09; --amber-container:#FFF1DC;
  /* 形状（M3 shape scale） */
  --shape-xs:4px; --shape-s:8px; --shape-m:12px; --shape-l:16px; --shape-xl:28px;
  /* 海拔阴影（仅 FAB / 菜单 / 弹层；卡片一律色调分层不加阴影） */
  --e2:0 1px 2px rgba(26,27,33,.25),0 2px 6px 2px rgba(26,27,33,.12);
  --e3:0 1px 3px rgba(26,27,33,.22),0 4px 8px 3px rgba(26,27,33,.14);
  /* 动效：M3 emphasized */
  --emph:cubic-bezier(.2,0,0,1);
  --f:Roboto,"Noto Sans SC","MiSans","PingFang SC",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--f);background:#0D0E12;color:#E7E8EE;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,textarea{font-family:inherit;border:none;outline:none;background:none;color:var(--on-surface)}
svg{display:block}
mark{background:var(--primary-container);color:var(--on-primary-container);border-radius:3px;padding:0 1px}

/* ---------------- 舞台（原型浏览外壳，非 App UI） ---------------- */
#stage{position:relative;height:100vh;display:flex;align-items:center;justify-content:center;gap:52px;padding:20px}
#stage::before,#stage::after{content:"";position:fixed;border-radius:50%;filter:blur(110px);opacity:.45;pointer-events:none}
#stage::before{width:520px;height:520px;left:-120px;top:-160px;background:#3B33B8}
#stage::after{width:620px;height:620px;right:-160px;bottom:-200px;background:#17337A}
.stage-head{position:fixed;top:26px;left:50%;transform:translateX(-50%);text-align:center;z-index:5;pointer-events:none}
.stage-head h1{font-size:15px;font-weight:600;letter-spacing:.08em;color:#C9CBF5}
.stage-head p{font-size:11.5px;color:#6F7280;margin-top:5px;letter-spacing:.04em}

#sidebar{width:248px;height:min(880px,92vh);overflow-y:auto;border-radius:22px;padding:18px 12px;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(14px);z-index:20}
#sidebar h2{font-size:12px;letter-spacing:.14em;color:#8F92A6;padding:4px 10px 10px;font-weight:600}
.nav-g{font-size:10.5px;color:#6E7182;letter-spacing:.12em;margin:14px 8px 6px;font-weight:600}
.nav-i{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border-radius:10px;
  font-size:12.5px;color:#C6C8D6;transition:all .18s var(--emph)}
.nav-i:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-i.on{background:rgba(90,84,249,.28);color:#fff;box-shadow:inset 0 0 0 1px rgba(195,192,255,.35)}
.nav-i .dot{width:5px;height:5px;border-radius:50%;background:#565A6E;flex:none}
.nav-i.on .dot{background:#C3C0FF;box-shadow:0 0 8px #C3C0FF}

/* ---- 演示版本开关（标准版 / 高级版 / 旗舰版）——**原型外壳的展品件，不是 App 的一屏** ----
   真实系统里"这台企业是哪一档"由服务端下发，客户端没有这枚开关
   （《云小助（二期）· 产品需求文档》§1.4／§2.2）。放在手机外的侧栏顶部，正是为了让它读起来就是演示件。
   因此这身皮跟着**侧栏那套深色玻璃**走，不吃 App 的 M3 token——它与手机外框同属「展品」那一层。
   三枚按钮竖排（`.ver-seg` 是 column），正好放下三档；`.vd` 那行小字各写各的档位差在哪。 */
#verBox{padding:0 2px 2px}
.ver-seg{display:flex;flex-direction:column;gap:6px}
.ver-b{display:flex;align-items:baseline;gap:7px;width:100%;text-align:left;padding:9px 11px;
  border-radius:11px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  color:#C6C8D6;font-family:var(--f);transition:all .18s var(--emph)}
.ver-b:hover{background:rgba(255,255,255,.09);color:#fff}
.ver-b.on{background:rgba(90,84,249,.28);color:#fff;box-shadow:inset 0 0 0 1px rgba(195,192,255,.35)}
.ver-b .vn{font-size:12.5px;font-weight:700;flex:none}
.ver-b .vd{font-size:10.5px;color:#8F92A6;min-width:0}
.ver-b.on .vd{color:#C3C0FF}
.ver-note{margin:9px 4px 0;font-size:10.5px;line-height:1.55;color:#6E7182}
.ver-note b{color:#C3C0FF;font-weight:700}   /* 那一句里「公域」「AI托管」两层要一眼分得开 */
.nav-vip{margin-left:6px;padding:1px 6px 1px 5px;border-radius:6px;font-size:9.5px;font-style:normal;
  font-weight:700;letter-spacing:.06em;color:#C3C0FF;background:rgba(90,84,249,.30)}
#sideBtn{display:none;position:fixed;left:16px;bottom:18px;z-index:40;width:44px;height:44px;border-radius:14px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);
  align-items:center;justify-content:center;color:#D9DAE8}
@media(max-width:1420px){#sidebar{display:none}#sideBtn{display:flex}}
body.side-open #sidebar{display:block;position:fixed;left:14px;top:70px;bottom:14px;width:248px}

/* ---------------- 手机框架（Android · 412×916dp · 打孔屏） ---------------- */
.phone-wrap{position:relative;z-index:2;flex:none;transform-origin:center}
.phone{position:relative;width:432px;height:936px;background:#16171C;border-radius:46px;padding:10px;
  box-shadow:0 0 0 1.5px rgba(255,255,255,.09),0 1px 0 rgba(255,255,255,.16) inset,0 40px 90px -30px rgba(0,0,0,.75),0 0 120px -30px rgba(90,84,249,.35)}
.punch{position:absolute;top:21px;left:50%;transform:translateX(-50%);width:11px;height:11px;border-radius:50%;
  background:#04040A;box-shadow:0 0 0 2.5px #101117,0 0 6px 1px rgba(70,90,255,.35) inset;z-index:60}
.phone-inner{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--surface);
  display:flex;flex-direction:column}
/* 状态栏与手势条都做成浮层压在屏上：真机就是 edge-to-edge，屏的背景（各屏自绘的那层渐变）
   要一路铺到屏幕边缘。此前两条各占 34/22px 的实位，屏只能从中间起画，顶上那 34px 透出的是壳的
   底色 #FAF8FE，跟紧挨着的那屏对不齐——看着就像「顶部空了一条」。 */
.statusbar{position:absolute;left:0;right:0;top:0;height:34px;display:flex;align-items:center;justify-content:space-between;
  padding:8px 22px 0;z-index:55;pointer-events:none;color:var(--on-surface)}
.statusbar.lt{color:#fff}
.sb-time{font-size:14px;font-weight:500;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.sb-icons{display:flex;gap:5px;align-items:center}
.view{position:absolute;inset:0;overflow:hidden;background:var(--surface)} /* 铺满整屏：屏的背景画到最上/最下，状态栏与手势条浮在其上 */
/* 系统导航：Android 手势导航条。整条不吃点击（它是浮层，盖住屏的底边），只让手势条本身接事件 */
.sysnav{position:absolute;left:0;right:0;bottom:0;height:22px;display:flex;align-items:center;justify-content:center;background:none;z-index:56;pointer-events:none}
.gpill{width:108px;height:4px;border-radius:2px;background:#1A1B21;opacity:.85;cursor:pointer;pointer-events:auto}
@media(max-height:1020px){.phone-wrap{transform:scale(.9)}}
@media(max-height:920px){.phone-wrap{transform:scale(.8)}}
@media(max-height:820px){.phone-wrap{transform:scale(.7)}}
@media(max-width:520px){.phone-wrap{transform:scale(.62)}.stage-head{display:none}}

/* ---------------- 屏幕基座与转场（M3 fade-through） ---------------- */
.screen{position:absolute;inset:0;background:var(--surface);display:flex;flex-direction:column;visibility:hidden;overflow:hidden}
.screen.active{visibility:visible}
/* 屏内容仍要避让状态栏与手势条，但**不能用 padding**：绝对定位子元素的包含块是 padding box，
   屏里那些 .*-glow、遮罩、弹层都是 inset:0／top:0，一加 padding 它们就缩掉一条边、遮罩盖不到顶。
   改用两个不可见的 flex 占位块顶上：内容照旧从 34px 处起排，而 .screen 的盒子仍是整屏，
   背景与遮罩都能铺满。 */
.screen::before,.screen::after{content:"";display:block;flex:none;height:34px}
.screen::after{height:22px}
.anim-push{animation:m3In .3s var(--emph)}
.anim-pop{animation:m3In .3s var(--emph)}
.anim-exit{animation:m3Out .14s ease forwards}
@keyframes m3In{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes m3Out{to{opacity:0}}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* ---------------- 涟漪（Material ripple，全局统一按压反馈） ---------------- */
.rl{position:absolute;border-radius:50%;background:currentColor;opacity:.16;transform:scale(0);
  animation:rlA .55s var(--emph) forwards;pointer-events:none}
@keyframes rlA{60%{opacity:.12}to{transform:scale(1);opacity:0}}

/* ---------------- 通用组件 · M3 ---------------- */
/* 顶部应用栏 */
.appbar{flex:none;display:flex;align-items:center;gap:4px;height:64px;padding:0 8px 0 10px}
.appbar h3{font-size:22px;font-weight:400;color:var(--on-surface);flex:1;letter-spacing:.01em;padding-left:6px}
.appbar-back{flex:none;display:flex;align-items:center;gap:4px;height:64px;padding:0 8px 0 4px}
.appbar-back h3{font-size:22px;font-weight:400;flex:1;color:var(--on-surface)}
.iconbtn{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--on-surface-variant);position:relative;overflow:hidden;flex:none;transition:background .18s}
/* 按钮：filled / tonal / 微信语义绿，一律纯色胶囊，无渐变无投影 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;height:40px;padding:0 22px;
  font-size:14px;font-weight:500;letter-spacing:.01em;position:relative;overflow:hidden;user-select:none;flex:none}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-ghost{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn-green{background:var(--wx);color:#fff}
.btn-amber{background:#F59E0B;color:#fff}
.btn-danger{background:var(--error-container);color:var(--on-error-container)}
.btn-text{color:var(--primary);padding:0 14px}
/* M3 outlined 按钮（描边、透明底、primary 文字）。本壳此前只有 filled／tonal／text 三档，
   多开账号那一层的「更新账号数据」是描边钮——它就是这一档。**别拿 tonal 顶**：那一层的两枚钮
   上下并排，「更新账号数据」是次要动作、走描边，「保存设置」是主要动作、走 filled，两档才分得出主次；
   两枚都填色就成了一主一主，眼睛得读字才知道该按哪个。 */
.btn-outline{background:transparent;border:1px solid var(--outline);color:var(--primary)}
.btn-block{width:100%}
.btn-sm{height:32px;padding:0 14px;font-size:12.5px}
/* 筛选芯片：M3 filter chip，选中带 check */
.chip{display:inline-flex;align-items:center;gap:0;height:32px;border-radius:var(--shape-s);padding:0 14px;font-size:13px;font-weight:500;
  background:transparent;color:var(--on-surface-variant);border:1px solid var(--outline);white-space:nowrap;position:relative;overflow:hidden;
  transition:background .2s var(--emph),color .2s,border-color .2s}
.chip.on{background:var(--secondary-container);border-color:transparent;color:var(--on-secondary-container);padding:0 12px}
.chip.on::before{content:"";width:9px;height:5px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;
  transform:rotate(-45deg) translateY(-1px);margin-right:7px;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
/* 卡片与列表（M3 filled card / list，色调分层） */
.card{background:var(--sc);border-radius:var(--shape-m)}
.cell{display:flex;align-items:center;gap:16px;padding:14px 16px;background:var(--sc);border-radius:var(--shape-m);
  position:relative;overflow:hidden}
.cell .grow{flex:1;min-width:0}
.cell h5{font-size:16px;font-weight:500;color:var(--on-surface)}
.cell p{font-size:12px;color:var(--on-surface-variant);margin-top:3px;line-height:1.45}
/* 选中行（单选列表的当前值）：M3 的 secondary-container 底色，与侧栏 .gri.on 同一套口径——
   单选列表里「现在选的是哪一行」要一眼可读，只靠尾部一枚小勾太弱 */
.cell.on{background:var(--secondary-container)}
.cell-go{color:var(--outline-variant);flex:none}
.sectitle{display:flex;align-items:baseline;justify-content:space-between;padding:20px 16px 10px}
.sectitle h4{font-size:14px;font-weight:500;color:var(--on-surface);display:flex;align-items:center;gap:6px}
.more-link{font-size:12px;font-weight:500;color:var(--primary);position:relative;overflow:hidden;border-radius:8px;padding:4px 6px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 8px;border-radius:var(--shape-s);background:var(--surface-variant);color:var(--on-surface-variant)}
.tag.new{background:var(--primary-container);color:var(--on-primary-container)}
.tag.src-e{background:var(--wx-container);color:var(--on-wx-container)}
.tag.src-p{background:var(--secondary-container);color:var(--on-secondary-container)}
.mom-tag{display:inline-flex;align-items:center;gap:3px;flex:none;padding:2px 7px;border-radius:var(--shape-s);font-size:10px;font-weight:500;background:var(--surface-variant);color:var(--on-surface-variant)} /* 发圈提醒：素材卡信息区的事实标记（最近一次一键发圈发表时间），中性色——防重复发圈，不是状态警报 */
.hot-tag{display:inline-flex;align-items:center;gap:3px;flex:none;padding:2px 7px;border-radius:var(--shape-s);font-size:10px;font-weight:500;background:#FFE9D6;color:#B85212} /* 热门标记（N 人发过圈）：与「已发圈」同一行、紧随其右。暖色 tonal——与行首那枚火焰同族色，点题「热门」。数的是「发圈任务」引用时指派到的人数（ADR-0040），**不是**匿名使用计数（那条是 ADR-0010 删掉的） */
.kw-chip{display:inline-flex;align-items:center;padding:5px 10px;border-radius:var(--shape-s);background:var(--secondary-container);
  color:var(--on-secondary-container);font-size:11.5px;font-weight:500}
.kw-chip b{font-weight:400;opacity:.6;margin-right:3px}
.empty{padding:56px 32px;text-align:center;color:var(--on-surface-variant)}
.empty .e-ic{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:var(--surface-variant);display:flex;align-items:center;justify-content:center;color:var(--on-surface-variant)}
.empty h5{font-size:16px;font-weight:500;color:var(--on-surface)}
.empty p{font-size:12px;margin-top:6px;line-height:1.6}

/* ---------------- 表单 · M3 filled text field ---------------- */
.input,.textarea{width:100%;background:var(--sc-high);border-radius:var(--shape-xs) var(--shape-xs) 0 0;padding:13px 14px;font-size:14px;color:var(--on-surface);
  border:none;border-bottom:1px solid var(--on-surface-variant);box-sizing:border-box}
.input:focus,.textarea:focus{border-bottom:2px solid var(--primary)}
.input::placeholder,.textarea::placeholder{color:var(--outline)}
.textarea{min-height:120px;resize:none;line-height:1.6}
.formrow{padding:12px 18px 0}
.label{font-size:12px;font-weight:500;color:var(--on-surface-variant);margin:0 4px 8px;display:flex;justify-content:space-between}
.label em{font-style:normal;color:var(--outline);font-weight:400;font-size:11px}
/* M3 switch */
.switch{position:relative;width:52px;height:32px;border-radius:16px;background:var(--surface-variant);border:2px solid var(--outline);
  transition:background .22s var(--emph),border-color .22s;flex:none;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:50%;left:4px;width:16px;height:16px;border-radius:50%;background:var(--outline);
  transform:translateY(-50%);transition:all .22s var(--emph)}
.switch.on{background:var(--primary);border-color:var(--primary)}
.switch.on::after{width:24px;height:24px;left:auto;right:4px;background:var(--on-primary)}
/* M3 search bar */
.m3search{display:flex;align-items:center;gap:10px;background:var(--sc-high);border-radius:999px;height:52px;padding:0 18px;
  color:var(--on-surface-variant);font-size:14.5px;position:relative;overflow:hidden}
.m3search input{flex:1;font-size:14.5px;color:var(--on-surface)}
/* 独立二级页（新建/编辑长表单）：底栏常驻动作，内容区自己滚（SKILL §4：要滚动、要键盘、要保存的＝二级页） */
.pe-foot{flex:none;display:flex;gap:10px;align-items:center;padding:12px 16px;background:var(--surface);border-top:1px solid var(--outline-variant)}

/* ---------------- Snackbar（替代居中 toast） / 弹层 ---------------- */
#overlayRoot{position:absolute;inset:0;z-index:80;pointer-events:none}
#overlayRoot>*{pointer-events:auto}
.toast{position:absolute;left:16px;right:16px;bottom:36px;background:var(--inverse-surface);color:var(--inverse-on-surface);
  padding:14px 16px;border-radius:var(--shape-xs);font-size:14px;font-weight:400;max-width:none;text-align:left;line-height:1.5;
  box-shadow:var(--e2);animation:snIn .26s var(--emph)}
.toast.act{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 16px}
.toast-t{flex:1;min-width:0}
.toast-act{flex:none;height:36px;padding:0 12px;border:none;border-radius:var(--shape-xs);background:transparent;color:var(--inverse-primary);
  font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
.toast-act:hover{background:rgba(255,255,255,.10)}
.toast+.toast{bottom:100px}
@keyframes snIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.toast.bye{animation:snOut .2s ease forwards}
@keyframes snOut{to{opacity:0;transform:translateY(8px)}}
.sheet-scrim{position:absolute;inset:0;background:rgba(0,0,0,.32);animation:fade .22s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sc-low);border-radius:var(--shape-xl) var(--shape-xl) 0 0;box-shadow:var(--e3);color:var(--on-surface);
  animation:sheetUp .3s var(--emph);display:flex;flex-direction:column;max-height:86%;overflow:hidden}
.sheet.bye{animation:sheetDown .22s ease forwards}
/* 浮层内容区＝浮层唯一的滚轴：预览体取消内部上限后（ADR-0013），长素材靠这一层滚到底，
   grabber 留在这层之外（不跟着滚走）。min-height:0 让它在 max-height:86% 撞顶时真的收得住 */
.sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:none}
.sheet-body::-webkit-scrollbar{display:none}
@keyframes sheetUp{from{transform:translateY(60%);opacity:.5}to{transform:none;opacity:1}}
@keyframes sheetDown{to{transform:translateY(100%)}}
/* 微信发送效果模拟（接收方视角）：绿气泡 + 各类型附件消息（居中浮窗复用现成 .dlg/.dlg-card）
   预览体没有高度上限、不设内部滚动（ADR-0013）：卡片展开＝内容全展开，卡上不再有第二根滚轴——滚的永远是
   承载它的那一层（库列表/面板列表/悬浮面板/预览浮层），手势只归一个主人。此前「页面侧 30vh ＋ 面板 236px」
   的上限、底部渐隐与「共 N 条 · 滚动查看」提示已整条退休：藏起来的正文靠一句提示是声明不完的，而预览的
   全部意义就是「看清再发」——为省一屏高度把内容塞进滚轮，换来的是盲发风险与两根滚轴的抢夺。 */
.wx-sim{background:#EDEDED;border-radius:var(--shape-m);padding:12px}
/* 滚动指示层（通用 · M3 触屏惯例）：瞬时滚动条＝滚动中现身、停手即隐；原生滚动条一律藏起（容器自己
   scrollbar-width:none），由本层接管。轨道位置/长度由 sbScan 写内联样式——上下内缩随容器定（悬浮面板与
   底部浮层要避让 28dp 圆角，缩不够会被切头）。可滚容器一律可按住滑块拖，.sb-grab 是它的隐形按压区
   （只在条现身时存在）。规则表见 JS 的 SB_RULES */
.sb-ov{position:absolute;width:4px;z-index:2;opacity:0;transition:opacity .28s;pointer-events:none}
/* 子代选择器（>）不能写成后代选择器：一个宿主只认自己那一条指示层，写成后代会把里层容器的指示层
   一并点亮。同理 .sb-grab 也走子代 */
.sb-host.sb-on > .sb-ov{opacity:1}
.sb-ov i{position:absolute;left:0;width:4px;min-height:48px;border-radius:2px;background:var(--on-surface-variant);opacity:.45}
/* 按压区默认关死、只覆盖滑块那一段：.sb-ov 的 pointer-events:none 会给子元素继承下去，
   这里必须显式收回 auto，否则永远收不到 pointerdown（拖不动） */
.sb-grab{position:absolute;right:0;width:44px;display:none;pointer-events:auto;touch-action:none;cursor:grab}
.sb-host.sb-on > .sb-ov > .sb-grab{display:block}
.sb-grab.on{cursor:grabbing}
.wx-row{display:flex;justify-content:flex-end;margin-bottom:10px}
.wx-row:last-child{margin-bottom:0}
.wx-b{max-width:88%;background:#95EC69;color:#06380F;border-radius:10px;border-top-right-radius:3px;padding:8px 11px;font-size:13px;line-height:1.65;word-break:break-word}
.grabber{flex:none;width:40px;height:4px;border-radius:2px;background:var(--outline-variant);margin:10px auto 2px}
/* M3 basic dialog：卡本身可滚（长预览的「发送效果预览」浮窗是唯一会撑高的用途），
   居中改由 .dlg-card 的 auto 外边距吸收两侧余量——flex 容器自己滚动时 align-items:center 会把溢出部分
   顶到屏幕外且滚不上去，auto 外边距在没余量时归零，卡从顶部起滚；原生滚动条同样藏起交给指示层 */
.dlg{position:absolute;inset:0;display:flex;padding:20px 0;overflow-y:auto;scrollbar-width:none;animation:fade .2s}
.dlg::-webkit-scrollbar{display:none}
.dlg-card{margin:auto;width:min(328px,84%);background:var(--sc-lowest);border-radius:var(--shape-xl);padding:24px;box-shadow:var(--e3);
  animation:dlgIn .3s var(--emph)}
@keyframes dlgIn{from{opacity:0;transform:scale(.92)}}

/* ---------------- 宿主首屏 ---------------- */
/* 旧版「问候语 + 4×2 应用宫格 + 速览行」的壳已整体换掉（.host-hero、.nr-*、.newlist 一并删净），
   见下方「宿主 App 首页（素材推荐）」——那一版是自造口径，这一版照 Figma 778:169 复刻。
   注：注释正文里不要出现「星号紧跟斜杠」，那会把 CSS 注释提前闭合，紧跟其后的那条规则会被整条丢掉。 */
.wk-card{border-radius:var(--shape-m);background:var(--sc);overflow:hidden;position:relative}
.wk-file{display:flex;gap:11px;align-items:center;background:var(--sc-lowest);border-radius:var(--shape-s);padding:11px 13px}
.wk-file .f-ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.wk-link{background:var(--sc-lowest);border-radius:var(--shape-s);padding:12px 13px;display:flex;flex-direction:column;gap:10px}
.wk-link h6{font-size:13.5px;font-weight:500;color:var(--on-surface);line-height:1.45}
.wk-link .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.wk-link .src{font-size:11px;color:var(--on-surface-variant);display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-link .thumb{width:52px;height:52px;border-radius:6px;flex:none}
.wk-mm{display:flex;flex-direction:column;gap:9px}
.wk-mm-head{display:flex;align-items:center;gap:8px}
.wk-mm-ava{width:26px;height:26px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;flex:none}
.wk-mm-head b{font-size:12.5px;color:var(--on-surface)}
.wk-mm-txt{font-size:12.5px;line-height:1.65;color:var(--on-surface-variant);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.wk-info{padding:12px 15px 0}
.wk-info h5{font-size:16px;font-weight:500;color:var(--on-surface);line-height:1.4}
.wk-info p{font-size:11px;color:var(--on-surface-variant);margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wk-body{padding:10px 15px 0} /* 预览体外层：给预览面板留出与标识区同一道 15px 边距——预览体原先是卡首、与卡同宽同顶，移到卡中段后必须内缩，否则灰色/白色面板左右顶到卡缘、与自己那圈圆角互相咬（名字不叫 wk-prev：那个是已删净的「单气泡紧凑体」，别混） */
.wk-acts{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px 14px}
.wk-acts .btn{flex:1}
/* ---------------- 宿主 App 首页（素材推荐）· 照 Figma 节点 778:169 复刻 ----------------
   口径说明（与 M3 规范 SKILL.md 的关系）：
   · 视觉照抄设计稿——浅紫雾顶、渐变色标题字、大圆角白卡、彩色图标块、渐变描边选中 chip，全部保留；
     不把稿子「翻译」成 M3 令牌（用户明确选了「照抄 Figma 视觉」）。
   · 稿子给的是 750px@2x，本壳是 412dp：所有长度 ×0.549（=412/750），字号 ×0.549 后取整或半档。
   · 稿子全篇 PingFang_SC——换成本文件的 --f（Roboto/Noto Sans SC…）。字体栈是 M3 规范禁止清单里的一条，
     视觉可以照抄，字体栈不行。
   · 稿子底部那条 iOS home indicator 不画：本壳已有 Android 手势条（.sysnav），再叠一条就是两条。
   · 动作区图标仍是 ADR 定的三动作（保存素材／一键发送／一键发圈），只换成稿子的画法
     （浅底圆片 + 蓝色标签），不采用稿子的「下载／转发／朋友圈／更多」——那四个词在本产品里
     有两个（下载、更多）没有对应的既有行为，照抄会凭空多出两条死入口。
   · **顶栏那两件（页面标题「首页」／消息入口）也不在稿子上**——它不是口头追加，是**二期需求**
     （[二期 PRD](../docs/prd/云小助二期-PRD.md) §2.4；原题还带一枚搜索框，产品 2026-10-16 同日撤掉，
     见 ADR-0074），是本屏第四处刻意的出入。画法与前三处同源：照本屏既有的那一套（渐变字、
     白底圆钮），不另起一套。 */
#host-home{background:linear-gradient(180deg,#F2F3FE 0%,#F7F8FE 44%,#FFFFFF 100%)}
.hv-glow{position:absolute;left:0;right:0;top:0;height:260px;pointer-events:none;
  background:radial-gradient(122% 76% at 10% -4%,rgba(150,118,255,.22),transparent 62%),
             radial-gradient(118% 72% at 94% 2%,rgba(92,142,255,.17),transparent 60%)}
.hv-scroll{position:relative;z-index:1;padding:4px 18px 12px}
/* 顶栏两件（标题／消息入口，ADR-0074）：**一行**——标题左对齐、消息钮贴右缘。
   原先还画过一版搜索框（先后跟消息钮同排、再撤），产品 2026-10-16 定了「不要搜索框」，
   整条撤掉：`.hv-bar`／`.hv-srch` 连同 RIP_SEL 里那个选择器一并删净，不留在样式表里当摆设
   （本仓库的老规矩：退休的形态不许在 DOM 与 CSS 里留影子）。
   撤销的理由记在 ADR-0074 的「追加」一节：首屏的搜索落不到实处（宿主侧搜索不在本模块建模，
   点下去只有一句「演示范围外」），而它占的正是屏幕上最贵的一行——一个死入口不值这个价。 */
/* 标题与它离状态栏的距离**照工具页那一屏**（.ht-title 30/600/40、段头 padding-top 32）——
   两屏都是宿主底栏上的一级屏，摆一起要是一家人。本屏的 .hv-scroll 自带 4px 上内衬，
   故这里 28px（4+28=32）对齐工具页那个 32。 */
.hv-top{display:flex;align-items:center;gap:10px;padding-top:28px}
.hv-htitle{flex:1;min-width:0;font-size:30px;font-weight:600;line-height:40px;letter-spacing:.01em}
/* 消息入口：白圆钮 ＋ 右上角一枚未读点。点是**演示态**（同「今日概况」那六个数，不是真读数）——
   不给数字，免得凭空报出一个件数。flex:none 让它钉在右缘、不被标题挤走。 */
.hv-msg{position:relative;overflow:hidden;flex:none;width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:#2C5BD6;background:#fff;
  box-shadow:0 10px 20px -16px rgba(40,70,150,.95)}
.hv-msg .dot{position:absolute;right:9px;top:9px;width:8px;height:8px;border-radius:50%;
  background:#FF4D4F;box-shadow:0 0 0 2px #fff}
/* 渐变字：稿子上标题/数字/强调文字一律是「深海军蓝」或「紫→蓝」两族渐变实心字 */
.hv-gn{background-image:linear-gradient(96deg,#0F2A58,#2A62B4);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent}
.hv-gb{background-image:linear-gradient(96deg,#9452FF,#1677FE);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent}
/* 通知条：外框浅紫渐变，右上角压一颗光泽球（稿子上是个 3D 机器人头），下半行是更白的浅底条。
   上外边距 6px 是它当首件时定的（那时上面只有 .hv-scroll 的 4px 上内衬）；2026-10-16 顶上加了标题行，
   6px 贴在 44px 高的标题行下面太挤，放到 16px。 */
.hv-banner{position:relative;margin-top:16px;height:88px;border-radius:22px;overflow:hidden;
  background:linear-gradient(118deg,#EAE7FF 0%,#E7EFFE 50%,#F0EBFF 100%);
  box-shadow:0 10px 22px -16px rgba(60,80,190,.75)}
.hv-bl1{display:flex;align-items:center;gap:7px;padding:14px 0 0 16px}
.hv-bell{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(142deg,#FFD35C,#FF9A2E)}
.hv-dl{font-size:15px;font-weight:700;letter-spacing:.01em}
.hv-brow{position:absolute;left:14px;right:14px;bottom:9px;height:38px;border-radius:14px;
  background:rgba(255,255,255,.78);display:flex;align-items:center;gap:8px;padding:0 12px}
.hv-brow .tx{flex:1;min-width:0;font-size:14px;font-weight:500;color:#1D3B6B;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hv-go{flex:none;display:flex;align-items:center;gap:3px;font-size:13.5px;font-weight:700;position:relative;overflow:hidden;border-radius:8px;padding:2px 2px}
.hv-orb{position:absolute;right:10px;top:-9px;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(62% 58% at 33% 25%,#FFFFFF 0%,#DCD8FF 30%,#9E8CFF 57%,#63B9EA 100%);
  box-shadow:0 10px 20px -10px rgba(120,90,255,.8),0 0 0 3px rgba(255,255,255,.8)}
.hv-orb .face{width:31px;height:20px;border-radius:7px;background:#171B36;display:flex;align-items:center;justify-content:center;gap:2.6px}
.hv-orb .face i{display:block;width:2.6px;border-radius:2px;background:#fff}
/* 区块标题：标题字（渐深蓝）＋ ✦ ＋ 右侧动作 */
.hv-sect{display:flex;align-items:center;gap:6px;margin:20px 0 10px}
.hv-tt{font-size:18px;font-weight:700;display:flex;align-items:center;gap:4px;letter-spacing:.01em}
.hv-more{margin-left:auto;display:flex;align-items:center;gap:3px;font-size:13.5px;font-weight:700;
  position:relative;overflow:hidden;border-radius:8px;padding:3px 2px}
/* 今日概况：六枚指标卡一次摊开（3 列 × 2 行）——「待处理／今日成果」二选一已删，
   用户不需要先切一刀才看得全。排布＝横读是题、纵读是态：上排＝待办、下排＝同一批事做出来的成果，
   同列同题（完成／客户沟通／新增好友）。卡面照旧（白卡＋大号渐变数字）。 */
.hv-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.hv-stat{height:82px;border-radius:16px;background:#fff;box-shadow:0 10px 22px -18px rgba(40,70,150,.85);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.hv-stat b{font-size:28px;font-weight:700;line-height:1;letter-spacing:-.01em}
.hv-stat span{font-size:13px;font-weight:500;color:#5B81BD}
/* 快捷工作：五枚一行平铺——圆形渐变图标 + 底部功能名，不再各占一张白卡方块（方块把它们撑成 3×2、
   占掉近一屏，而它们只是入口；收成一排后整块高度 ≈ 原来的三分之一）。浅色光晕留作圆底衬
   （46px 圈托 36px 圆），保住稿子「彩色图标块」的画法，只是块变圆。
   五枚而不再是六枚：六枚时每格只剩 62px、最长那个名字被压成省略号，减一枚才排得开。 */
.hv-tools{display:flex;gap:4px;margin-top:2px}
.hv-tool{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:4px 0;position:relative;overflow:hidden}
.hv-tool .glow{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.hv-tool .sq{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.hv-tool .nm{font-size:11px;font-weight:600;line-height:1.25;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
/* 素材推荐：胶囊 chips + 圆角浅蓝行；行点开原位摊开白卡（预览＋动作） */
.hv-chips{display:flex;gap:9px;margin-bottom:14px}
.hv-chip{height:35px;padding:0 19px;border-radius:18px;background:#fff;border:1px solid #D6E0F2;
  font-size:14px;font-weight:700;color:#5B81BD;position:relative;overflow:hidden;flex:none;
  transition:border-color .2s,color .2s}
/* 选中 chip ＝「渐变描边 ＋ 渐变字」：两层背景——padding-box 铺白底、border-box 铺渐变，
   1.4px 的透明边框把下层渐变露出来当描边；文字再由行内 span 裁一次渐变。老 WebView 不吃这套时
   退化成白底深色字，仍可读 */
.hv-chip.on{border:1.4px solid transparent;padding:0 17.6px;
  background-image:linear-gradient(#fff,#fff),linear-gradient(96deg,#9452FF,#1677FE);
  background-origin:padding-box,border-box;
  background-clip:padding-box,border-box}
.hv-chip.on>span{background-image:linear-gradient(96deg,#8B4DFF,#1677FE);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent}
.hv-feed{display:flex;flex-direction:column;gap:13px;padding-bottom:6px}
.hv-row{display:flex;align-items:center;gap:8px;width:100%;min-height:58px;padding:0 13px 0 14px;
  border-radius:22px;background:#EDF1FC;text-align:left;position:relative;overflow:hidden;
  transition:background .2s var(--emph)}
.hv-row .tt{font-size:16.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;letter-spacing:.01em}
.hv-row .tag{flex:none;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;letter-spacing:.02em}
.hv-row .tag.new{background:#3ED46B;color:#fff}
.hv-row .tag.upd{background:#DBE8FB;color:#1677FE}
.hv-row .arw{margin-left:auto;flex:none;color:#22406F;display:flex;transition:transform .25s var(--emph)}
.hv-row .arw.on{transform:rotate(-90deg)} /* 展开时「›」转成「⌃」——稿子就是这个朝向（转 180° 会变成向左的「‹」，那是「返回」的意思） */
.hv-open{padding-top:2px}
/* 展开卡：稿子上是一张白卡套着预览体与一行动作。wkCard 自己已经是一层 .wk-card，这里再套一层 .hv-card
   只负责白底/圆角/投影，里层那层 .wk-card 的底色与圆角就近抹平（同库内六处调用点共用 wkCard，
   不能为了首屏这一处去改它） */
.hv-card{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 14px 30px -22px rgba(40,70,150,.9)}
.hv-card .wk-card{background:none;border-radius:0}
.hv-card .wk-info{padding:14px 14px 0}
.hv-card .wk-info:empty{display:none} /* bare=1 且无发圈提醒时标识区是空的，留一条 12px 的空隙没意义 */
.hv-card .wk-body{padding:12px 14px 0}
/* 动作区＝浅底圆片图标＋蓝色文字（稿子画法）。ADR 的三动作词不动，只换画法：覆盖 .wk-acts 定下的
   换行排布与胶囊底色，圆片靠 svg 自己的 padding 撑出来。:empty 收起——非编排素材 matActs 返回空串 */
.hv-card .wk-acts,#library .cmp-open .wk-acts{display:flex;flex-wrap:nowrap;gap:6px;margin-top:14px;padding:11px 6px 12px;border-top:1px solid #EEF1F8}
.hv-card .wk-acts:empty,#library .cmp-open .wk-acts:empty{display:none}
.hv-card .wk-acts .btn,#library .cmp-open .wk-acts .btn{flex:1;flex-direction:row;gap:7px;height:44px;padding:0;border-radius:12px;justify-content:center;
  background:none;background-image:none;color:#5B6BFF;font-size:13px;font-weight:700;box-shadow:none}
.hv-card .wk-acts .btn svg,#library .cmp-open .wk-acts .btn svg{width:14px;height:14px;padding:5px;box-sizing:content-box;border-radius:50%;background:#EEF2FE;flex:none}
.hv-empty{background:#EDF1FC;border-radius:22px;padding:18px;text-align:center;font-size:13.5px;font-weight:500;color:#5B81BD}
.hv-more-row{width:100%;padding:12px;text-align:center;font-size:13.5px;font-weight:700;color:#3B6BE0;
  background:#EDF1FC;border-radius:22px;position:relative;overflow:hidden}
/* 底部 Tab：宿主 App 的全局导航（素材库模块内不许有底部导航，宿主自己的可以有）。
   稿子那条 iOS home indicator 不画，只留浅顶影与选中软底 */
.hv-tab{flex:none;display:flex;align-items:center;padding:5px 10px 3px;background:#fff;
  box-shadow:0 -10px 22px -18px rgba(40,70,150,.95);position:relative;z-index:6}
.hv-tab button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0 4px;
  border-radius:16px;font-size:11.5px;font-weight:700;color:#274A80;position:relative;overflow:hidden;
  transition:background .2s var(--emph)}
.hv-tab button .ic{display:flex;color:#274A80}
.hv-tab button .lb{color:#274A80}
.hv-tab button.on:not(.ai){background:#EDF1FE}
.hv-tab button.on .ic{color:#1B3E7A}
/* 底栏第五枚「AI托管」：居中、抬起。参考原型的底部导航就是五枚、AI 居中那一枚探出栏外，
   本壳三屏的底栏同步加这一枚（见 JS 的 hvTabsHtml）。
   抬起靠这枚按钮自己向上顶出栏外（负 margin）＋一圈白描边压住栏沿——这样它仍然是一个普通 flex 项，
   不用绝对定位去猜栏高。按钮自己依旧要 overflow:hidden：涟漪得裁在这颗圆里，否则会在白栏上糊出一圈淡紫。
   这枚的整块按钮就是那颗圆，所以选中时不再叠那块软底（即上面 :not(.ai) 那一处）。 */
.hv-tab button.ai{overflow:hidden;border-radius:22px;margin-top:-18px;padding:0 0 3px;gap:2px}
.hv-tab button.ai .ic{width:42px;height:42px;border-radius:50%;color:#fff;align-items:center;justify-content:center;
  background:linear-gradient(140deg,#9B6BFF,#2E7BFF);
  box-shadow:0 10px 20px -10px rgba(96,84,255,.95),0 0 0 3.5px #fff}
.hv-tab button.ai .lb{color:#7B5BFF}

/* ---------------- 宿主 App 工具页（底部 Tab「工具」）· 2026-10-16 起照线上旗舰版截图重排 ----------------
   换的是内容表（分组与工具名，见 JS 里 HOST_TOOLS 上头那段），**这一段的画法一字未改**。 */
   口径与首屏那一版同：视觉照抄稿子（浅紫雾顶、粗圆角白模块卡、彩色图标块、紫→蓝渐变字），
   长度按 412/750 折算（×0.5493）；字体栈仍走 --f（稿子通篇 PingFang，打在 M3 禁止清单上）。
   稿子上每枚工具是一张 3D 彩色插画（六种画法循环复用：creature／bubble／keyboard／phone／hand／magnify），
   原型不带外部位图，这里用「同色系光晕 + 渐变圆角块 + 白色线性图标」还原（首屏「快捷工作」同套配色，
   只是那边为了横排六枚把块收成了圆——两屏摆一起仍是一家人）。 */
#host-tools{background:linear-gradient(90deg,#FDFDFF,#F7F8FE)}
/* 顶部的紫蓝雾：稿子上是一张 750×1630 的背景图，这里用两层径向渐变近似，到 ~520px 处化白 */
.ht-glow{position:absolute;left:0;right:0;top:0;height:520px;pointer-events:none;
  background:radial-gradient(86% 58% at 92% -8%,rgba(126,110,255,.40),transparent 66%),
             radial-gradient(124% 62% at 16% -14%,rgba(158,136,255,.26),transparent 64%)}
.ht-scroll{position:relative;z-index:1;padding:0 16px 14px}
.ht-head{position:relative;height:104px;padding-top:32px}
.ht-title{font-size:30px;font-weight:600;line-height:40px;letter-spacing:.01em}
.ht-chips{display:flex;align-items:center;gap:20px;margin-top:8px}
.ht-chip{display:flex;align-items:center;gap:5px;height:24px;font-size:14px;font-weight:600;
  border:0;background:none;position:relative;overflow:hidden;border-radius:8px}
.ht-chip svg{flex:none;color:#4E7BFF}
/* 顶右插画：稿子上是一张斜放的浅紫蓝玻璃卡（卡里一个 3D 人物），四周浮着四枚白色小胶囊标签。
   三层叠出来：底下一张转 -7° 的淡紫白卡作外框、上面一张同角度的玻璃卡、最前面立一个人（头＋肩）。
   稿子上是位图，这里是纯 CSS 的形——只求远看是「一个人站在卡片里」，不求像素级。 */
.ht-art{position:absolute;right:10px;top:-6px;width:152px;height:112px;pointer-events:none}
.ht-art-bg{position:absolute;left:44px;top:10px;width:100px;height:96px;border-radius:26px;
  background:linear-gradient(152deg,#F2F0FF,#DCE2FF);transform:rotate(-7deg);
  box-shadow:0 16px 28px -22px rgba(90,90,200,.9)}
.ht-art-card{position:absolute;left:53px;top:17px;width:86px;height:84px;border-radius:20px;overflow:hidden;
  background:linear-gradient(158deg,rgba(232,230,255,.95) 0%,rgba(184,202,255,.92) 52%,rgba(150,196,255,.9) 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.75);transform:rotate(-7deg)}
.ht-art-fig{position:absolute;left:73px;top:68px;width:46px;height:44px;border-radius:20px 20px 6px 6px;
  background:linear-gradient(178deg,#E4EDFF 0%,#C0D2FF 54%,rgba(158,184,255,.3) 100%)}
/* 头：一枚圆，顶上那 8px 用渐变直接涂深＝头发（比「深色圆＋脸圆」两层叠出来干净，不会变成黑甜甜圈） */
.ht-art-fig i{position:absolute;left:50%;top:-18px;width:26px;height:26px;margin-left:-13px;border-radius:50%;
  background:linear-gradient(180deg,#2E3358 0 8px,#FBE3C6 8px 100%)}
.ht-fl{position:absolute;background:#fff;border-radius:999px;padding:2px 7px;font-size:9.5px;font-weight:500;
  color:#403F81;white-space:nowrap;line-height:1.35;box-shadow:0 4px 10px -6px rgba(60,70,150,.85)}
/* 模块卡：稿子上的白卡，左上角压一层极淡的紫雾 */
.ht-mod{position:relative;margin-top:13px;border-radius:16px;background:#fff;padding:15px;
  overflow:hidden;box-shadow:0 12px 26px -22px rgba(46,72,150,.9)}
.ht-mod::before{content:"";position:absolute;left:0;right:0;top:0;height:96px;pointer-events:none;
  background:radial-gradient(58% 100% at 6% 0%,rgba(178,160,255,.20),transparent 70%)}
.ht-mh{display:flex;align-items:center;gap:5px;height:30px;position:relative}
.ht-mh svg{flex:none}
.ht-mh h4{font-size:16.5px;font-weight:600;letter-spacing:.01em}
.ht-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px 7px;position:relative}
.ht-item{display:flex;flex-direction:column;align-items:center;justify-content:center;height:88px;
  border-radius:14px;background:#fff;box-shadow:0 5px 12px -8px rgba(60,80,170,.55);
  position:relative;overflow:hidden;padding:0 3px}
.ht-il{position:relative;width:62px;height:54px;display:flex;align-items:center;justify-content:center;flex:none}
/* 光晕＝一枚极淡的同色系圆斑（稿子上插画周围的柔光），模糊 2px 化掉硬边——它只是氛围，不抢渐变块 */
.ht-halo{position:absolute;left:1px;top:0;width:60px;height:54px;border-radius:50%;filter:blur(2px)}
.ht-sq{position:relative;width:37px;height:37px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff}
.ht-nm{margin-top:3px;font-size:13px;font-weight:500;color:#2D528E;line-height:16px;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ht-nm.sm{font-size:12px} /* 稿子上五字以上的工具名自己降了一档（聊天窗口转发/微信运动点赞），照办 */
/* 七字的工具名（小红书评论互动）再降一档：12px × 7 字＝84px，格子只有 ~76px，.ht-nm 是 nowrap＋省略号，
   照 12px 排会把它截成「小红书评论…」。线上那版把长名压得更小、一名一行不折，故按它再降半档并去掉字距。 */
.ht-nm.xs{font-size:10.5px;letter-spacing:0}
/* 这一屏的底部 Tab 与首屏同一条宿主全局导航，只有选中位不同：选中底改紫、图标改紫（稿子上「工具」是彩色图标） */
#host-tools .hv-tab button.on:not(.ai){background:#EFEBFF}
#host-tools .hv-tab button.on .ic{color:#7B5BFF}
/* 这两条 id 规则比 .hv-tab button.ai 那几条重，会把 AI 那枚的白图标压成紫色——逐一压回来 */
#host-tools .hv-tab button.ai .ic{color:#fff}

/* ---------------- 宿主 App 任务页（底部 Tab「任务」）· 照 Figma 节点 267:6568 复刻 ----------------
   口径与首屏／工具页两版同：视觉照抄稿子（浅紫雾顶、粗圆角白卡、紫→蓝渐变字、彩色图标块），
   长度按 412/750 折算（×0.5493）；字体栈仍走 --f（稿子通篇 PingFang，打在 M3 禁止清单上）。
   稿子顶部那台「猫耳机器人＋放大镜＋Ai 胶囊」是一张 3D 插画，原型不带外部位图，用 CSS 拼一个同构的
   白猫耳机器人（同首屏光泽球、工具页顶右插画的画法：只求神似，不求逐像素）。
   ★ 三处**稿子管不着、由本项目规则定死**的，钉在这里免得日后被「对齐设计稿」改回去：
     ① 稿子把 2026-10-01 排在周一——那天实际是周四（稿子这张日历是画着看的，不是排出来的）。
        本屏日历**真能翻月**，照抄错位翻一次就露馅，故按真实历法算（周一为首列），
        只沿用稿子的「2026年10月 · 选中 4 日」。
     ② 稿子每格下面那行小字是农历。原型不内置农历表，改用浏览器自带的 Intl 中国历现算
        （'zh-CN-u-ca-chinese'）——是真数据不是编的；取不到时留空，老 WebView 退化成没这行小字，布局不塌。
     ③ 稿子底部那条 iOS home indicator 不画：本壳已有 Android 手势条（.sysnav），再叠一条就是两条。 */
#host-task{background:linear-gradient(180deg,#EAECFC 0%,#F3F5FE 38%,#FFFFFF 100%)}
/* 顶部紫雾：稿子上是一大片浅紫→浅蓝的渐变背景图，这里用两层径向渐变近似 */
.tk-glow{position:absolute;left:0;right:0;top:0;height:330px;pointer-events:none;
  background:radial-gradient(120% 70% at 88% -6%,rgba(146,132,255,.30),transparent 64%),
             radial-gradient(112% 66% at 6% 0%,rgba(122,166,255,.20),transparent 62%)}
.tk-scroll{position:relative;z-index:1;padding:0 18px 14px}
/* 页头：大标题＋副标题，右侧压一台猫耳机器人（纯装饰，不参与交互） */
.tk-head{position:relative;height:118px;padding-top:10px}
.tk-title{font-size:29px;font-weight:700;line-height:36px;letter-spacing:.01em}
.tk-sub{margin-top:6px;font-size:14px;font-weight:600;color:#4E7BFF;letter-spacing:.01em}
.tk-art{position:absolute;right:-4px;top:0;width:118px;height:112px;pointer-events:none}
.tk-art-glow{position:absolute;left:4px;top:2px;width:100px;height:90px;border-radius:50%;filter:blur(7px);
  background:radial-gradient(58% 58% at 52% 42%,rgba(150,130,255,.38),rgba(120,160,255,.10) 64%,transparent 80%)}
.tk-ear{position:absolute;top:9px;width:23px;height:23px;border-radius:9px 9px 3px 3px;background:#fff;
  box-shadow:0 4px 8px -6px rgba(90,80,190,.9)}
.tk-ear.l{left:36px;transform:rotate(-18deg)}
.tk-ear.r{right:34px;transform:rotate(18deg)}
.tk-head-b{position:absolute;left:30px;top:19px;width:60px;height:54px;border-radius:20px;
  background:linear-gradient(165deg,#FFFFFF,#F0F0FB);
  box-shadow:0 12px 22px -14px rgba(90,80,190,.85),inset 0 3px 0 #fff,inset 0 -2px 0 rgba(220,222,245,.9)}
.tk-visor{position:absolute;left:8px;top:12px;width:44px;height:25px;border-radius:10px;background:#1B2145;
  display:flex;align-items:center;justify-content:center;gap:4px}
.tk-visor i{width:4px;height:4px;border-radius:50%;background:#5FE3FF;box-shadow:0 0 6px #5FE3FF}
/* 两侧耳件：稿子上是紫→蓝的耳机块 */
.tk-sideb{position:absolute;top:15px;width:9px;height:21px;border-radius:5px;
  background:linear-gradient(180deg,#8E7BFF,#5B9BFF)}
.tk-sideb.l{left:-7px}.tk-sideb.r{right:-7px}
/* 放大镜＋文件＋Ai 胶囊：机器人手上那三件道具 */
.tk-glass{position:absolute;left:0;top:54px;width:25px;height:25px;border-radius:50%;border:4px solid #7FA8F5;
  background:rgba(255,255,255,.55)}
.tk-glass::after{content:"";position:absolute;left:-3px;bottom:-9px;width:4px;height:12px;border-radius:2px;
  background:#7FA8F5;transform:rotate(38deg)}
.tk-doc{position:absolute;left:34px;top:73px;width:36px;height:26px;border-radius:5px;
  background:linear-gradient(160deg,#fff,#EEF0FB);box-shadow:0 6px 12px -8px rgba(90,80,190,.85)}
.tk-ai{position:absolute;right:0;bottom:11px;padding:2px 7px;border-radius:8px;font-size:11px;font-weight:700;
  font-style:normal;background:linear-gradient(140deg,#B07CFF,#7B5BFF);color:#fff;
  box-shadow:0 6px 12px -8px rgba(140,90,255,.95)}
.tk-spk{position:absolute;width:12px;height:12px;background:linear-gradient(140deg,#FFB4E6,#B07CFF);
  clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
.tk-spk.s1{left:13px;top:2px}
.tk-spk.s2{right:5px;top:43px;transform:scale(.7)}
/* 三张统计卡：白→浅紫竖向渐变，圆角 16（稿子 216×150@2x）。红＝有异常要人管，与下面「执行异常」同一族色 */
.tk-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.tk-stat{height:82px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;background:linear-gradient(180deg,#EDEEFF 0%,#F6F7FF 56%,#FFFFFF 100%);
  box-shadow:0 12px 24px -20px rgba(46,72,150,.9)}
.tk-stat b{font-size:29px;font-weight:700;line-height:1;letter-spacing:-.01em}
.tk-stat span{font-size:13.5px;font-weight:600;color:#6C84B8}
.tk-red{color:#F2545B}
/* 区块标题（需处理／待办）＋右侧「全部 →」 */
.tk-sect{display:flex;align-items:center;margin:20px 0 10px}
.tk-st{font-size:17px;font-weight:700;letter-spacing:.01em}
.tk-all{margin-left:auto;display:flex;align-items:center;gap:3px;font-size:13.5px;font-weight:600;color:#6C84B8;
  position:relative;overflow:hidden;border-radius:8px;padding:3px 2px}
.tk-all svg{color:#3B6BE0}
.tk-list{display:flex;flex-direction:column;gap:12px}
/* 任务卡（需处理／待办两组共用）：左缘一道圆头彩条（稿子 4×170@2x），
   红＝执行异常、紫→蓝＝待办；右侧一列是「时间 / 动作钮」，上下顶开 */
.tk-card{position:relative;display:flex;align-items:stretch;gap:12px;width:100%;text-align:left;
  padding:14px 15px 14px 18px;border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg,#FBFBFE,#FFFFFF);box-shadow:0 14px 30px -26px rgba(40,70,150,.95)}
.tk-card::before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:3.5px;border-radius:0 3px 3px 0;
  background:linear-gradient(180deg,#9452FF,#1677FF)}
.tk-card.bad::before{background:#FF5C7A}
.tk-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;justify-content:center}
.tk-card .tk-main{gap:7px}
.tk-r1{display:flex;align-items:center;gap:8px;min-width:0}
.tk-r1 b{font-size:15.5px;font-weight:700;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-r2{font-size:13px;font-weight:600;color:#6E86B4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-r3{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:#9AA8C4}
.tk-r3 svg{flex:none}
.tk-tag{flex:none;font-size:11.5px;font-weight:700;padding:2.5px 7px;border-radius:5px;letter-spacing:.01em}
.tk-tag.pink{background:#FFF1F3;color:#F2545B}
.tk-tag.blue{background:#EEF5FF;color:#3B6BE0}
/* 绿／琥珀两档是 AI托管页借这枚标签时补的（已完成／待核对）。三档语义与任务页一致：
   绿＝做完了、琥珀＝等人看一眼、红／粉＝没做成要人管，不用再另起一套色 */
.tk-tag.green{background:#EAF9EF;color:#1C9B52}
.tk-tag.amber{background:#FFF6E4;color:#A65D00}
/* 原先还有一档灰（「已停用」），唯一的使用者是托管清单卡上那枚「常驻」——
   2026-10-14 那枚删掉之后全仓再无引用，一并删掉（见 ADR-0057）。 */
.tk-side{flex:none;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:12px}
.tk-time{font-size:12.5px;font-weight:600;color:#8C9BB8;white-space:nowrap}
.tk-btn{display:flex;align-items:center;gap:3px;height:30px;padding:0 12px;border-radius:999px;font-size:13px;
  font-weight:700;position:relative;overflow:hidden;white-space:nowrap}
.tk-btn.pink{background:rgba(255,124,99,.12);color:#FF6A4D}
.tk-btn.blue{background:rgba(86,103,255,.10);color:#5B6BFF}
/* 日历卡：稿子上是半透明白＋白描边＋背景模糊，圆角 18 */
.tk-cal{margin-top:20px;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.72);
  border:1px solid rgba(255,255,255,.92);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  box-shadow:0 16px 34px -28px rgba(46,72,150,.95)}
.tk-calh{display:flex;align-items:center;height:50px;padding:0 8px}
.tk-calt{flex:1;text-align:center;font-size:16px;font-weight:700;letter-spacing:.01em}
.tk-can{width:38px;height:38px;border-radius:50%;flex:none;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;color:#2A4A7E}
.tk-flip{display:flex;transform:rotate(180deg)}
.tk-wk{display:grid;grid-template-columns:repeat(7,1fr);padding:0 10px 2px;text-align:center;
  font-size:12.5px;font-weight:600;color:#B9BCD6}
.tk-wk span.on{color:#7C86B8}
.tk-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:3px;padding:2px 10px 8px}
.tk-d{position:relative;height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1px;overflow:hidden;background:none}
.tk-d.dim{pointer-events:none}
.tk-d b{font-size:14.5px;font-weight:700;color:#2A4A7E;line-height:1;position:relative;z-index:1}
.tk-d i{font-size:9px;font-style:normal;font-weight:500;color:#BFC6DC;line-height:1;position:relative;z-index:1}
.tk-d.sel::before{content:"";position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;
  border-radius:50%;background:linear-gradient(158deg,#7182FF,#5566F5);box-shadow:0 8px 16px -10px rgba(86,103,255,.95)}
.tk-d.sel b,.tk-d.sel i{color:#fff;-webkit-text-fill-color:#fff}
.tk-d .dot{position:absolute;right:5px;top:4px;width:5px;height:5px;border-radius:50%;background:#5667FF;z-index:2}
.tk-d.sel .dot{background:#fff}
.tk-calft{border-top:1px solid rgba(214,220,240,.7);padding:2px 0 4px}
.tk-more{width:100%;height:40px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:13.5px;
  font-weight:700;color:#5B6BFF;position:relative;overflow:hidden}
.tk-caret{display:flex;transform:rotate(-90deg)}
.tk-caret.up{transform:rotate(90deg)}
/* 分段器（任务页：全部／管理员下发／我加的；AI托管页：托管清单／工作日志）：白胶囊容器里一枚浅紫选中片 */
.tk-seg{display:flex;margin:18px 0 14px;padding:4px;border-radius:999px;background:#fff;
  box-shadow:0 10px 22px -20px rgba(40,70,150,.9)}
.tk-seg button{flex:1;height:36px;border-radius:999px;font-size:14px;font-weight:600;color:#5B7BC0;
  position:relative;overflow:hidden;transition:background .2s var(--emph),color .2s}
.tk-seg button.on{background:#EFEBFF;color:#7B5BFF;font-weight:700}
/* 任务清单行：时刻＋标题＋来源，角上一枚状态标（**三档**：绿＝已完成／琥珀＝逾期／红＝已失败，
   2026-10-15 补中间那档，见 tkBadge）。
   标贴着卡右上角，靠卡的 overflow:hidden 裁出圆角，自己只修左侧两角 */
.tk-tasks{gap:11px}
.tk-task{align-items:center;gap:13px;padding:14px 15px}
.tk-task::before{display:none} /* 清单行没有左缘彩条：稿子上彩条只在需处理／待办两组卡上 */
.tk-task .tk-main{gap:5px}
.tk-when{flex:none;font-size:14.5px;font-weight:700;color:#2A4A7E;letter-spacing:.01em}
.tk-badge{position:absolute;right:0;top:0;padding:5px 12px 5px 13px;border-radius:11px 0 0 11px;
  font-size:12px;font-weight:700;font-style:normal;color:#fff;letter-spacing:.02em;
  background:linear-gradient(140deg,#3FE07A,#20CC63)}
.tk-badge.fail{background:linear-gradient(140deg,#FF9A7A,#FF6A4D)}
/* 「逾期」那档（2026-10-15）：用的是琥珀那一族（与 .tk-tag.amber 同一个色系）。
   **不用红**：红在这套系统里一直是「出错了、要人管」（需处理组那枚「去处理」就是它），
   而逾期是「那天没做完」——没出错，只是时候过了，眼下也没有一个动作可点。 */
.tk-badge.late{background:linear-gradient(140deg,#FFCE85,#EFA22E)}
/* 这一屏的底部 Tab 与首屏／工具页同一条宿主全局导航，只有选中位不同：紫底紫标 */
#host-task .hv-tab button.on:not(.ai){background:#EFEBFF}
#host-task .hv-tab button.on .ic{color:#7B5BFF}
#host-task .hv-tab button.ai .ic{color:#fff} /* 同工具页：id 规则比 .ai 那几条重，压回来 */

/* 「创建任务」小球＋浮窗 · 2026-10-16 照产品给的**线上 App 任务页截图**加（二期 PRD §2.3）。
   截图那一屏：右下角一枚球，点开从底部升起一层浮窗，里面是**按平台分组的任务类型宫格**
   （微信任务／抖音任务／小红书任务）。本屏只加这两件——稿子那八段骨架（需处理／待办／日历／
   分段器／清单）一字未动，PRD §2.3 明文「现有分档与记录模块一概不动」。
   ★ 三处**截图管不着、由本项目规则定死**的，钉在这里免得日后被「对齐截图」改回去：
     ① 球的形状走 M3（SKILL.md §3 的 FAB 行：56dp、圆角 16dp、primary 纯色＋on-primary 图标、
        右 16、位于底导航之上）。**线上那枚是圆形白底彩图标**，不照抄——本壳一切 FAB／按钮一律
        纯色主色、禁渐变（SKILL.md §5 第 2 条）。要正圆得先改 SKILL，别只改这一处。
     ② 截图里那枚**白底蓝公文包**的球不是这一枚：那是宿主系统级浮层（同设置页那条注「本壳的悬浮球
        另有其屏」）。本球是任务页自己的「创建任务」入口，两者同屏时同时存在、互不相干。
     ③ 图标块沿用工具页那套「同色系光晕＋渐变圆角块」（.ht-* 一组直接复用，不另起一套）——
        线上那版是彩色品牌图标，本仓库照旧出白色线性图标（同工具页口径）。
   位置：右 16、底 16。底栏之上再留 16，得 bottom:98px——这个是量出来的，不是估的：
   .hv-tab 实测高 60（不是按 padding 算的 54），**底栏底下还有 .screen::after 那 22px 手势条占位块**
   （见 .screen 那段注释），栏顶实际距屏底 82；82＋16＝98。无头里逐点量过：球的底边距栏顶 16.0、
   距屏右边 16.0。
   z-index 7 要高过底栏那 6——球与 .hv-tab 是 .screen 的兄弟，不靠写在后面就压得住。
   ★ 球浮在**滚动区**（.tk-scroll 的视口底边就在栏顶 82 处）之上，所以清单滚到底时末条会钻到球底下
     ——无头里量过：滚到底时末条（.tk-card.tk-task）与球横竖各重叠 54×56px，球心那点抠出来是卡上的图标。
     即「最后一整条的右下角永远点不着」，这是加 FAB 必须一并给的**避让**（M3：滚动内容底边要让出 FAB 那一块），
     与「页面不动」不冲突——骨架、分档、记录模块都没碰，只是给滚动区多留一段底。
   ★ 避让只能管「滚到底」那一头。球是钉在屏上的，**屏中间任何东西滚过它都会被它压住**——首屏就有一处：
     日历卡头那枚「下一月」（.tk-can，38×31）正好落在球下面，量出来重叠 38×31＝**整枚盖满**，
     球心 hit-test 抠出来就是 .tk-fab。**这处不修**：线上截图那版球也在同一个角上、下面是同一张日历，
     产品就是这么出的稿；要「不压住」只能把日历头整体左移或把球挪位，那才是改稿子、才是「页面动了」。
     （滚一下日历就升走了，不是死路。）沿用现网版式，此条留档，别当 bug 修。 */
#host-task .tk-scroll{padding-bottom:80px} /* 14 是原稿的分隔留白，这里加到 80＝球顶距视口底 72（16 缝＋56 球）＋8 呼吸；
   id 选择器压得住 .tk-scroll 那条简写里的 padding，故不必回头改稿子 */
.tk-fab{position:absolute;right:16px;bottom:98px;z-index:7;width:56px;height:56px;border:none;
  border-radius:16px;background:var(--primary);color:var(--on-primary);cursor:pointer;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:0 8px 18px -8px rgba(58,48,180,.75)}
/* 浮窗那一层：外壳沿用全站那套底部弹层（openSheet 的 .sheet／.sheet-scrim／.sheet-body），
   这里只补「收起」那枚与内容区的内衬。截图顶上那一行**只有一枚 ∨、没有标题**，照它、不自造标题。
   （∨ 走 chev 转 90°——截图那枚是描边折角，不是实心三角。） */
.ct-head{display:flex;padding:0 13px}
.ct-col{width:44px;height:44px;margin-left:-7px;border:none;background:none;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--on-surface-variant);
  position:relative;overflow:hidden}
.ct-col svg{transform:rotate(90deg)}
.ct-body{padding:0 13px 18px}

/* ---------------- 宿主 App AI托管页（底部 Tab「AI托管」，居中抬起）· 逻辑照参考原型 APP-AI-001 ----------------
   口径说明：
   · **信息结构**照参考原型 APP-AI-001（V3.2→V5.25 层层叠出来的最终态）：页头一行两颗圆
     （托管总开关／全局设置）＋托管状态卡＋工作日志。
     **2026-10-16 撤掉一层**（见 ADR-0065）：原先状态卡下面还有一道「托管清单｜工作日志」分段器
     （另一版排法把清单拆成「管理员下发｜我加的｜工作日志」三栏），托管清单那一屏整块删了——
     它要回答的「托管接下来会替我做哪些事」，宿主任务页已经在回答，而清单只是那批活的一个子集视图。
     于是这一屏剩**一栏**：头卡讲"托管现在开着没有、按什么条件跑"，日志讲"它过去做过什么"。
     "我挂了哪几项能力"搬进了托管范围浮层（设置页那颗「管理托管范围」升起来的那层，两段里的下段）。
     工作日志按日倒序排时间线，每条挂「引用／动作／结果」三类子卡。
   · **视觉**一律归到本壳宿主三屏（首屏／工具／任务）那套语言：浅紫雾顶、粗圆角白卡、紫→蓝渐变字、
     「同色系光晕＋渐变圆角块」图标、渐变实心 ✦。参考原型那身蓝白皮不搬——两屏并排会立刻看出接缝。
   · 保存钮走本壳既有的 M3 filled 按钮（.btn-primary，纯色胶囊）——稿子那套渐变实心钮在
     SKILL.md 的禁止清单上。视觉可以照抄设计稿，控件不照抄。 */
#host-ai{background:linear-gradient(180deg,#EAECFC 0%,#F3F5FE 40%,#FFFFFF 100%)}
.hva-glow{position:absolute;left:0;right:0;top:0;height:340px;pointer-events:none;
  background:radial-gradient(120% 70% at 90% -6%,rgba(146,132,255,.32),transparent 64%),
             radial-gradient(112% 66% at 8% 0%,rgba(122,166,255,.20),transparent 62%)}
/* AI托管那屏的两层（2026-10-14）：.hva-head＝托管状态卡（不缩、不滚），
   .hva-pane＝工作日志（吃掉剩下的高，自己滚）。外层这一层**故意不带 .scroll 类**——
   带上就会有第二个滚动指示层（SB_RULES 挑 .scroll），而它自己一格都不滚。 */
.hva-scroll{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column}
.hva-head{flex:none;padding:0 18px}
.hva-pane{flex:1;min-height:0;padding:0 18px 24px} /* 底距 24：原先那 148px 是给右下悬浮球让位的（球底距 80＋球高 52＋余量），球 2026-10-16 撤了（ADR-0065），留着就是日志尾部凭空空一大截 */

/* ---------------- 宿主 App AI托管 · 升级提示页（**非旗舰版**点底栏那枚「AI托管」进的屏） ----------------
   2026-10-16 照 Figma 节点 543:140（750×1800）**整屏重画**：上一版是按二期 PRD §2.2 手搓的
   「圆标＋标题＋清单＋脚注」四件，这一版换成稿子那一屏（大标题／胶囊／主图／两枚标签／两张能力卡／
   一张开通卡／一枚渐变 CTA），落 ADR-0068。
   口径与工具页／任务页两版同：视觉照抄稿子，长度按 412/750 折算（×0.5493）；字体栈仍走 --f
   （稿子通篇 PingFang＋钉钉进步体，都打在 M3 禁止清单上）。
   底色不再沿用 .hva-glow（那是 AI托管主页那一身）：稿子自带一层浅紫底，顶端偏蓝紫、到 ~1500 设计px 化白，
   照它铺一条竖直渐变＋两团径向斑。
   稿子上那台机器人、翻开的日历、任务卡、两枚金色徽章都是 3D 位图，原型不带外部位图（ADR-0042），
   照既有画法用「同色系光晕＋渐变圆角块＋白色线性图标」还原，只求远看是那几件东西。
   版式：**一整段定高的定位容器 .hvu-top**（标题＋主图）。这一段的件是散着浮的——胶囊、两枚标签、
   机器人、日历、任务卡各在一处、互相叠着——按流排摆不出那种浮着的感觉，所以件一律按折算后的坐标绝对摆。
   坐标一律是「设计px × 0.5493 − 34」：减 34 是因为 .screen::before 已经占了状态栏那 34px，
   而稿子那 1800px 是从状态栏顶上量的。 */
#host-ai-up{background:linear-gradient(180deg,#E3E1FE 0%,#DCD8FE 11%,#E2DDFE 26%,#E7E4FE 40%,
  #ECE9FE 52%,#F1EFFF 64%,#F5F2FF 78%,#F8F4FF 90%,#F8F4FF 100%)}
.hvu-glow{position:absolute;left:0;right:0;top:0;height:989px;pointer-events:none;
  background:radial-gradient(58% 26% at 48% -4%,rgba(120,120,255,.42),transparent 72%),
             radial-gradient(46% 22% at 104% 5%,rgba(255,255,255,.55),transparent 74%)}
.hvu-scroll{position:relative;z-index:1;padding:0 0 28px}
.hvu-top{position:relative;height:272.5px;z-index:0}

/* 大标题：稿子左边压一枚 ✦，「AI托管」吃蓝→紫、「旗舰版专属」吃中蓝→藏青，各一支渐变字。
   78px × 0.5493 ＝ 43px，字距照折（-4/-6 → -2.2/-3.3）。
   ※ 渐变的都是**文字**，不是按钮——SKILL 第 5 节禁止清除清单第 2 条管的是按钮／FAB 的填充，文字不在其中。 */
.hvu-title{position:absolute;left:0;right:0;top:30px;height:46px;margin:0;
  display:flex;align-items:flex-start;justify-content:center;font-weight:700}
.hvu-title .sp{flex:none;width:15.5px;height:15.5px;margin:-3px -3px 0 0}
.hvu-title .sp svg{display:block}
.hvu-t{font-size:43px;line-height:46px;white-space:nowrap;
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hvu-t.b{background-image:linear-gradient(90deg,#1677FF 20%,#873DFF 100%);letter-spacing:-2.2px}
.hvu-t.n{background-image:linear-gradient(90deg,#245BB9 20%,#102953 100%);letter-spacing:-3.3px}

/* 主图周围那团柔白：稿子上机器人背后有一片晕开的白光。
   别给太重——它一沉下去，机器人的头就化进这团白里、整台只剩「一块白上一枚深面罩」（第一版就是这么翻的） */
.hvu-halo{position:absolute;left:118px;top:78px;width:186px;height:196px;border-radius:50%;pointer-events:none;
  background:radial-gradient(50% 50% at 50% 50%,rgba(255,255,255,.24),rgba(255,255,255,0) 66%);filter:blur(22px)}

/* 胶囊与两枚标签：稿子上都是「半透明白底＋更白的描边」的椭圆，字吃渐变 */
.hvu-pill,.hvu-tag{position:absolute;display:flex;align-items:center;border-radius:999px;
  background:rgba(255,255,255,.30);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.hvu-pill{left:67px;top:84.7px;width:278px;height:36.3px;padding:0 10.4px}
.hvu-pill .ic{flex:none;width:17.7px;display:flex;align-items:center;justify-content:center;transform:rotate(-5deg)}
.hvu-pill .t{margin-left:.5px;font-size:16.5px;font-weight:700;line-height:1;letter-spacing:-1.1px;white-space:nowrap;
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hvu-pill .t.b{background-image:linear-gradient(90deg,#1677FF,#9452FF)}
.hvu-pill .t.n{background-image:linear-gradient(90deg,#245BB9 20%,#102953 100%)}
.hvu-tag{width:93.4px;height:30.8px;padding-left:6.6px}
.hvu-tag.l{left:25.3px;top:192.3px}
.hvu-tag.r{left:282.9px;top:167.6px}
.hvu-tag .ic{flex:none;width:16.5px;display:flex;align-items:center;justify-content:center;transform:rotate(-5deg)}
.hvu-tag .t{margin-left:1.6px;font-size:15.4px;font-weight:700;line-height:1;letter-spacing:-.55px;white-space:nowrap;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  background-image:linear-gradient(90deg,#1677FF,#9452FF)}

/* ---- 主图：机器人（头／面罩／耳／身／手）＋ 翻开的日历 ＋ 任务卡 ----
   几何全部是从 543:140 的导图实测反推的：Figma 导图 625×1500（＝稿子 750 的 0.8333），
   换成手机坐标 = 导图 px × 0.6592。下面的 top／left 都相对 .hvu-robot（＝phone 120.3,139）。
   这一版把每件都拿两张图按同一个 layout 坐标扫过一遍（面罩实测 160→228／176→226、耳环亮圈
   254→268、颈圈紫带 180→245、日历 111→177、任务卡 247→310），坐标都对得上，
   剩下的差在**光**上：稿子上那台机器人整体偏冷蓝，越靠近面罩越蓝（面罩右侧 #BACEFF、
   下巴 #C8DBFF、耳朵 #7D9DFC），我们原来是通身淡紫，所以显得比稿子「闷」。
   下面几处渐变按实测调冷。 */
/* 整台机器人往右下投一层柔影：稿子上机器人右侧（x 250→340 那一竖条）比别处暗 12 上下，
   是它自己挡出来的。少了这层，机器人看着是「贴」在底上而不是「坐」在底上。 */
.hvu-robot{position:absolute;left:120.3px;top:105px;width:156px;height:175.8px;pointer-events:none;
  filter:drop-shadow(30px 8px 38px rgba(122,110,205,.30))}
/* 头：稿子那头是**四分之三视角**——头顶那圈最亮处偏右（实测 y154 一行，白的在 x185→238，
   而头的中心才 198），左边一路斜下去。CSS 摆不出透视，就用「高光右偏 ＋ 整颗头顺时针转 6°」
   近似：不转的话头是个正蛋，转完头顶才往右压、跟稿子的斜度对得上。
   颜色上**越往下越冷**：头顶正中 (195,155) 是纯白 #FEFEFD，贴着面罩那圈（左 (150,200)
   #D2E5FF、右 (238,196) #BACEFF、下巴 (195,238) #C8DBFF）全落到浅蓝，再往下接到脖子。
   第一版整颗吃的是淡紫→深紫，看着就比稿子「闷」且紫。 */
.hvu-head{position:absolute;left:28.7px;top:9px;width:99px;height:96px;transform:rotate(6deg);
  border-radius:52% 52% 46% 46%/56% 56% 44% 44%;
  background:linear-gradient(160deg,#FFFFFF 0%,#FBFDFF 22%,#DCEAFF 46%,#C2D6FF 70%,#ADCAFF 100%);
  box-shadow:0 18px 26px -20px rgba(78,66,180,.9),inset 0 0 0 1px rgba(255,255,255,.75)}
/* 面罩：一块从左下亮蓝斜着沉到右上近黑蓝的屏（实测最暗 #03064E、最亮 #6E63FF），
   四枚白点间距 12.4、点径约 8；点比面罩中线低约 3.8，用 padding-top 顶下去。
   外面那圈冷蓝是屏打到脸上的光——稿子面罩四周一大片是 #D2E5FF 那个调，少了它脸就是块死白 */
.hvu-visor{position:absolute;left:32.7px;top:39.6px;width:69.9px;height:48.8px;border-radius:18px;
  display:flex;align-items:center;justify-content:center;gap:4.4px;padding-top:7.6px;
  background:linear-gradient(105deg,#6E63FF 0%,#2A48EC 30%,#12229E 62%,#050940 100%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.32),0 8px 16px -10px rgba(20,20,90,.95),
    0 0 16px 1px rgba(150,200,255,.6)}
.hvu-visor i{width:8px;height:8px;border-radius:50%;background:#FFFFFF;flex:none;
  box-shadow:0 0 9px 2px rgba(150,205,255,.95)}
/* 耳：稿子上是枚耳机罩样的**蓝**环（外径 28×40，实测外圈 #A7AFFF、内圈 #7D9DFC），
   环里那圈亮青是内壁高光、中心再留一个小孔。它压在头的右缘上、还往外探出 11px，
   所以画在 head 之前（被头压住半边）。 */
.hvu-ear{position:absolute;left:126.7px;top:49px;width:28.2px;height:39.5px;border-radius:50%;
  background:linear-gradient(150deg,#C3CAFF 0%,#9AA5FB 36%,#7B8CF6 70%,#A8B2FD 100%);
  box-shadow:0 8px 16px -10px rgba(60,80,190,.85),inset 0 0 0 1px rgba(255,255,255,.45)}
/* 环里那圈不是整环，是只留着右边一段的「C」——稿子上耳机罩是斜看的，开口朝里 */
.hvu-ear::before{content:"";position:absolute;left:26%;top:22%;width:46%;height:56%;border-radius:50%;
  border:3.1px solid #DFEEFF;border-left-color:rgba(223,238,255,.25);
  box-shadow:0 0 0 1.1px rgba(255,255,255,.5)}
/* 身：稿子胸口到肚子是**纯白**（实测 (195,275) #FEFDFE），只有最下沿才收进淡紫 */
.hvu-body{position:absolute;left:24.7px;top:111px;width:108px;height:62px;border-radius:44px 44px 30px 30px;
  background:linear-gradient(180deg,#FFFFFF 0%,#FEFDFF 56%,#F1ECFF 82%,#DFD7FE 100%);
  box-shadow:0 14px 22px -18px rgba(78,66,180,.9),inset 0 0 0 1px rgba(255,255,255,.7)}
/* 颈圈：稿子是条饱满的紫带（顶上一线冷白高光，往下 #7A3CEC→#9E58FF→#B96FFF），不是淡紫 */
.hvu-collar{position:absolute;left:59.7px;top:103px;width:70px;height:22px;border-radius:999px;
  background:linear-gradient(180deg,#8FC8FF 0%,#7A3CEC 18%,#9E58FF 48%,#B96FFF 78%,#D3A9FF 100%);
  box-shadow:inset 0 1.5px 0 rgba(206,232,255,.95),0 8px 14px -10px rgba(96,52,200,.95)}
/* 手：稿子那两只手也是纯白（实测 (195,295) #FEFDFB），只有边缘收一点冷紫 */
.hvu-hand{position:absolute;border-radius:50%;
  background:radial-gradient(circle at 40% 32%,#FFFFFF,#FEFCFF 56%,#EFE9FF 84%,#DFD7FE);
  box-shadow:0 10px 16px -12px rgba(78,66,180,.9)}
.hvu-hand.l{left:18px;top:122px;width:34px;height:34px}
.hvu-hand.r{left:104px;top:120px;width:36px;height:36px}

/* 翻开的日历：白卡＋顶上两枚环＋一格打了勾。稿子上它压在机器人的左臂前、整体略向左倾。
   尺寸按实测收到 66×57（稿子上那枚蓝头是实打实的 #5A69FF，不是淡蓝） */
.hvu-cal{position:absolute;left:111px;top:210px;width:66px;height:57px;border-radius:11px;
  background:linear-gradient(172deg,#FFFFFF 0%,#F3F0FF 100%);
  box-shadow:0 14px 24px -16px rgba(70,70,170,.95),inset 0 0 0 1px rgba(255,255,255,.85)}
.hvu-cal-b{position:absolute;left:8px;top:-5px;width:10px;height:15px;border-radius:5px;background:#7BA2FF}
.hvu-cal-b+.hvu-cal-b{left:41px}
.hvu-cal-h{position:absolute;left:0;right:0;top:0;height:9px;border-radius:11px 11px 0 0;
  background:linear-gradient(90deg,#6E7CFF,#4E5DFF)}
.hvu-cal-g{position:absolute;left:5px;top:12px;right:5px;bottom:9px;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3.5px}
.hvu-cal-g i{border-radius:3px;background:#E4E9FF}
.hvu-cal-g i.on{background:#7BA2FF;display:flex;align-items:center;justify-content:center;color:#fff}

/* 任务卡：白卡＋右上角翻卷＋当中一块蓝紫渐变牌（牌里是列表线）＋右下角柱状图。稿子上它转着 -8° */
.hvu-task{position:absolute;left:234px;top:211px;width:75.4px;height:62px;border-radius:10px;
  transform:rotate(-8deg);overflow:hidden;
  background:linear-gradient(168deg,#FFFFFF 0%,#F2EFFF 100%);
  box-shadow:0 14px 24px -16px rgba(70,70,170,.95),inset 0 0 0 1px rgba(255,255,255,.85)}
.hvu-task::after{content:"";position:absolute;right:-1px;top:-1px;width:24px;height:24px;
  border-radius:0 10px 0 24px;background:linear-gradient(215deg,#DCD5FE,#FFFFFF)}
.hvu-tk-i{position:absolute;left:11px;top:13px;width:30px;height:30px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(158deg,#6E9BFF,#5B6BFF);box-shadow:0 6px 12px -8px rgba(70,60,180,.95)}
.hvu-tk-c{position:absolute;right:10px;bottom:9px;width:26px;height:22px;display:flex;align-items:flex-end;gap:3px}
.hvu-tk-c i{flex:1;border-radius:2px 2px 1px 1px;background:linear-gradient(180deg,#7BA2FF,#4B7BFF)}
.hvu-tk-c i:nth-child(1){height:42%}
.hvu-tk-c i:nth-child(2){height:72%;background:linear-gradient(180deg,#A48BFF,#8B5BFF)}
.hvu-tk-c i:nth-child(3){height:100%}

/* 铃铛：稿子上它探在日历右下方、机器人的左臂前，钟盘挂在铃的右上角 */
.hvu-bell{position:absolute;left:142.8px;top:237.4px;width:28.6px;height:31.8px;color:#5B7BFF;
  display:flex;align-items:center;justify-content:center}
.hvu-bell .c{position:absolute;right:-6px;top:-2px;width:16.5px;height:16.5px;border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center;color:#5B7BFF;
  box-shadow:0 4px 8px -6px rgba(70,70,170,.95),inset 0 0 0 1.4px #B9CDFF}

/* ---- 两个模块卡：稿子上就是「一圈更白的描边 ＋ 一层几乎看不见的淡紫底」的粗圆角块 ----
   原先这里铺的是 rgba(255,255,255,.34)，比稿子亮了 5～13：拿同一列量（x=20，落在模块卡里、
   内层卡外，避开所有元素）稿子 315→600 是 225→244、610→780 是 233→243，
   而我们 238→245、246→248——**稿子那张卡比它背后的底色还暗 1～5**，
   我们却是亮 4～9（到了页面底部渐变泛白，白底一叠就成一块奶白板）。
   去掉这层白，只留一点点冷紫压暗，差值就落回 −2 上下，跟稿子一个观感了。 */
.hvu-mod{position:relative;margin:0 16px;padding:16px 14px;border-radius:16px;
  background:rgba(146,140,200,.025);box-shadow:inset 0 0 0 1px rgba(255,255,255,.85)}
.hvu-mod+.hvu-mod{margin-top:13px}
.hvu-mh{display:flex;align-items:center;gap:7px;padding-left:2px}
.hvu-mh h4{margin:0;font-size:17.6px;font-weight:600;line-height:19px;letter-spacing:.01em;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  background-image:linear-gradient(90deg,#245BB9 20%,#102953 100%)}
/* 模块标题左边那枚徽章：稿子上是两枚金色 3D 徽章（一枚皇冠、一枚卡牌），这里收成一枚金渐变圆角块＋
   白线图标＋暖色光晕（同 .ht-sq 那套画法）。负 margin 让它不撑高表头那一行——表头高按标题行算。 */
.hvu-badge{position:relative;flex:none;width:34px;height:34px;margin:-8px 0;border-radius:11px;
  display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(152deg,#FFF4D2 0%,#FFDE93 48%,#F4B765 100%);
  box-shadow:0 8px 14px -10px rgba(214,150,60,.8)}
.hvu-badge::before{content:"";position:absolute;left:-6px;top:-5px;right:-6px;bottom:-5px;border-radius:50%;
  background:radial-gradient(50% 50% at 50% 50%,rgba(255,208,124,.42),transparent 70%);filter:blur(3px);z-index:-1}

/* 能力卡：白卡（近白，顶浅底更浅）＋行首一枚渐变描边图标＋渐变标题＋一行说明 */
.hvu-card{margin-top:9.5px;padding:13px 13px 10px;border-radius:14px;
  background:linear-gradient(180deg,#FAF9FF 0%,#FDFCFF 100%);
  box-shadow:0 8px 18px -14px rgba(60,80,170,.85)}
.hvu-ch{display:flex;align-items:center;gap:7px;height:19px}
.hvu-ch .ic{flex:none;width:19px;height:19px;display:flex;align-items:center;justify-content:center}
.hvu-ch h5{margin:0;font-size:17.6px;font-weight:600;line-height:19px;letter-spacing:-.5px;white-space:nowrap;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  background-image:linear-gradient(90deg,#1677FF,#9452FF)}
/* 说明行缩进到跟标题同一条起跑线（图标 19 ＋ 间距 7 = 26，稿子量出来 39.6−13 = 26.6）。
   换行照稿子——稿子那三段是**各自独立的 <p>**（配 whitespace-nowrap），不是让它自己折：
   随浏览器折会折在「…条件后自动开／始」这种地方，跟稿子对不上。 */
.hvu-cd{margin:6px 0 0 26px;font-size:13.2px;line-height:17.6px;color:#2D528E}

/* 开通卡：一张白卡里横排三步（渐变块图标＋两行渐变字），步与步之间一枚点线箭头 */
.hvu-how{position:relative;margin-top:9.5px;padding:12px 14px 10px;border-radius:14px;
  background:linear-gradient(180deg,#FAF9FF 0%,#FDFCFF 100%);
  box-shadow:0 8px 18px -14px rgba(60,80,170,.85);display:flex}
.hvu-step{flex:1;display:flex;flex-direction:column;align-items:center}
.hvu-sq{width:33px;height:33px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(158deg,#7EA8FF 0%,#4B7BFF 46%,#8B5BFF 100%);
  box-shadow:0 8px 14px -10px rgba(70,60,180,.95)}
.hvu-sl{margin-top:4.5px;font-size:13.2px;line-height:19.8px;text-align:center;letter-spacing:-.2px;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  background-image:linear-gradient(90deg,#245BB9 20%,#102953 100%)}
.hvu-arrow{position:absolute;top:22.5px;width:20px;height:7px;color:#93A0FF;transform:translateX(-50%)}
.hvu-arrow.a{left:33.333%}
.hvu-arrow.b{left:66.667%}

/* 底上那枚 CTA 整段已去掉（2026-10-16，产品定）：稿子 543:140 底上是一条蓝→紫渐变胶囊
   （`.hvu-cta` ＋ ::after 高光 ＋ 右端那枚白 ✦／hvuSpkW），这里连样式一并删干净——
   员工端没有可执行的动作，理由写在 #host-ai-up 标记里那段注释。
   ※ 这一删顺带把「渐变胶囊按钮」那条例外带走了：本屏现在只在**图标**上吃渐变（✦／标签图标／
     能力卡行首／三步方块），而 SKILL §5 第 2 条管的是按钮／FAB 的**填充**——所以那条例外不用开了，
     `#aiPanel` 仍是唯一豁免。 */

/* 三颗圆形动作：托管总开关／AI配置／设置。形态照用户给的那张截图（白圆、圆内描边图标、圆下小字），
   配色仍走本 App 这套 token，不搬截图那身车机的皮。
   位置：托管状态卡的右上角空白处（用户指定）。那块的柔光是装饰，圆钮压在上面正合适——
   卡片右上原本什么都没有，三颗圆进去等于白捡一块地方，页头也就不必再占一行。
   尺寸是让出来的：卡片内宽 344，左边「头像＋两行字」要吃掉约 185，剩给三颗圆的就 150 左右，
   于是圆取 44、间距 7（3×44＋2×7＝146）。再大就会把「智能托管伙伴 · 小助」挤成省略号。
   开关那颗开着时圆翻成主色渐变＋白图标：截图里那颗白圆配「已关闭」正是关态该有的样子，
   开态得反过来一眼能认出来，否则同一个圆只能靠底下那行小字读状态，等于没有状态。
   圆单独一层（.hva-qkcir）是为了让它自己吃按压波纹——波纹要贴着圆裁，挂在外面那层
   （列布局，圆＋小字）上会顺着整列铺开，糊一片。
   z-index:1 是为了压过卡片那团柔光（.hva-hero::after，它是伪元素、默认画在子元素之上）。
   名字走 quick 不走 act：工作日志里那条动作清单（hvaLogHtml 的 .hva-acts）已经占了 acts 这个词，
   再叫 hva-act* 会让「日志条目里那排动作标签」和「卡片上这排圆钮」在样式表里撞成一条规则。 */
.hva-quick{flex:none;position:relative;z-index:1;display:flex;gap:7px}
.hva-qk{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;
  background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit}
.hva-qkcir{position:relative;overflow:hidden;width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:#fff;color:#2D528E;
  box-shadow:0 7px 15px -11px rgba(50,80,180,.95)}
.hva-qk small{font-size:11px;font-weight:600;color:#5B7BC0;line-height:1;white-space:nowrap}
.hva-qk.on .hva-qkcir{background:linear-gradient(148deg,#8E7BFF,#4E7BFF);color:#fff;
  box-shadow:0 9px 18px -10px rgba(90,84,249,.95)}
.hva-qk.on small{color:#4A5FC8}
/* 托管状态卡＝本屏的主开关面。开关／条件／当前状态三件事要一眼看全，所以它不是一条设置行，是一张卡。
   右侧那团柔光是稿子上大机器人头像的替身（同首屏光泽球、工具页顶右插画：只求神似，不求逐像素） */
.hva-hero{position:relative;border-radius:20px;padding:15px 16px 14px;overflow:hidden;
  background:linear-gradient(150deg,#F4F1FF 0%,#EDF2FF 56%,#FBFBFF 100%);
  box-shadow:0 14px 30px -24px rgba(60,80,190,.95)}
.hva-hero::after{content:"";position:absolute;right:-28px;top:-34px;width:126px;height:126px;border-radius:50%;
  pointer-events:none;background:radial-gradient(60% 60% at 40% 40%,rgba(160,140,255,.30),transparent 70%)}
.hva-htop{position:relative;display:flex;align-items:center;gap:11px} /* 卡片第一行：头像＋两行字（.hva-hmain 撑开）＋右上那三颗圆 */
.hva-orb{flex:none;width:50px;height:50px;border-radius:15px;position:relative;overflow:hidden;color:#fff;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(158deg,#8E7BFF,#5B9BFF);box-shadow:0 10px 20px -12px rgba(110,90,255,.95)}
.hva-orb::after{content:"";position:absolute;inset:0;background:linear-gradient(150deg,rgba(255,255,255,.42),transparent 62%)}
.hva-orb svg{position:relative;z-index:1}
.hva-hmain{flex:1;min-width:0} /* 撑开，把三颗圆顶到卡片右缘；min-width:0 让长文案截断而不是把圆挤出去 */
.hva-kicker{display:block;font-size:12px;font-weight:700;color:#526FD2;margin-bottom:2px}
.hva-hmain h2{font-size:19px;font-weight:700;line-height:1.28;letter-spacing:.01em}
.hva-cond{display:flex;align-items:center;gap:7px;margin-top:10px;border-radius:12px;padding:9px 11px;
  background:rgba(255,255,255,.82);font-size:12.5px;font-weight:700;color:#355276}
.hva-cond svg{flex:none;color:#6B7BE0}
.hva-sub{margin:2px 0 14px} /* 员工列表那两层筛选用的是同一个 .tk-seg，只在这里统一修上下距 */
/* 托管清单那一整族的版式（栏头 .hva-grp／计数 .hva-n／视图分段器 .hva-view／清单 .hva-list／
   清单卡 .hva-card…／来源角标 .hva-ctl .hva-when .hva-min／图标层 .hva-cic 及其 22px 缩版）
   2026-10-16 整块删（见 ADR-0065）。这里不再留这些选择器的空规则：
   同一批类名如果只活在样式表里、DOM 里一个都没有，下一个人读到的是一份"还在用"的假账。
   留下的两条是别处在用的：.hva-sub（员工列表那两层筛选的分段器间距）、
   以及下面那套浮窗外壳（.hva-sheetwrap／.hva-sheet／.hva-mask…，多开账号浮层与范围浮层共用）。 */
/* 底部浮窗的**外壳**（多开账号浮层与托管范围浮层共用；「加入托管清单」那一层随清单一屏删了，ADR-0065）。
   照参考原型 V5.9——它把「跳一个目录页」改成「壳内从底部升起一层」：
   遮罩点一下就关，浮层贴底、只圆上两个角，顶上一条把手，列表自己滚。
   挂点选在整屏那一层（不在 .hva-scroll 里）：前者是 position:absolute 的整屏容器，
   浮层贴的才是屏幕底边；塞进滚动容器里，遮罩会跟着内容一起滚走。 */
.hva-sheetwrap{position:absolute;inset:0;z-index:9;display:none}
.hva-sheetwrap.on{display:block}
.hva-mask{position:absolute;inset:0;background:rgba(16,28,52,.42);animation:hvaFade .18s ease-out}
.hva-sheet{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;max-height:74%;
  background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -12px 34px -16px rgba(20,40,80,.6);
  animation:hvaUp .26s cubic-bezier(.22,.9,.32,1)}
.hva-grab{flex:none;width:36px;height:4px;border-radius:2px;background:#DFE4EE;margin:9px auto 3px}
.hva-shead{flex:none;display:flex;align-items:flex-start;gap:10px;padding:6px 16px 8px}
.hva-shead b{display:block;font-size:16px;font-weight:700;color:#17263F}
.hva-shead small{display:block;margin-top:3px;font-size:12px;font-weight:500;color:#71809A}
.hva-sx{margin-left:auto;flex:none;width:32px;height:32px;border-radius:50%;background:#F1F4F9;color:#5C6B80;
  font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.hva-slist{flex:1;overflow-y:auto;padding:2px 12px calc(12px + env(safe-area-inset-bottom));scrollbar-width:none}
/* 浮窗里的段头。浮窗里那一摞是"分几段各讲一件事"，段头就是个安静的小标题，
   不做成分段器（这里没有「切换」这回事）。**托管范围那层有两段**（类型／我挂的能力，见 ADR-0065），
   多开账号那层只有一段；同一种标题样式，不必因为段数不同另立一条。 */
.hva-sgrp{margin:6px 8px 4px;font-size:12px;font-weight:700;letter-spacing:.02em;color:#71809A}
@keyframes hvaUp{from{transform:translateY(103%)}to{transform:none}}
@keyframes hvaFade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.hva-sheet,.hva-mask{animation:none}}
/* 就地重画（挂完一枚能力之后，见 hvaMine 的 quiet）：只免掉动画（面板上滑＋遮罩淡入），其余一样。
   遮罩也得免：它跟面板同一次 innerHTML 重建，只留面板不动的话，点一下遮罩会闪一下。 */
.hva-sheet.quiet,.hva-mask.quiet{animation:none}
/* 工作日志：按日倒序的时间线。日分隔＝两侧细线夹一个「日／月」；每条＝时间点＋竖线＋正文＋三类子卡 */
.hva-day{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.hva-day .ln{flex:1;height:1px;background:linear-gradient(90deg,transparent,#D8DFF2)}
.hva-day .ln.r{background:linear-gradient(90deg,#D8DFF2,transparent)}
.hva-day .d{display:flex;align-items:baseline;gap:3px}
.hva-day .d b{font-size:17px;font-weight:700;line-height:1}
.hva-day .d small{font-size:11.5px;font-weight:600;color:#8C9BB8}
.hva-entry{position:relative;padding:0 0 20px 34px}
.hva-entry::before{content:"";position:absolute;left:12px;top:22px;bottom:2px;width:2px;border-radius:2px;background:#E4EAF6}
.hva-entries .hva-entry:last-child{padding-bottom:4px}
.hva-entries .hva-entry:last-child::before{content:none}
.hva-time{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.hva-time .dot{position:absolute;left:5px;top:1px;width:17px;height:17px;border-radius:50%;color:#7B5BFF;
  display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 0 0 2px #E4EAF6}
.hva-time b{font-size:14.5px;font-weight:700;color:#2A4A7E;letter-spacing:.01em}
.hva-body p{font-size:13.5px;line-height:1.72;color:#314966}
.hva-body p em{font-style:normal;font-weight:700}
.hva-quote{margin-top:9px;border-radius:12px;padding:9px 12px;font-size:12.5px;line-height:1.6;color:#5B7099;
  background:#F4F6FC;box-shadow:inset 2.5px 0 0 #C9D6EF}
.hva-acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.hva-acts span{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:999px;
  font-size:12px;font-weight:700;color:#5B6BFF;background:rgba(86,103,255,.09)}
.hva-acts span svg{flex:none}
.hva-box{margin-top:9px;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.62;color:#3A4B66;
  background:linear-gradient(150deg,#F6F4FF,#F1F5FF);box-shadow:inset 0 0 0 1px rgba(200,208,245,.75)}
.hva-box b{display:flex;align-items:center;gap:4px;margin-bottom:4px;font-size:12.5px;font-weight:700}
/* 这里曾是右下那颗「添加托管动作」悬浮球（52px 渐变圆，稿子上它底下还有一行小字）。
   2026-10-16 随托管清单一屏一起删（ADR-0065）：它拉起来的浮窗就是"往清单里加一条"，
   清单不在，它没有落点。挂／摘能力现在在托管范围浮层里（设置页那颗「管理托管范围」）。 */

/* ---------------- 宿主 App AI配置 / 员工详情 / 全局设置（二级页）· 逻辑照参考原型 APP-AI-002/003/005 ----------------
   口径与主页面同：结构照参考原型，视觉归到本壳。三屏共用一套表单件（.hva-form／.hva-cell），
   因为它们在参考原型里就是同一套表单的三张脸——各写一套，改一处就对不齐一处。
   两层筛选（来源三档 × 归属两档）都用同一枚白胶囊分段器（.tk-seg）：语义相同（互斥单选）就同控件，
   不做两种筛选样式——用户不该为了同一个动作认两套长相。 */
#host-ai-cfg,#host-ai-agent,#host-ai-set,#host-ai-act{background:linear-gradient(180deg,#F1F3FD 0%,#F8F9FE 28%,#FFFFFF 100%)}
.hva-pg{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:0 16px 18px}
.hva-pg::-webkit-scrollbar{display:none}
.hva-pad{padding:0 16px}
.hva-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.hva-agent{display:flex;flex-direction:column;gap:9px;padding:14px 13px 13px;border-radius:16px;text-align:left;
  position:relative;overflow:hidden;background:linear-gradient(180deg,#FBFBFE,#FFFFFF);
  box-shadow:0 14px 30px -26px rgba(40,70,150,.95)}
.hva-agent .av{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  color:#fff;position:relative;overflow:hidden}
.hva-agent .av::after{content:"";position:absolute;inset:0;background:linear-gradient(150deg,rgba(255,255,255,.4),transparent 60%)}
.hva-agent .av svg{position:relative;z-index:1}
.hva-agent b{font-size:15px;font-weight:700;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hva-agent .ds{font-size:11.5px;line-height:1.55;color:#8C9BB8;min-height:36px;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
/* 这一屏兼作**两处**的「数智员工选择」页（ADR-0053 的辅助回复用谁 ＋ ADR-0062 的托管由谁执行）：
   选择模式下，当前那一位在卡右上角挂一枚主色对勾。两处进的是同一张名单、同一套卡，
   差的是一个 pick 标签（见 hvaPickCur／hvaPickTo）——所以对勾**不能看某一处**，
   否则两个问题里必有一个答的是另一个的答案。卡右上角在竖排卡里本来就是空的
   （头像／名／摘要／状态行各占一行）。 */
.hva-agent .pk{position:absolute;right:10px;top:10px;width:20px;height:20px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:var(--primary);color:#fff}
.hva-agent .ft{display:flex;align-items:center;gap:5px}
/* 卡尾那一位就是「当前托管」（2026-10-15，ADR-0062）。**全表最多一枚**：托管只由一位执行，
   所以这里是不带开关的标记，不是状态——原先那枚「已开启托管／未开启」能答出两位都参与。
   绿＝正在替你干活，与主页面那张托管状态卡同一套颜色语言。 */
.hva-agent .st{font-size:11.5px;font-weight:700}
.hva-agent .st.on{color:#1C9B52}
/* ---------- 「AI智能回复」那一屏的首卡：当前托管的这位 ＋ 更换（2026-10-15，ADR-0062）----------
   横向一行：头像 ｜ 名／摘要 ｜ 「更换」。摘要两行截断，卡高才稳得住（五位员工各有长短）。
   这一卡**不写卡标题**（同一页其它卡都写）：卡面自己就是一句话「托管由这位执行」，
   再冠一行「执行人」只是把同一件事说两遍。 */
.hva-host{display:flex;align-items:flex-start;gap:12px;padding:15px 15px 0}
.hva-host .av{flex:none;width:44px;height:44px;border-radius:15px;display:flex;align-items:center;
  justify-content:center;color:#fff;position:relative;overflow:hidden}
.hva-host .av::after{content:"";position:absolute;inset:0;background:linear-gradient(150deg,rgba(255,255,255,.4),transparent 60%)}
.hva-host .av svg{position:relative;z-index:1}
.hva-host .tx{flex:1;min-width:0}
.hva-host .tx b{display:block;font-size:15px;font-weight:700;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hva-host .tx .ds{font-size:11.5px;line-height:1.55;color:#8C9BB8;margin-top:3px;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.hva-host-sw{flex:none;height:32px;padding:0 14px;border-radius:16px;font-size:13px;font-weight:700;
  color:var(--primary);background:#EEF2FE}
.hva-tag{font-size:11.5px;font-weight:700;padding:2.5px 7px;border-radius:5px;background:#EEF2FE;color:#5B6BFF}
/* 表单卡：白底、圆角 18、行间一道 1px 分隔线。整屏就这一种卡片，行与行只差内容 */
.hva-form{margin-bottom:14px;border-radius:18px;background:#fff;overflow:hidden;
  box-shadow:0 14px 30px -26px rgba(40,70,150,.95)}
.hva-cell{display:flex;align-items:center;gap:12px;width:100%;padding:14px 15px;text-align:left;
  position:relative;overflow:hidden;background:none}
.hva-cell+.hva-cell{box-shadow:inset 0 1px 0 #EFF2F9}
.hva-cell .lb{flex:none;width:70px;font-size:13.5px;font-weight:700;color:#2A4A7E}
.hva-cell .vl{flex:1;min-width:0;font-size:13.5px;color:#5B7099;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hva-cell .vl.ph{color:#A9B6CD}
.hva-cell .cv{flex:none;color:#B6C2D6;display:flex}
.hva-lock{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:#F2F4FA;color:#93A3BC}
.hva-form .tk-seg{margin:0}
.hva-segpad{padding:0 15px 15px}
.hva-form-h{display:flex;align-items:center;gap:5px;padding:14px 15px 2px;font-size:13.5px;font-weight:700;color:#2A4A7E}
.hva-txt{padding:0 15px 15px;font-size:13.5px;line-height:1.72;color:#5B7099}
.hva-txt.ph{color:#A9B6CD}
/* 多开托管那一格（照线上那屏）：标题（带必设星号）＋右侧「设置 ⚙」一行，下面一句话说明，
   再下面一行已选摘要。它是本壳里唯一一枚竖排的 .hva-cell——「设置」得跟标题同一行，
   而 .hva-cell 是横向 flex，所以另起一个竖排变体，不去改横排那条。 */
.hva-cellcol{display:block;padding:14px 15px}
.hva-mthd{display:flex;align-items:center;gap:8px}
.hva-mthd b{font-size:15px;font-weight:700;color:#17263F}
.hva-mthd .req{color:#E5484D;margin-left:1px}
.hva-setlink{margin-left:auto;flex:none;display:flex;align-items:center;gap:4px;height:32px;padding:0 8px;
  border-radius:16px;color:#2E6BFF;font-size:13.5px;font-weight:700;position:relative;overflow:hidden}
.hva-mtsub{margin-top:5px;font-size:13px;line-height:1.6;color:#71809A}
.hva-mtval{margin-top:9px;font-size:12.5px;line-height:1.5;color:#2D528E}
.hva-mtval.ph{color:#A9B6CD}
/* 托管范围那一卡（照参考截图）：一行＝一类可托管的活，右边一颗减号把它交回「不托管」；
   底下一条虚线框的「管理托管范围」升起托管范围浮层，那层里是两段——
   上段＝这 9 类后台任务的勾选表，下段＝「我挂的能力」（挂／摘 ＋ 进各项的配置页，见 .hva-crow）。
   **这一卡只列类型那 9 行**，不在卡上再摆一份能力清单：同一个列表不摆两处（ADR-0056／0062／0063 的口径），
   能力那半只住在浮层里（ADR-0065 把「我加的」那 3 项从撤掉的清单搬过来时定的）。
   行头那三横（≡）照截图摆着，但它是**静态引头**：这张表是一份集合，顺序不表达任何东西，
   真要能拖就是在承诺一件没意义的事（理由见 ICONS 里 grip 那条）。所以它不挂事件、不给按压反馈。
   减号是一枚 30px 圆、浅灰底（.hva-scope-x i 自带这套皮，2026-10-16 起不再借清单卡上那枚
   .hva-min——它随托管清单一屏走了，见 ADR-0065）——全 App 的减号长一个样；

.pk-sys{font-size:10.5px;color:var(--outline);flex:none;border:1px solid var(--outline-variant);border-radius:6px;padding:2px 6px}
.pk-ic{color:var(--primary);display:inline-flex;flex:none}   /* 管理分组行首的文件夹（稿子 803:257）：行首那枚原先是对角线的拖拽把手，稿子上是组自己的图标 */
/* 新建/编辑个人素材：字段白卡（稿子 778:3901）——卡头＝图标＋字段名，值在卡内浅底框里。
   消息区在最上、它下面才是「添加消息」＋三张字段卡（同稿子 807:930 的上下关系） */
.pe-wrap{padding:0 16px 22px}
.pe-card{margin-top:14px;padding:14px 14px 15px;border-radius:var(--shape-l);background:var(--sc-lowest)}
.pe-ch{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:var(--on-surface);padding-bottom:11px}
.pe-ch svg{flex:none;color:var(--primary)}
.pe-in{width:100%;height:46px;padding:0 14px;border:0;border-radius:14px;background:var(--sc-low);color:var(--on-surface);
  font-family:inherit;font-size:13.5px}
.pe-in::placeholder{color:var(--on-surface-variant)}
.pe-in:disabled{opacity:.5}
/* 二级页整宽渐变主按钮（稿子画法）：保存 / 创建 / 知道了 三处同一颗；
   破坏性动作仍走 .btn-danger——红是危险信号的载体，不让渐变把它洗掉 */
.btn-grad{background:linear-gradient(140deg,#7E74FF,#4E9CFA);color:#fff;position:relative;overflow:hidden}
.pe-save svg{position:absolute;right:15px;opacity:.9}
/* 「选择消息类型」＝5 个方磁贴（稿子 778:4101）：类型是这一屏唯一的决定，五档一次摊平；
   表格化的 cell 行会把「选类型」读成「又一个设置项」，也读不出五档是平级的 */
.tp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tp-tile{display:flex;flex-direction:column;align-items:center;gap:10px;padding:17px 6px 14px;border:0;
  border-radius:var(--shape-l);background:var(--sc-lowest);font:inherit;cursor:pointer;position:relative;overflow:hidden}
.tp-ic{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:14px;
  background:linear-gradient(150deg,#EDE9FF,#E4EEFF);color:var(--primary)}
.tp-lb{font-size:13px;color:var(--primary)}
.ps-del:hover{background:var(--error-container);color:var(--error)}
/* 朋友圈语境卡（momPrevBody）：文案（估行 >6 折叠出「全文」）＋媒体三形态（与发圈编辑器同构）；刻意仿真朋友圈排版（白底、微信链接色） */
.mom-post{background:#fff;border-radius:12px;padding:12px 13px}
.mom-txt{font-size:14px;line-height:1.6;color:#111;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.mom-txt.open{display:block;overflow:visible}
.mom-fold{border:none;background:none;padding:0;margin-top:5px;font-size:12.5px;color:#576B95;cursor:pointer;font-family:inherit}
.mom-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}
.mom-note{margin-top:10px;font-size:11.5px;color:#8A8A8A}
/* 悬浮球贴边半隐藏（上面的 .rp-nav「弹卡多条命中切换」随弹卡一起删除，ADR-0061） */
.ball.edge{transition:left .25s var(--emph)}

/* 朋友圈一键发圈（进度 = M3 对话框，编辑器仿真微信） */
.mov{position:absolute;inset:0;background:rgba(0,0,0,.32);backdrop-filter:blur(5px);z-index:90;display:flex;align-items:center;justify-content:center;animation:fade .25s}
.mov-card{width:296px;background:var(--sc-lowest);border-radius:var(--shape-xl);padding:22px 20px;box-shadow:var(--e3)}
.mov-card h4{font-size:24px;font-weight:400;color:var(--on-surface);text-align:center;margin-bottom:16px}
.mov-steps{height:4px;border-radius:2px;background:var(--sc-high);overflow:hidden} /* 一度挂在引导向导名下（.ob-steps），向导删后归位到唯一使用方「一键发圈」进度条 */
.mov-steps i{display:block;height:100%;border-radius:2px;background:var(--primary);transition:width .3s var(--emph)}
.steps{display:flex;flex-direction:column;gap:11px;margin-bottom:16px}
.step{display:flex;align-items:center;gap:11px;font-size:13px;color:var(--outline);transition:color .3s}
.step .st-ic{width:26px;height:26px;border-radius:50%;background:var(--surface-variant);display:flex;align-items:center;justify-content:center;color:var(--on-surface-variant);flex:none;transition:all .3s}
.step.doing{color:var(--on-surface);font-weight:500}
.step.doing .st-ic{background:var(--primary-container);color:var(--on-primary-container);animation:spin 1s linear infinite}
.step.done{color:var(--on-surface)}
.step.done .st-ic{background:var(--primary);color:var(--on-primary)}
@keyframes spin{to{transform:rotate(360deg)}}
.composer{position:absolute;inset:0;background:#fff;z-index:92;display:flex;flex-direction:column;animation:m3In .3s var(--emph)}
.cp-head{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid #DEDEDE}
.cp-head h4{flex:1;text-align:center;font-size:15px;font-weight:500;color:#1A1A1A}
.cp-body{flex:1;overflow-y:auto;padding:15px 16px}
.cp-text{width:100%;min-height:110px;font-size:14.5px;line-height:1.7;color:#1A1A1A}
.cp-count{text-align:right;font-size:11px;color:#B4B6C0;margin-top:4px}
.cp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
.cp-grid .tile{height:96px}
.cp-note{display:flex;gap:7px;align-items:center;font-size:11px;color:var(--on-wx-container);background:var(--wx-container);border-radius:var(--shape-s);padding:9px 12px;margin:14px 0 10px}
.cp-post{margin:0 16px 18px;height:44px;border-radius:999px;background:var(--wx);color:#fff;font-size:14px;font-weight:500}

/* ---------------- 其他 ---------------- */
.badge-soft{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:500;border-radius:var(--shape-s);padding:3px 8px}
.st-e{background:var(--amber-container);color:var(--amber)}.st-ok{background:var(--wx-container);color:var(--on-wx-container)}.st-no{background:var(--error-container);color:var(--on-error-container)}
.clist{padding:0 16px;display:flex;flex-direction:column;gap:8px}
.fchips{display:flex;gap:8px;padding:10px 16px 4px;flex-wrap:wrap}
.cell .cell-ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.sectgap{height:8px}

/* ============================================================
   素材库 · 新版视觉（照 Figma 节点 816:1907「素材库-全部（展开企业）」复刻）
   稿子 750 宽＝375pt；本机 412 宽，故稿子尺寸 ×0.5493 得本机 px（下面注释里的「稿」都是稿子 px）。
   渐变字（background-clip:text）、渐变描边 chip、右上角来源角标、白卡＋软投影——这套画法与
   宿主首页/工具页此前的「新版」（.hv-* 与 .ht-*）同源，两屏摆在一起是一家人。
   与 M3/ADR 冲突处按用户 2026-10-12 指令一律以稿子为准：标题居中（M3 靠左）、
   chip 走渐变描边而不是 secondary-container＋check、列表顶部不再有「口径行」。
   ============================================================ */
/* 页底：稿子左上 #EDF3FF → 右下 #F7F8FE（右上略偏紫，故走 165° 斜向而不是纯竖向） */
#library{background:linear-gradient(165deg,#ECF2FF 0%,#EFEFFE 34%,#F5F7FE 66%,#F8F9FF 100%)}
/* 顶栏：标题居中于稿子 375 中点、返回箭头深藏青、新建＝渐变加号＋右上角小星（同稿子画法） */
#library .appbar{position:relative;height:56px;padding:0 20px 0 8px} /* 稿：返回箭头左缘 19px、新建圆右缘距边 20px */
#library .appbar h3{position:absolute;left:44px;right:44px;top:0;bottom:0;display:flex;align-items:center;justify-content:center;padding:0;
  font-size:19px;font-weight:700;color:#102953;letter-spacing:.02em;pointer-events:none}
#library .appbar .iconbtn{color:#102953;z-index:1}
/* 二级页页头照稿子 778:3901：标题居中，返回箭头兼任「取消」（右侧不再站一颗取消钮） */
#psEdit .appbar-back{position:relative}
#psEdit .appbar-back h3{position:absolute;left:44px;right:44px;top:0;bottom:0;display:flex;align-items:center;justify-content:center;padding:0;pointer-events:none}
/* 新建：稿子是一枚 34px 白圆（软投影）里放渐变加号＋右上小星，圆右缘距屏边 20px */
#library #libNew{margin-left:auto;width:34px;height:34px;padding:0;justify-content:center;border-radius:50%;
  background:#fff;box-shadow:0 8px 18px -14px rgba(40,70,150,1)}
/* 搜索：白胶囊＋软投影；放大镜与占位字同为浅蓝灰（稿子上这两处同色 #B7C6DD） */
#library .m3search{background:#fff;height:44px;padding:0 14px;margin:0 20px!important;
  box-shadow:0 10px 24px -20px rgba(40,70,150,1)}
#library .m3search input{font-size:13.5px}
#library .m3search input::placeholder{color:#B7C6DD}
#library .m3search>svg{color:#B7C6DD;flex:none}
/* 一级视图：六项铺满整行、两端对齐（稿 48..700）；选中＝深藏青粗体＋下方一枚 16px 渐变短条（稿 64..94） */
#library .fltw{background:transparent}
#library .fltbar{gap:0;min-height:40px;padding:0 26px;justify-content:space-between;overflow-x:auto}
#library .lib-tab{height:40px;font-size:16px;font-weight:600;color:#526E9C;min-width:0;padding:0;letter-spacing:.01em}
#library .lib-tab.on{color:#102953;font-weight:700}
#library .lib-tab.on::after{left:50%;right:auto;width:16px;height:3px;border-radius:2px;bottom:5px;transform:translateX(-50%);
  background:linear-gradient(90deg,#1650FF,#9452FF)}
/* 二级分组 chips：白胶囊＋软投影；选中＝渐变描边＋渐变字（画法同 .hv-chip.on，字色走内层 span）。
   描边取 #1677FE→#9452FF：稿子上左端描边 #82B6FE、右端 #C9A8FF、上边中点 #5465FE，
   而这两色的中点恰是 (85,100,254)＝采样值，故渐变为左蓝右紫 */
#library .grail{position:relative;min-height:44px;background:transparent;border-bottom:0;overflow:visible}
#library .grail-in{gap:9px;height:44px;padding:5px 58px 5px 20px;align-items:center}
#library .gri{height:34px;padding:0 16px;border:1px solid transparent;border-radius:999px;background:#fff;
  font-size:13.5px;font-weight:600;color:#6387C0;box-shadow:0 8px 18px -16px rgba(40,70,150,1)}
#library .gri.on{padding:0 14.6px;
  background-image:linear-gradient(#fff,#fff),linear-gradient(96deg,#1677FE,#9452FF);
  background-origin:padding-box,border-box;background-clip:padding-box,border-box;border:1.4px solid transparent}
#library .gri.on>span{background-image:linear-gradient(96deg,#1677FE,#9452FF);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent}
#library .gri.on::before{display:none} /* M3 的 check 前置标记让位给稿子的「渐变描边即选中」 */
#library .gri.action{border:1px dashed #A9BCDF;color:#4E7BFF;box-shadow:none}
#library .gri-div{margin:0 1px}
#library .gri-note{font-size:12.5px;color:#6387C0}
/* 行尾「三」（稿 691..711，20px @#6387C0）：分组轴在收窄态下的入口——钉在 chips 行右端，
   点开＝分组快选浮层。不是装饰：稿子上这一枚就是分组入口，而分组正是这一行唯一的第二轴 */
#library .lib-flt{position:absolute;right:20px;top:50%;transform:translateY(-50%);z-index:2;width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;color:#6387C0;background:none;border:0}
/* 卡片：白卡＋软投影；标题渐变字＋变化徽标同行、关键词在下、右侧 chevron、右上角来源角标
   稿子：卡 690×138（本机 76px 高）、卡间距 23.5（13px）、圆角 16、左右边距 36/24 → 统一 16px */
#library .cmp-list{gap:12px;margin:0}
#library .feed{padding:0 20px}
#library .cmp-card{background:#fff;border-radius:16px;overflow:hidden;position:relative;
  box-shadow:0 12px 26px -24px rgba(40,70,150,1)}
#library .cmp-row{min-height:76px;padding:11px 14px 12px 18px;gap:8px}
#library .lc-h{display:flex;align-items:center;gap:7px;min-width:0}
#library .cmp-b h5{font-size:16.5px;font-weight:700;letter-spacing:.01em;
  background-image:linear-gradient(96deg,#2A62B4,#0F2A58);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent}
#library .cmp-b p{margin-top:7px;font-size:13.5px;font-weight:500;color:#6387C0}
#library .cmp-arr{color:#8AA5CF}
#library .cmp-row.on .cmp-arr{transform:rotate(-90deg)} /* 展开＝收起箭头（稿子上是 ︿），不是 M3 的转 90° */
/* 展开态：卡头换浅紫底（稿 #F1F2FE）并在标题前补一枚 ✦——稿子上展开那一条就是这个长相，
   顺带把「哪条开着」变成一眼可见的状态（✦ 与字号同源，见 hvSpk） */
#library .cmp-row.on{background:#F1F2FE}
#library .lc-spk{display:none;flex:none;line-height:0}
#library .cmp-row.on .lc-spk{display:block}
/* 变化徽标（稿：NEW＝#E6FFF0/#17D861，已更新＝#E3EFFF/#1677FF）——从脚注挪到标题同行，稿子就在标题右 */
#library .lc-tag{flex:none;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.02em}
#library .lc-tag.new{background:#E6FFF0;color:#17D861}
#library .lc-tag.upd{background:#E3EFFF;color:#1677FF}
/* 右上角贴角叶形角标（稿 39×34 贴角，量出来 21.7×19 本机 px）：左上直角（贴卡角），
   右上大圆 11px、右下近直角 1px、左下圆 8px——稿子上这四个角就是不对称的。
   个人＝橙、企业＝蓝，图标白、约 15px 居中。
   **现在只有素材库一处在用**：它回答「这条素材是个人还是企业」（见 srcTagHtml）。
   2026-10-16 之前托管清单卡上也挂过一枚（回答「这条托管是谁派的」，hvaSrcTag），
   随清单一屏一起走（ADR-0065）。这枚件留着是因为素材库还在用，且它本身就是一份通用的皮
   （cornerTag(kind,label) 两个入参就够）：下一个「这东西从哪来」的问题直接调它，
   橙／蓝那套语义不必再学第二遍。
   角标自身 absolute，宿主卡必须 position:relative（.cmp-card／.wk-card 都满足），
   贴角那一侧由宿主的 overflow:hidden 裁出圆角。
   类名仍是 `lc-`（素材库那个时候起的）：它是全站唯一一枚角标，改名就得同改动 tools/smoke.js 里
   七处断言，而那份是别人手上的在改文件——为了一个名字不值当。名字的事留一条注释就够。 */
.lc-src{position:absolute;right:0;top:0;z-index:2;pointer-events:none;width:22px;height:19px;
  border-radius:0 11px 1px 8px;display:flex;align-items:center;justify-content:center;color:#fff}
.lc-src.per{background-image:linear-gradient(135deg,#FFAD45,#FD9A1E)}
.lc-src.ent{background-image:linear-gradient(135deg,#4CA0FF,#1266FF)}
/* 展开卡：预览体直接长在白卡上（稿子上没有微信那层灰底），气泡文字用稿子的近黑而不是微信用深绿 */
#library .cmp-open{border-top:1px solid #EDF1F9;background:#fff}
/* 卡片内的微信发送模拟：去灰底去内边距，每条消息右侧补一枚头像（稿子上每条都带） */
.wk-card .wx-sim{background:none;border-radius:0;padding:0}
.wk-card .wx-row{align-items:flex-start;gap:8px}
.wk-card .wx-b{color:#1F1F1F;max-width:calc(100% - 40px)}
.wx-ava{flex:none;width:32px;height:32px;border-radius:50%;margin-top:2px;color:#fff;
  background-image:linear-gradient(140deg,#7FA8F5,#4C77D8);display:flex;align-items:center;justify-content:center}
.wx-ava svg{width:17px;height:17px}
/* 完整卡（库内展开／搜索／悬浮面板／个人素材／宿主速览展开）：统一到稿子这一张白卡上——
   圆角 16、软投影、标题渐变字、关键词 #6387C0。静默覆盖 .wk-card 原有底色（那层是旧版灰底）。
   宿主首页的展开卡自己还套一层 .hv-card 并就近抹平里层，故不受影响 */
.wk-card{border-radius:16px;background:#fff;box-shadow:0 12px 26px -24px rgba(40,70,150,1)}
.wk-info h5{font-size:16.5px;font-weight:700;letter-spacing:.01em;
  background-image:linear-gradient(96deg,#2A62B4,#0F2A58);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent}
.wk-info p{color:#6387C0}
/* 完整卡的信息区也走「标题＋变化徽标同行」那一版（.lc-h/.lc-tag 与瘦身行同一份，见 wkCard） */
.wk-card .lc-h{margin-bottom:0}
.wk-card .lc-tag{flex:none;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.02em}
.wk-card .lc-tag.new{background:#E6FFF0;color:#17D861}
.wk-card .lc-tag.upd{background:#E3EFFF;color:#1677FF}
</style>

function deptChain(name){ /* 部门在组织树里的祖先链（自顶向下、含自身）；不在树里=只有自己。节点可写成字符串或 {name,children} */
  var found=null;
  (function walk(list,path){
    for(var i=0;i<list.length&&!found;i++){
      var node=list[i],n=(typeof node==='string')?node:node.name;
      var p=path.concat([n]);
      if(n===name)found=p;
      else if(node.children)walk(node.children,p);
    }
  })(ORG,[]);
  return found||[name];

   那种项点下去必然空，是给用户挖坑（空分组不显示，与「空分组才能删」同一把尺） */
function entGrps(){
  var line=deptLine(ME.dept),out=[],seen={};
  for(var i=0;i<line.length;i++){
    var l=grpsOf(line[i]);
    for(var j=0;j<l.length;j++){

      if(seen[n])continue;
      if(!visMats().some(function(m){return deptOf(m)===dn&&mGrpNames(m).indexOf(n)>=0}))continue;
      seen[n]=1;out.push({n:n});
    }
  }
  return out;
}

var RIP_SEL='.btn,.chip,.iconbtn,.cell,.wk-card,.p-card,.pc-btn,.rp-btn,.dk,.tab,.lib-tab,.gri,.more-link,.switch,.gpill,.wx-send,.col-card,.pchip,.cmp-row,.pflt,.pk-field,.pk-a,.ps-mic,.ps-play,.ps-rt,.bm-row,.hp-tip-card,.ra-swap,.ra-hit-row,.rah-b,.hv-row,.hv-tool,.hv-chip,.hv-tab button,.hv-go,.hv-more,.hv-more-row,.hv-banner,.hv-msg,.ht-item,.ht-chip,.tk-card,.tk-btn,.tk-seg button,.tk-can,.tk-d,.tk-all,.tk-more,.hm-item,.hm-edit,.hva-qkcir,.hva-crow-b,.hva-cfg,.hva-agent,.hva-cell,.hva-srow,.hva-actrow,.hva-radio,.hva-actin,.hva-plat,.hva-sx,.hva-setlink,.hva-scope-x,.hva-scope-add,.hva-host-sw,.acct-av,.fw-opt,.fw-link,.fw-ed,.fw-lim .ed,.lib-flt,.ai-close,.hw-add';

    if(!t)return;
    var r=t.getBoundingClientRect();
    var k=r.width/t.offsetWidth||1;

  });
}

  for(i=0;i<groups.length;i++){
    var M=groups[i];
    /* 版本门禁**只在这一处**做，两个调用方（工具页／「创建任务」浮窗）自动都吃到：

       比少一组更糟——用户以为这组加载坏了。所以先滤干净、空组直接 continue。 */
    if(M.pub&&!hasPub()) continue;
    var ps=[];
    for(j=0;j<M.p.length;j++) if(hasPub()||!M.p[j].pub) ps.push(M.p[j]);
    if(!ps.length) continue;
    h+='<div class="ht-mod"><div class="ht-mh">'+hvSpk(20)+'<h4 class="hv-gn">'+M.n+'</h4></div><div class="ht-grid">';
    for(j=0;j<ps.length;j++){
      var t=ps[j],pa=HT_PAL[t.pal];
      h+='<button class="ht-item" onclick="'+tap(t)+'">'
        +'<span class="ht-il">'
        +'<span class="ht-halo" style="background:'+pa[2]+'"></span>'
        +'<span class="ht-sq" style="background:linear-gradient(142deg,'+pa[0]+','+pa[1]+');box-shadow:0 6px 12px -7px '+pa[1]+'">'
        +I(t.ic,17,2.1)+'</span></span>'
        /* 名字分三档：≤4 字原号、5–6 字降一档、7 字再降一档（线上那版也是长名压小、一名一行）。
           .ht-nm 是 nowrap＋省略号，档位给漏了不会报错——只是名字被截成「小红书评论…」。 */
        +'<span class="ht-nm'+(t.n.length>6?' sm xs':(t.n.length>4?' sm':''))+'">'+t.n+'</span></button>';
    }
    h+='</div></div>';
  }
  return h;
}

     ① 键必须是能力名，且**必须落在候选名单里**。写错一个字的后果是那一项能力的「设置」
        静默退回 toast（hvaOpen 找不到配置就走兜底），页面打不开、没有任何报错。
        **只查这一个方向**：候选里有能力没有配置页是正常的（眼下 3 项全有，但那是一时的进度，
        不是一条规则——第 4 项候选挂上来时它可以暂时没有配置页，兜底那句 toast 就是给它留的）。
        「AI智能回复」不在候选名单里，**也不该在这张表里**：它不是一项能力，状态在 HVA_REPLY
        （理由见那张表的注释）。所以这条检查照旧只认候选名单，不必开例外。
     ② 两张表的键必须一一对上：少一张选项表，那个字段渲染时读 undefined.length 会抛错、整屏空白；
        少一份配置，页面照开但改不动。都是当场能看见的错，但**空白页给不出是哪一页坏了**。
     ③ 当前值必须落在自己的选项里。抄错一个字（把「近三天」写成「近3天」）的后果是那一组分段器
        **一个都不选中**：页面照常渲染、也能点，只是回来看不见自己选的是哪档。
     ④ 「选择回复平台」那排的另一半（平台表 ＋ HVA_REPLY 里勾了哪些）：平台名**是勾选位的键**，
        所以表里重名＝同一行画两遍、点一行两行一起变；配置里出现表上没有的名字＝那一枚
        **默认勾着的平台显示成没勾**（截图里抖音是勾着的），页面照常渲染、没有任何症状。
        这两条上面那三个循环都盖不到（这张表不在 HVA_ACTOPT 里，理由见表那段的注释），单独查。
     ⑤ HVA_REPLY 那两份（配置／选项）是上面①②③的第二例、但住在了候选名单外，所以没有任何一条
        循环覆盖得到它：`upd` 抄错一个字，那一屏的分段器同样会"一个都不选中"，而页面照常渲染。
        这里就查它一格——它是这张表上唯一一个"选一档"的字段（plat 是多选，由 ④ 那两条管）。 */
  var k,kk,cfg,opts;
  for(k in HVA_ACTCFG){
    if(!can[k])bad.push('托管动作配置 · '+k+'（不在候选名单里）');
    else if(!HVA_ACTOPT[k])bad.push('托管动作配置 · '+k+'（没有选项表）');
  }
  for(k in HVA_ACTOPT)if(!HVA_ACTCFG[k])bad.push('托管动作选项 · '+k+'（没有对应配置）');
  for(k in HVA_ACTOPT){
    cfg=HVA_ACTCFG[k];opts=HVA_ACTOPT[k];
    if(!cfg)continue;
    for(kk in opts){
      /* typeof 这一跳是为了 skip（开关组）：它是「哪几类不回复」的一份分类表，不是「选一档」，
         没有「当前值」这个东西可比。空串＝还没选，是合法状态（画像分析那枚空圈）。 */
      if(typeof cfg[kk]!=='string'||!cfg[kk])continue;
      if(opts[kk].indexOf(cfg[kk])<0)bad.push('托管动作配置 · '+k+' · '+kk+'='+cfg[kk]+'（不在选项里）');
    }
  }
  if(HVA_REPLY_OPT.upd.indexOf(HVA_REPLY.upd)<0)
    bad.push('AI智能回复 · 更新时间='+HVA_REPLY.upd+'（不在选项里）');
  var plats={},pc;
  for(i=0;i<HVA_REPLY_PLATS.length;i++){
    if(plats[HVA_REPLY_PLATS[i].n])bad.push('回复平台 · '+HVA_REPLY_PLATS[i].n+' 重复');
    plats[HVA_REPLY_PLATS[i].n]=1;
  }
  pc=HVA_REPLY.plat;
  for(kk in pc)if(!plats[kk])bad.push('回复平台 · '+kk+'（不在平台表里）');
  return bad;
})();

/* 浮窗下半段铺的是**能交给托管的那几项能力**（上半段是管理员下发的任务）。照参考原型 V5.9：加号拉起来的那层
   列的是**能力**（能加进托管的动作），不是员工——挑员工是另一件事，它走「设置 → AI智能回复 → 更换」
   那条 pick 路（页头那枚「AI配置」圆钮 2026-10-15 撤了，见 hvaActsHtml 那段注释）。
   **不在这里另抄一份能力表**：名字、图标、配色、形态全在 HOST_TOOLS 里，
   这里只把它摊平，好让「挂进清单」时按名字取一条。抄一份就等于有两份表，改了一处另一处不会跟着动，
   而它们显示的又是同一件事——那正是「看不出哪份是真的」的起点。
   grp 是它属于哪一组（精准人脉／高效发送／…），挂进清单后写在卡的副行上。
   ★ 候选＝**工具页上标了 h1 的那 3 条**（2026-10-14 改，见 ADR-0049），就是 PRD 写的一期那 3 项。
     工具页那 45 项里只有 3 项放开，从前这里把 45 项全摊出来，等于对员工承诺"这 45 件都能交给托管"
     ——其余那些挂上去托管也不会做，是句空话。
     筛的是**能力**不是**界面**：跟着 HOST_TOOLS 上的标记走，这里一个字都不重抄。
     （那 3 枚都不是 pub，所以**标准版下候选一样是这 3 条**，一个不少——版本门禁滤的是摆出来的宫格，
     不是托管候选；HOST_TOOLS 全表仍是 45 枚，标准版只把它摆出 38 枚。）
   ★ **只有一个来源**（2026-10-15，ADR-0062）：原先还接了托管侧自有的那一条（HVA_SOLO_ACTS，
     只有 AI智能回复），它已整条撤掉——那条不是一项能力，是"托管由谁、在哪些平台、多久回一次"
     这件托管级的事，收进了 AI托管全局设置 →「AI智能回复」那一屏。
     **这一段不再需要兜一份名单**，于是也不需要"两个来源的字段对齐成同一形状"那层防法：
     条目形状就是 HOST_TOOLS 摊下来的这一个。
   ★ **摊平里没有 sm**（2026-10-15）：HOST_TOOLS 上那份 sm 是**工具自己的说明**（写着这条工具
     是干什么的），2026-10-15 之前被借来当台账卡片（托管清单卡与浮窗候选卡）的副标题；
     产品删掉那半句之后，托管这边不再借它。工具页那份留着——它写的是工具本身，
     不是某块版面的字段。
   ★ **摊平里只剩 t 了**（2026-10-16，见 ADR-0065）：ic／pa（图标、配色）原先喂的是台账卡左边那枚
     圆角图标，grp（组名）喂的是卡上的副标题，kind（常驻／一次性）喂的是 hvaPick 给新挂项补的截止
     ——那三处全在托管清单那一侧，随它一起走。范围浮层第二段那 3 行**只要名字**（勾＋名＋「设置 ›」，
     行型与上面那 9 类一致），所以这里照本仓口径把失去读者的字段删掉，不再往下带——
     带着的话，下一个人会以为有谁在读它。工具页那份 HOST_TOOLS 一个字段不动：它是工具本身的数据。 */
function hvaActList(){
  var out=[],i,j,g,a;
  for(i=0;i<HOST_TOOLS.length;i++){
    g=HOST_TOOLS[i];
    for(j=0;j<g.p.length;j++){
      a=g.p[j];
      if(!a.h1)continue;
      out.push({t:a.n});
    }
  }
  return out;
}

    /* ---- 首卡：谁来做（2026-10-15，ADR-0062）----
       这一屏读成三问：**谁、在哪、多久**。首卡答第一问——托管由哪一位数智员工执行。
       它**不在清单里**：托管是一件整体的事，一位员工做全部托管动作（回消息只是其中一件，
       打招呼、朋友圈互动是同一双手在干），把「谁」挂成清单里一条可挂动作，等于说
       回复可以换一个人、打招呼还是另一位——而产品里没有那件事。
       ★ 这一卡是「谁来做」**唯一**的落点（清单一侧整条撤掉，见 HVA_SOLO_ACTS 那条墓碑注释）；
         托管的头卡（hvaHeroHtml）、AI配置 列表上那枚标记读的都是同一份状态 HVA_HOST_AGENT。
       ★ 头像／名字取的是员工表里那一条（hvaAgent），不是自己写一份——写死的话换人之后
         头像还是旧的，而页面上每个字都对，只查文案的断言看不出来。 */
    var ha=hvaAgent(HVA_HOST_AGENT)||HVA_AGENTS[0];
    h+='<div class="hva-form"><div class="hva-host">'
      +'<span class="av" style="background:linear-gradient(150deg,'+ha.pa[0]+','+ha.pa[1]+');box-shadow:0 10px 20px -13px '+ha.pa[1]+'">'+I(ha.ic,22,2)+'</span>'
      +'<span class="tx"><b class="hv-gn">'+esc(ha.n)+'</b><span class="ds">'+esc(ha.ds)+'</span></span>'
      +'<button class="hva-host-sw" onclick="hvaPickHost()">更换</button>'
    +'</div>'
    /* 副行写「托管的所有动作都由这位执行」——不写这一句，这一卡在页面上跟「设置一位默认员工」
       没区别，读的人会以为只管回复（这正是它从清单里搬出来的理由，得在卡上说出来）。 */
    +'<div class="hva-acthint">托管的所有动作都由这位执行</div></div>';
    /* 「选择回复平台」：照现网那张截图——一列平台、行尾一枚勾、只勾了抖音。
       现网标题后还跟着一枚 ⓘ、卡右上角还有一枚「设置」（进「回复顺序和间隔时间」），**两枚都不画**：
       前者那点说明在本原型里没有浮层承载，画一枚点了没反应的图标是假控件；后者那一层里
       「回复顺序」没有任何依据，而「间隔时间」已经落在下面那张「更新时间」卡上（见 ADR-0051 五）。 */
    h+='<div class="hva-form"><div class="hva-form-h">选择回复平台</div>'+hvaActPlats('plat')+'</div>';
    /* 「更新时间」＝**现网截图里没有的一项**，2026-10-14 由产品新加：托管状态下隔多久去翻一次
       有没有没回的消息。四档＋自定义分钟；默认 5 分钟是原型定的（截图里没有可抄的默认值，待产品确认）。 */
    h+='<div class="hva-form"><div class="hva-form-h">更新时间</div>'
      +'<div class="hva-txt">托管状态下，每隔多久看一次有没有未回复的消息</div>'
      +'<div class="hva-segpad">'+hvaActSegBox('upd')
      +(c.upd==='自定义分钟'?hvaActMin('updMin'):'')
      +'</div></div>';
  }else{
    h+='<div class="hva-form"><div class="hva-form-h">好友验证方式</div>'+hvaActRadios('verify')+'</div>';
    h+='<div class="hva-form"><div class="hva-form-h">设置标签</div>'+hvaActInp('tag','','请输入')+'</div>';
    /* 「选择备注」那卡：选的是这串备注**加在名字哪一头**，所以输入框跟着它、在同一张卡里——
       拆到另一张卡上，读起来会像两个互不相干的设置。 */
    h+='<div class="hva-form"><div class="hva-form-h">选择备注</div>'+hvaActRadios('note')+hvaActInp('noteText','','请输入')+'</div>';
    /* 「通过后自动打招呼」那一卡**不写卡标题**：行上就是「通过后自动打招呼」，
       再冠一行同名标题＝同一句话写两遍。下面那句灰字照现网原样留着，
       它说的是这条能力自己的欢迎语列表（长按可改），那一屏不在本次范围里。 */
    h+='<div class="hva-form">'+hvaActSwRow('hello','','通过后自动打招呼',c.hello)
      +'<div class="hva-acthint">长按消息进行其他操作，支持编辑</div></div>';
  }
  h+='<div class="hva-foot"><button class="btn btn-primary btn-block" onclick="hvaActSave()">'
    +(HVA_ACT==='画像分析'?'保存设置':'保存方案')+'</button></div>';
  $('hvaActBody').innerHTML=h;
};
/* 存完退回去，并把「存了什么」说全：这一屏没有列表能看出结果，只回一句「已保存」等于让人自己回去翻。
   四张页各有一句摘要，都按**人能读的口径**写（不把内部字段名摊出来）。 */
function hvaActSave(){
  var c=hvaCurCfg(),i,n=0,s='',nm;
  if(HVA_ACT==='朋友圈互动'){
    for(i in c.skip)if(c.skip[i])n++;
    s=c.like+' · 每次 '+c.num+' 条 · '+c.span+' · 不回复 '+n+' 类';
  }else if(HVA_ACT==='画像分析'){
    s=(c.who?'好友：'+c.who:'还没选好友口径')+' · '+c.depth;
  }else if(HVA_ACT==='AI智能回复'){
    nm=[];
    for(i=0;i<HVA_REPLY_PLATS.length;i++)if(c.plat[HVA_REPLY_PLATS[i].n])nm.push(HVA_REPLY_PLATS[i].n);
    s=(nm.length?'平台 '+nm.length+'/'+HVA_REPLY_PLATS.length+'（'+nm.join('、')+'）':'还没选回复平台')
      +' · 更新时间 '+(c.upd==='自定义分钟'?(c.updMin?'每 '+c.updMin+' 分钟':'自定义（分钟数未填）'):c.upd);
  }else{
    s=c.verify+' · 备注'+(c.note==='备注后缀'?'后缀':'前缀')+'「'+(c.noteText||'未填')+'」 · 通过后自动打招呼 '+(c.hello?'已开启':'已关闭');
  }
  toast('已保存「'+HVA_ACT+'」的设置：'+s);
  back();
}

/* ---------- 多开托管 · 选择账号（底部浮层，照线上那屏）----------
   为什么是浮层不是二级页：这一步只是**选**（读账号 → 勾几个 → 保存），不填字、不用键盘、
   列表也短（最多几个号），正是底部浮层的用武之地（见 SKILL §4「点一下就完事的＝弹层」）。
   为什么不照旧做成开关：开关只能答「开不开」，答不了「哪几个号」——而多开托管的全部内容就是哪几个号。 */
function hvaAcctPicked(){ var o=[],i; for(i=0;i<HVA_ACCTS.length;i++)if(HVA_ACCTS[i].on)o.push(HVA_ACCTS[i]); return o; }
function hvaAcctSummary(pick){
  var i,n=[];
  if(!pick.length)return HVA_ACCTS.length?'尚未选择账号':'尚未读取本机账号';
  for(i=0;i<pick.length;i++)n.push(pick[i].n);
  return '已选 '+pick.length+' 个账号 · '+n.join('、');
}
function hvaAcctSheet(open){
  var box=$('hvaAcctWrap'); if(!box)return;
  if(open){ box.innerHTML=hvaAcctHtml(); box.classList.add('on'); }
  else{ box.classList.remove('on'); box.innerHTML=''; }
}
function hvaAcctHtml(){
  var body='',i,j,g,list,on;
  for(i=0;i<HVA_ACCT_APPS.length;i++){
    g=HVA_ACCT_APPS[i];
    list=[];
    for(j=0;j<HVA_ACCTS.length;j++)if(HVA_ACCTS[j].app===g.n)list.push(HVA_ACCTS[j]);
    body+='<div class="acct-app"><span class="acct-logo" style="background:'+g.c+'">'+I(g.ic,17,2.1)+'</span><b>'+g.n+'</b>'
      +'<span class="acct-cnt">'+(list.length?list.length+' 个':'')+'</span></div>';
    if(!list.length){
      /* 没扫到就等于这台手机上没登这个号。**照实说「暂无」**，不给假头像占位——
         摆一个灰头像会读成「有一个但没读出来」，那是在暗示再点一下就有了。 */
      body+='<div class="acct-none">暂无</div>';
      continue;
    }
    body+='<div class="acct-grid">';
    for(j=0;j<list.length;j++){
      on=list[j].on;
      body+='<button class="acct-av'+(on?' on':'')+'" onclick="hvaAcctPick(\''+list[j].app+'\','+j+')" aria-pressed="'+(on?'true':'false')+'">'
        +'<span class="acct-fc">'+I('user',22,2)+'</span>'
        +'<span class="acct-nm">'+list[j].n+'</span>'
        +'<span class="acct-sub">'+list[j].sub+'</span>'
        +(on?'<span class="acct-ck">'+I('check',10,3.4)+'</span>':'')
      +'</button>';
    }
    body+='</div>';
  }
  return '<div class="hva-mask" onclick="hvaAcctSheet(false)"></div>'
    +'<div class="hva-sheet acct-sheet" role="dialog" aria-modal="true" aria-label="选择多开账号">'
    +'<span class="hva-grab"></span>'
    +'<div class="acct-hero">'
      +'<span class="acct-art">'+I('sparkle',30,1.6)+'</span>'
      +'<div class="acct-heroT"><b>选择多开账号</b><span class="acct-badge">支持多选</span>'
      +'<small>开启后数智员工将自动对多开App执行托管任务</small></div>'
    +'</div>'
    +'<div class="hva-slist acct-list'+(HVA_SCANNING?' scan':'')+'">'
      +(HVA_SCANNING
        ? '<div class="acct-scan">'+I('load',26,2)+'<b>正在读取本机账号…</b>'
          +'<small>手机屏幕正在被托管脚本占用，请勿操作手机</small></div>'
        : body)
    +'</div>'
    +'<div class="acct-foot">'
      +'<button class="btn btn-outline btn-block"'+(HVA_SCANNING?' disabled':' onclick="hvaScan()"')+'>'
        +(HVA_SCANNING?'读取中…':'更新账号数据')+'</button>'
      +'<button class="btn btn-primary btn-block acct-save" onclick="hvaAcctSave()">保存设置</button>'
    +'</div></div>';
}
function hvaAcctPick(app,idx){
  var i,j=0;
  for(i=0;i<HVA_ACCTS.length;i++){
    if(HVA_ACCTS[i].app!==app)continue;
    if(j===idx){ HVA_ACCTS[i].on=!HVA_ACCTS[i].on; break; }
    j++;
  }
  hvaAcctSheet(true);
}
/* 「更新账号数据」：真机上是**占用屏幕跑脚本**去微信／企微里读当前登着的号，读完回填到这里。
   原型把这段耗时演出来（读数那一下不是瞬时的），所以扫描期间挡掉列表、只留一句「请勿操作手机」——
   否则员工以为界面卡了，会去点手机，正好把脚本打断。 */
function hvaScan(){
  if(HVA_SCANNING)return;
  HVA_SCANNING=true; hvaAcctSheet(true);
  setTimeout(function(){
    HVA_SCANNING=false;
    HVA_ACCTS=[
      {app:'微信',   n:'小助 · 工作号', sub:'wxid_work',  on:false},
      {app:'微信',   n:'小助 · 客服号', sub:'wxid_kefu',  on:false},
      {app:'企业微信',n:'云小助科技',    sub:'已认证企业', on:false}
    ];
    hvaAcctSheet(true);
    toast('读取到 '+HVA_ACCTS.length+' 个本机账号');
  },1500);
}
function hvaAcctSave(){
  var pick=hvaAcctPicked();
  hvaAcctSheet(false); REND['host-ai-set']();
  if(!pick.length){ toast('还没选账号——更新账号数据之后勾一个'); return; }
  toast('多开托管已按 '+pick.length+' 个账号执行：'+hvaAcctSummary(pick).replace(/^已选 \d+ 个账号 · /,''));
}

/* ---------- 托管范围（底部浮层）----------
   为什么是浮层不是二级页：这一步只是**勾**（看名字就知道要不要），不填字、不用键盘，
   勾完即生效——正是「点一下就完事的＝弹层」那一档。
   为什么这层是勾选、而不把已挂的禁掉：取消一类不产生任何新东西，只是把一类活交出去，
   点一下本来就该是个开关；何况**类型默认 9 类全在**——禁掉的话这层一打开就是 9 行死按钮，
   而它偏偏是默认状态。
   勾选即时生效、没有「保存」：它改的是托管做不做某类活，与上面那几格（工作时间／闲置时长）不是
   一回事，攒着等「保存设置」只会让「我刚勾的到底生效没有」变成一个要猜的问题。层底那颗「完成」只是收起。

   **2026-10-16 起这一层装两段**（见 ADR-0065），两段不并成一张勾选表：
     · 上段＝平台可派的类型。问的是"后台派下来的活里，哪几类交给托管"——按类的一道**筛**，
       取消不产生任何新东西；默认全在。
     · 下段＝我自己挂的能力。是"我挂上了哪几项"——一份**集合**，挂上多一行、摘掉少一行；
       默认只挂两项。
   混成一张表会把两种语义压平，而它俩的默认值恰好相反（一个默认全选、一个默认几乎全空），
   压平之后"全勾着"在这一段意味着什么就说不清了。
   **下段同时接管了原先「加入托管清单」浮窗那件事**：那一层随托管清单一屏删了（ADR-0065），
   挂／摘能力＋进配置页从此只有这一处（.hva-cfg 是 hvaOpen 在 App 里唯一的入口）。
   quiet＝就地重画、不重放上滑动画（见 hvaMine：挂完一枚那一行当场翻面，面板不关）。 */
function hvaScopeSheet(open,quiet){
  var box=$('hvaScopeWrap'); if(!box)return;
  if(open){ box.innerHTML=hvaScopeHtml(quiet); box.classList.add('on'); }
  else{ box.classList.remove('on'); box.innerHTML=''; }
}
function hvaScopeHtml(quiet){
  var rows='',i,t,on;
  /* 列的是 HVA_SCOPE_TYPES（9 类），**不是** 12 类：那三类员工自建的能力不走"后台派活"这趟，
     列在这儿等于问一个不存在的问题（见 HVA_TYPES 上 own 那段）。分母跟着用同一份。 */
  rows+='<div class="hva-sgrp">平台可托管的任务类型 · 已加入 '+HVA_SCOPE.length+'／'+HVA_SCOPE_TYPES.length+'</div>';
  for(i=0;i<HVA_SCOPE_TYPES.length;i++){
    t=HVA_SCOPE_TYPES[i].n; on=hvaInScope(t);
    /* 只列类型名，不写第二行说明：12 行各写一句「托管会做这类活」是把同一句话印 12 遍，
       而这一层要解释的只有一件事——勾上／取消分别意味着什么，那句写在层头。 */
    rows+='<button class="hva-srow'+(on?' on':'')+'" onclick="hvaScopeSet(\''+t+'\','+(on?'false':'true')+')"'
      +' aria-pressed="'+(on?'true':'false')+'">'
      +'<span class="hva-sck"><i>'+I('check',14,3.2)+'</i></span>'
      +'<span class="hva-scp"><b>'+t+'</b></span>'
    +'</button>';
  }
  /* 下段：我挂的能力。列**候选全集**（＝工具页标了 h1 那条，见 hvaActList），已挂的画成勾着——
     不像原先那层浮窗把"已加入的"整条藏起来：这一层要在同一处同时答"我能挂什么"和"我挂了什么"，
     两种问法对应同一个勾。行型因此和上面那 9 类一致（勾＋名），只是尾巴多一枚「设置 ›」。
     **未挂的也给这枚入口**（与原浮窗候选卡一致）：它是能力的配置页，与挂没挂是两件事——
     先调好再挂上，是正常用法。 */
  var acts=hvaActList(),mined=hvaMineOrder();
  rows+='<div class="hva-sgrp">我挂的能力 · 已挂 '+mined.length+'／'+acts.length+'</div>';
  for(i=0;i<acts.length;i++){
    t=acts[i].t; on=hvaHas(t);
    rows+='<div class="hva-crow'+(on?' on':'')+'">'
      +'<button class="hva-crow-b" onclick="hvaMine(\''+t+'\')" aria-pressed="'+(on?'true':'false')+'">'
        +'<span class="hva-sck"><i>'+I('check',14,3.2)+'</i></span>'
        +'<span class="hva-scp"><b>'+t+'</b></span>'
      +'</button>'
      +'<button class="hva-cfg" onclick="hvaOpen(\''+t+'\')" title="配置「'+t+'」">设置 ›</button>'
    +'</div>';
  }
  return '<div class="hva-mask'+(quiet?' quiet':'')+'" onclick="hvaScopeSheet(false)"></div>'
    +'<div class="hva-sheet scp-sheet'+(quiet?' quiet':'')+'" role="dialog" aria-modal="true" aria-label="托管范围">'
    +'<span class="hva-grab"></span>'
    +'<div class="hva-shead"><div><b>托管范围</b>'
      +'<small>上段＝后台派来的任务里交给托管的那些；下段＝你自己挂上的能力</small></div>'
    +'<button class="hva-sx" onclick="hvaScopeSheet(false)" title="关闭">×</button></div>'
    +'<div class="hva-slist">'+rows+'</div>'
    +'<div class="acct-foot"><button class="btn btn-primary btn-block" onclick="hvaScopeSheet(false)">完成</button></div>'
    +'</div>';
}
/* 把一类活交给托管 / 收回。它只动 HVA_SCOPE 这一处，而**范围之外还要发生什么，从前是要报出来的**：
   原先收窄时得报"清单里 N 条同类任务已一并移出"——用户此刻人站在设置页、看不见清单，
   不报数他会以为只是改了个配置，回头在清单里找不到那几条，只会以为是丢了。
   **那句话随托管清单一屏一起删**（2026-10-16，见 ADR-0065）：清单不在，就没有"从清单里移出几条"
   可报；而它替用户说的那半句安慰（"活还在任务页等人做"）也不必再说——现在没有任何一处看起来
   像"任务被删掉了"。**这条取消只改一件事：托管做不做这类活。** */
function hvaScopeOn(t){ hvaScopeSet(t,true); }
function hvaScopeOff(t){ hvaScopeSet(t,false); }
/* 把范围归一：只留候选全集里的，且顺序**恒等于 HVA_SCOPE_TYPES 的顺序**。
   不按点击先后排——重挂一次就跑到末尾的话，同一张表两次看到的次序不一样，
   而它旁边还画着一枚三横引头（见 ICONS grip），人只会以为那是能自己拖的、自己被拖过。
   同 hvaMineOrder 那份（那边归一的是能力）。 */
function hvaScopeOrder(list){
  var keep={},o=[],i;
  for(i=0;i<list.length;i++)keep[list[i]]=1;
  for(i=0;i<HVA_SCOPE_TYPES.length;i++)if(keep[HVA_SCOPE_TYPES[i].n])o.push(HVA_SCOPE_TYPES[i].n);
  return o;
}
function hvaScopeSet(t,on){
  var i=HVA_SCOPE.indexOf(t);
  if(on){ if(i<0)HVA_SCOPE.push(t); }
  else{ if(i<0)return; HVA_SCOPE.splice(i,1); }
  HVA_SCOPE=hvaScopeOrder(HVA_SCOPE);
  /* 只重画设置页这一屏：范围卡上那 9 行是现算的，浮层挂在 #hvaScopeWrap 上不受影响。
     从前这里还要刷一次 REND['host-ai']（"清单跟着变"）——那一屏没有可变的了。 */
  REND['host-ai-set']();
  if($('hvaScopeWrap')&&$('hvaScopeWrap').classList.contains('on'))hvaScopeSheet(true);
  toast(on?'已把「'+t+'」交给托管执行':'「'+t+'」不再交给托管执行');

   名字一处对齐（稿子 → 仓库口径，四条都记在 ADR-0070）：

   ★ 那四张产品图在稿子上是位图，这里是 HTML/CSS 拼的形（三张指标卡／三行素材／三行任务／3×2 宫格）——
     原型不带外部位图（ADR-0042），画法照工具页那批彩色图标块。
   ★ 「添加组件」四枚一律走「演示范围外」：这一屏演示的是「小部件长什么样」，不是安装流程

/* 宫格里那六枚的**名单直接取自 HOST_APPS**（同一批工具，不另抄一份——抄一份就是两份事实，
   改了一处另一处不动）。只把那枚直跳素材库的「素材库」补回第 3 格：宿主首屏那排 2026-10-14
   为排版把它撤了（见 HOST_APPS 上头那段注释），稿子上这一格正是它。 */
function hwCells(){

/* ---------- 素材卡 = 唯一操作面（不设详情页）：预览区模拟微信发送效果，复制/发送等动作直接在卡上 ---------- */
/* 朋友圈语境（mom=从朋友圈 chip/首屏直达/面板朋友圈页进入）：预览区切换为朋友圈排版（文案＋九宫格/视频瓦片/纯文字提示），
   信息区只留标题＋发圈提醒（关键词不上卡），动作去「一键发送」（对话发送在默认视图，关筛选即回）；mom 恒完整卡（覆盖 line/sim） */
function wkCard(m,q,bare,mom,st){ /* st=来源角标（'企业'）——只在混排语境传（「全部」档跨池混排），单一来源视图里条条同源、角标是噪声。
   bare=瘦身行原位展开专用：行上已带标题/关键词/标记，展开卡省去不重复。
   预览体不再是逐调用点可选的开关：默认卡只有两种体——完整微信发送模拟（默认）与朋友圈排版（mom）。
   原先那个"单气泡＝首段文本"的紧凑体（wk-prev）已随最后一处调用点删净——素材卡在库列表/搜索/分组列表/
   首屏展开/面板展开/个人卡六处一律直出完整编排；留一个 per-site 开关，就还会有下一处忘了打开它。 */
  var ttl=q?hl(matTitle(m),q):esc(matTitle(m)); /* 存量素材无标题：按派生链现场生成（首段文本→附件名→未命名素材），与后台列同一真值 */
  /* 信息区照稿子 816:1907：标题与变化徽标同一行、关键词单独一行；来源角标自信息区挪到卡右上角（见下 return）。
     wkCard 是库列表展开/搜索/悬浮面板/个人卡/宿主速览展开六处共用的一份，故这一改就是全站同步 */
  var meta=(m.keywords&&!mom?'<span>'+m.keywords.map(function(k){return '#'+(q?hl(k,q):esc(k))}).join(' ')+'</span>':'');
  var prev=mom?momPrevBody(m) /* mom=朋友圈排版预览：文案全文（>6 行折叠）＋媒体三形态，与发圈编辑器同构 */
    :wxSendSim(m); /* 默认＝完整微信发送模拟：库列表瘦身行展开/搜索/分组列表/首屏速览行展开/悬浮面板展开/个人素材卡，
      附件直出消息形态、不以类型小icon代替，也不缩成首段一个气泡 */
  /* 标识区第二行（发圈提醒行）：本机「已发圈·MM-DD」＋热门「N 人发过圈」同排——前者有本机记录才出、
     后者被发圈任务引用才出，两者任一有值就成行（都没有则整行不出，信息区不留空行）。hotTag 见数据段／ADR-0040 */
  var tagLine=momTag(m.id)+hotTag(m);
  return '<div class="wk-card">'
    +(st?srcTagHtml(st):'') /* 来源角标＝贴卡右上角那一枚叶形（稿子画法），不再是信息区里的一枚行内胶囊 */
    +'<div class="wk-info">'+(bare?'':'<div class="lc-h"><h5>'+ttl+'</h5>'+chgTagHtml(m)+'</div>')+(meta&&!bare?'<p>'+meta+'</p>':'')+(tagLine?'<p>'+tagLine+'</p>':'')+'</div>' /* 发圈提醒：完整卡独有行（瘦身行不带），bare 展开卡同带——瘦身行上没有的信息不因展开丢失 */
    +'<div class="wk-body">'+prev+'</div>' /* 卡内三段固定顺序：标识区（标题＋关键词/元信息＋发圈提醒）在上 → 预览体在中 → 动作区收尾。标识是「这是哪条」，先认条目再看内容；预览体高度随素材长短变化，压在卡尾不把标识挤到卡中间 */
    +'<div class="wk-acts">'+matActs(m.id,mom)+'</div></div>';
}
/* 朋友圈排版卡预览体：文案=全部文本段换行拼接（与发圈预填同一字符串——预览即发表）；
   >6 行折叠出「全文」（显示层需要，不标任何截断线——微信折叠规则未知不编码）；媒体区与发圈编辑器同构（momGridHtml） */
function momPrevBody(m){
  var txt=allTexts(m);
  var est=txt.split('\n').reduce(function(n,l){return n+Math.max(1,Math.ceil((l||'').length/18))},0);
  return '<div class="mom-post"><div class="mom-txt'+(est>6?'':' open')+'">'+esc(txt)+'</div>'
    +(est>6?'<button class="mom-fold" type="button" onclick="momFoldT(this)">全文</button>':'')
    +momGridHtml(momMedia(m))+'</div>';
}
function momFoldT(b){var t=b.previousElementSibling;t.classList.toggle('open');b.textContent=t.classList.contains('open')?'收起':'全文'}
/* 朋友圈媒体三形态（canMoments 保证互斥）：N 图=九宫格 3 列；单视频=158×104 视频瓦片（同微信消息形态）；
   纯文字=无格＋微信提示行（真机长按相机图标才是纯文字入口）——卡片预览与发圈编辑器（momComposer）共用 */
function momGridHtml(med){
  return med.imgs
    ?'<div class="mom-grid">'
      +Array.from({length:Math.min(med.imgs,9)}).map(function(_,i){return '<span class="tile '+['g5','g3','g1','g4','g8','g2','g6','g7','g1'][i%9]+'" style="height:104px"></span>'}).join('')+'</div>'
    :(med.video
      ?'<div style="margin-top:8px"><span style="position:relative;display:block;width:158px;height:104px">'
        +'<span class="tile g8" style="position:absolute;inset:0;border-radius:var(--shape-s)"></span>'
        +'<span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff">'+I('play',28,2)+'</span></span></div>'
      :'<p class="mom-note">纯文字朋友圈：微信里长按相机图标发表</p>');
}
function anyById(id){return matById(id)||PS.find(function(x){return x.id===id})||null} /* 跨池解析：企业素材（MATS）与个人素材（PS）共用一个 id 空间，卡片动作对两者同源 */
function perMoreBtn(m){ /* 个人素材独有的「⋯ 更多」（稿子 816:4066）：个人卡与企业素材的完整卡共用这一份——
   卡长在哪个形态上，它就得在哪个形态上可达（ADR-0014）。企业素材返回空串，两处调用点无分支 */
  return isPerMat(m)?'<button type="button" class="btn btn-sm btn-ghost" style="flex:none" onclick="psMore(\''+m.id+'\',this)">'+I('dots',13,2.4)+' 更多</button>':'';
}
function matActs(id,mom){ /* 统一素材三动作（企业卡与个人卡同一份，docs/03 §3「同一张卡」逐项一致）：
   保存素材（有附件=下载全部附件＋复制文案；纯文字=复制全文）｜一键发送（对话，mom 语境不出现）｜一键发圈（能力不足时禁用＋原因） */
  var m=anyById(id);
  if(!m)return '';
  if(m.type&&m.type!=='script')return ''; /* 企业侧非编排素材无三动作；个人素材没有 type 字段，恒有 */
  var b='btn btn-sm btn-primary',g='btn btn-sm btn-ghost';
  var mm=canMoments(m);
  /* 存量素材可能整条无文本（「新建时至少 1 条文本」是新建校验、不是数据不变式）：文字类动作 dim ＋解释、不藏入口（与「一键发圈」不可发时同一机制） */
  var hasAtt=msgsOf(m).some(function(x){return x.t!=='text'});
  /* 有附件（任何类型：图/视频/文件/语音）＝下载全部附件（按类型分别落，见 attsDesc）＋复制文案；
     纯文字＝只复制全文；既无文本也无附件的空素材才 dim。**不再按"有没有媒体"分岔**——
     文件/语音也是附件，从前那版把含文件/语音的素材甩进"附件可直接发送"那句，等于这几类下不了 */
  var save;
  if(hasAtt)save='<button class="'+g+'" onclick="momentsA(\''+id+'\')">'+I('download',13,2.2)+' 保存素材</button>';
  else if(hasText(m))save='<button class="'+g+'" onclick="copyScript(\''+id+'\')">'+I('copy',13,2.2)+' 保存素材</button>';
  else save='<button class="'+g+' dim" onclick="copyBlocked(1)">'+I('copy',13,2.2)+' 保存素材</button>';
  return save
    +(mom?'':'<button class="'+b+'" style="flex:1" onclick="oneKeySend(\''+id+'\')">'+I('send',13,2.2)+' 一键发送</button>')
    +(mm
      ?'<button class="btn btn-sm btn-amber" style="flex:1" onclick="go(\'wechat\');setTimeout(function(){oneKeyPost(\''+id+'\')},500)">'+I('zap',13,2.2)+' 一键发圈</button>'
      :'<button class="btn btn-sm btn-amber dim" style="flex:1" onclick="momBlocked(\''+id+'\')">'+I('zap',13,2.2)+' 一键发圈</button>');
}
function openLibraryFirst(){
  if(HOSTF==='朋友圈')S.momOnly=true;else S.momOnly=false; /* 只有「朋友圈」是库内既有筛选、能带进库直达；NEW/已更新是首屏独有的状态视角，库内没有对应 chip，不硬造（进库即回到该池全量） */
  S.recent=false;S.srcTab='全部';S.grp='全部';S.pg='全部'; /* 宿主入口落「全部」或「朋友圈」视图，分组回零 */
  go('library'); /* 无首启闸门：首次进入也直接落库首页，权限一律走「设置 › 权限状态」按需授予 */
}

/* ---------- 素材库首页（ADR-0033：六视图 Tab + 当前视图分组 chips） ---------- */

  /* 新建：稿子 816:1907 上是一枚蓝紫渐变加号＋右上角小星（不是 M3 的单色 plus icon），
     故这里手写一份吃 url(#hvGrad) 的实心/描边混合体——I() 只出单色描边，渐变 defs 全屏只此一份（见 .view 下） */
  $('libNew').innerHTML='<svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">'
    +'<path d="M10.6 4.6v12.8M4.2 11h12.8" stroke="url(#hvGrad)" stroke-width="2.6" stroke-linecap="round"/>'
    +'<path d="M19.1 2.3l.8 2.15 2.15.8-2.15.8-.8 2.15-.8-2.15-2.15-.8 2.15-.8z" fill="url(#hvGrad)"/></svg>';
  var ln=$('libNew');if(ln)ln.style.display=''; /* 截图参考中＋是页级恒定动作：新建的始终是个人素材 */
  railRender();
  var fw=$('fltWrap');if(fw)fw.style.display='';
  searchChrome();
  var si=$('libSearchInput');if(si&&si.value!==(S.searchKw||''))si.value=S.searchKw||''; /* 直达搜索态/外部改词后，输入框回到与状态一致 */

/* 二级分组行：只做当前内容视图下的收窄。
   「全部／朋友圈」会同时给出企业与个人分组，个人组用「个人 ·」前缀避免同名两棵树被误解为同一组；
   「最近使用」没有分组维度，因此这一行只陈述本机记录口径，不摆伪筛选项。 */
function railRender(){
  var el=$('grpRailIn');if(!el)return;
  var h='';
  if(S.recent){
    el.innerHTML='<span class="gri-note">'+I('clock',13,2.2)+' 按最后使用时间倒序 · 仅本机记录</span>';
    return;
  }
  if(S.srcTab==='全部'){
    var entOn=(S.grp!=='全部'),pgOn=(S.pg!=='全部');
    h+=gri('全部',!entOn&&!pgOn,"allGrpGo('ent','全部')");
    for(var a=0,EGA=entGrps();a<EGA.length;a++)h+=gri(EGA[a].n,S.grp===EGA[a].n,"allGrpGo('ent','"+jsq(EGA[a].n)+"')");
    h+='<div class="gri-div"></div>';
    for(var b=0;b<PG.length;b++)h+=gri('个人 · '+PG[b].n,S.pg===PG[b].id,"allGrpGo('pg','"+PG[b].id+"')");
  }else if(S.srcTab==='个人'){
    h+=gri('全部',S.pg==='全部',"pgGo('全部')");
    for(var i=0;i<PG.length;i++)h+=gri(PG[i].n,S.pg===PG[i].id,"pgGo('"+PG[i].id+"')");
    h+='<div class="gri-div"></div>';
    h+=gri('＋ 新建分组',false,'pgNew()','action');
    h+=gri('管理分组',false,'pgManage()','action');
  }else{
    h+=gri('全部',S.grp==='全部',"grpGo('全部')");
    for(var j=0,EGJ=entGrps();j<EGJ.length;j++)h+=gri(EGJ[j].n,S.grp===EGJ[j].n,"grpGo('"+jsq(EGJ[j].n)+"')");
  }
  el.innerHTML=h;
}
/* 行尾「三」＝分组快选浮层：把 chips 行那一份分组原样竖着铺开（同一份数据、同一个动作——
   点哪条就走对应的 grpGo／allGrpGo／pgGo）。chips 适合横扫、浮层适合一眼看全，
   分组树一长「三」就是那条不用横着找的路（稿子 816:1907 chips 行右端那一枚就是它）。
   最近使用没有分组维度（ADR-0031），故那里只回一句说明、不给伪选项 */
function grpSheetPick(){
  if(S.recent){toast('最近使用没有分组维度：它按最后使用时间排，本来就跨组');return}
  var rows='',i,g;
  var it=function(label,on,fn,note){
    rows+='<div class="cell" onclick="closeSheets();'+fn.replace(/"/g,'&quot;')+'">'
      +'<span style="min-width:0"><b style="font-size:13.5px;font-weight:500;display:block">'+esc(label)+'</b>'
      +(note?'<span style="font-size:11px;color:var(--on-surface-variant);line-height:1.5;display:block">'+esc(note)+'</span>':'')+'</span>'
      +(on?'<span style="margin-left:auto;flex:none;color:var(--primary)">'+I('check',16,2.4)+'</span>':'')
      +'</div>';
  };
  var sect=function(t){rows+='<p style="padding:14px 18px 4px;font-size:11.5px;font-weight:600;color:var(--on-surface-variant)">'+esc(t)+'</p>'};
  var h='<div style="padding:14px 18px 20px"><h4 style="font-size:22px;font-weight:400;padding-bottom:4px">分组</h4>'
    +'<p style="font-size:11.5px;color:var(--on-surface-variant);padding-bottom:4px">与上方 chips 同一份分组：点一条即按它收窄当前列表</p>';
  if(S.srcTab==='全部'){
    sect('企业素材');
    it('全部企业素材',S.grp==='全部'&&S.pg==='全部',"allGrpGo('ent','全部')");
    for(i=0;i<entGrps().length;i++){g=entGrps()[i];it(g.n,S.grp===g.n,"allGrpGo('ent','"+jsq(g.n)+"')")}
    sect('个人素材');
    for(i=0;i<PG.length;i++)it(PG[i].n,S.pg===PG[i].id,"allGrpGo('pg','"+PG[i].id+"')");
  }else if(S.srcTab==='个人'){
    it('全部个人素材',S.pg==='全部',"pgGo('全部')");
    for(i=0;i<PG.length;i++)it(PG[i].n,S.pg===PG[i].id,"pgGo('"+PG[i].id+"')");
    rows+='<div class="cell" onclick="closeSheets();pgNew()"><span class="cell-ic">'+I('plus',18,2)+'</span><span style="min-width:0"><b style="font-size:13.5px;font-weight:500">新建分组</b></span></div>'
      +'<div class="cell" onclick="closeSheets();pgManage()"><span class="cell-ic">'+I('grid',18,2)+'</span><span style="min-width:0"><b style="font-size:13.5px;font-weight:500">管理分组</b></span></div>';
  }else{
    it('全部素材',S.grp==='全部',"grpGo('全部')");
    for(i=0;i<entGrps().length;i++){g=entGrps()[i];it(g.n,S.grp===g.n,"grpGo('"+jsq(g.n)+"')")}
  }
  openSheet(h+rows+'</div>');
}
/* 分组仍是收窄器（不是目录）：点某组只换池，不改列表形态。 */
function navPaint(){railRender();libTabsPaint()}
function grpGo(id){
  recentOff();
  S.grp=id;S.expOpen={}; /* 展开态属于上一屏：换筛选即全部收起（瘦身行回到总览态） */
  REND['library']();
  var lb=$('libBody');if(lb)lb.scrollTop=0;
}
function pgGo(v){ /* 个人档同款（v='全部' | 个人分组 id） */
  recentOff();
  S.pg=v;S.expOpen={};
  REND['library']();
  var lb=$('libBody');if(lb)lb.scrollTop=0;
}
function momOnlySet(){S.momOnly=!S.momOnly;navAfter()}
function recentSet(){S.recent=!S.recent;navAfter()}
/* 点任一浏览筛选＝退出最近使用、回到浏览态（ADR-0031）：最近使用是另一份列表，不是能叠在来源/分组之上的收窄轴，
   所以这一下不是「又加了一层筛选」，而是「换回浏览的那份列表」。
   只熄 chip——用户的选择（来源档、分组值）一个都不动：不重置、不置灰、不隐藏，关掉 chip 回来还是原来那一屏。
   点「＋ 新建分组」「管理分组」不调这个：它们是动作不是筛选（ADR-0031 决策 4） */
function recentOff(){S.recent=false;S.pRec=false}

function navAfter(){ /* 叠加 chip 开关后：重绘并归顶——列表换了池，接着上次的滚动位置没有意义（首屏即最新） */
  REND['library']();
  if(S.searchMode)return; /* 搜索态：结果照常重绘（朋友圈 chip 生效即重筛），滚动位置由搜索态自己管 */
  var lb=$('libBody');if(lb)lb.scrollTop=0;
}
function srcPick(v){ /* 来源切换（rail 行上下拉／bar 面板来源段同源）：全部/企业/部门/个人四档互斥单选常驻（ADR-0009）；换池导航重置回「全部」 */
  recentOff(); /* 点来源＝换浏览的池，含点当前所在那一档——照样退出最近榜（ADR-0031 决策 2） */
  S.srcTab=v;
  S.grp='全部';S.pg='全部';
  S.expOpen={}; /* 换筛选即清空展开态：展开态属于上一屏，滤完的第一条就是这一屏最该看的那条（ADR-0011 决策3） */
  REND['library']();
}
function gri(n,on,fn,kind){
  /* 名字包一层 <span>：选中态的渐变字要 background-clip:text 打在**只包字**的那一层上，
     打在按钮上会把底色/描边的渐变一起切掉（.hv-chip.on 同一条理由） */
  return '<button class="gri'+(on?' on':'')+(kind?' '+kind:'')+'" onclick="'+fn.replace(/"/g,'&quot;')+'"><span>'+esc(n)+'</span></button>';
}
function libView(){return S.recent?'最近使用':(S.momOnly?'朋友圈':S.srcTab)}
function libTabsRender(){
  var cur=libView(),tabs=['全部','企业','部门','个人','朋友圈','最近使用'];
  /* 「朋友圈」＝能力交集（ADR-0005），是**筛选**不是视图：它的选中态跟着 S.momOnly 走，不跟着「当前视图」走。
     它与「最近使用」互不排斥（ADR-0031），两枚同时亮是正确状态；口径行退休后这里是「这一屏只要可发朋友圈的」
     唯一还说得出话的地方——不亮就等于替用户静默筛掉了大半个池子 */
  return tabs.map(function(n){
    var on=(n==='朋友圈')?S.momOnly:(cur===n);
    return '<button class="lib-tab'+(on?' on':'')+'" onclick="libTabPick(\''+n+'\')">'+n+'</button>'}).join('');
}
function libTabsPaint(){var fb=$('fltBar');if(fb)fb.innerHTML=S.searchMode?fchipMom():libTabsRender()}
function libTabPick(v){
  S.recent=(v==='最近使用');S.momOnly=(v==='朋友圈');
  S.srcTab=(v==='全部'||v==='企业'||v==='部门'||v==='个人')?v:'全部';
  S.grp='全部';S.pg='全部';S.expOpen={};
  REND['library']();
  var lb=$('libBody');if(lb)lb.scrollTop=0;
}
function fchipMom(){ /* 能力 chip：选中态前置 check（M3 filter chip 规范），未选中显示 photos 点题 */
  var on=S.momOnly;
  return '<button class="fchip'+(on?' on':'')+'" onclick="momOnlySet()" title="只看可发朋友圈的素材">'+(on?I('check',12,2.4):I('photos',12,2.2))+' 朋友圈</button>';
}
/* 瘦身行（企业/部门档任意分组筛选下同款）：一行一条（标题打头 + 关键词脚注；行首不设类型 icon，附件媒体形态不在行上外显——N 图/N 视频计数提示已删，组成看展开卡）。
   点行＝原位展开（cmpToggle 原地切 DOM，保留滚动位置；展开卡走 wkCard bare——瘦身行即卡头，不再重复标题/关键词/标记；预览=完整微信发送模拟）——ADR-0023 */
function cmpRow(m,tag){
  /* 池无关的行形态：企业/部门档、个人档、「全部」混排四处共用这一份（ADR-0014）。
     池差异只有三处取值：关键词字段（matKeywords）、分组脚注名表（企业 grpFootTxt／个人 pgFootTxt）、
     以及 tag＝混排语境的来源角标（见下）。 */
  var per=isPerMat(m);
  var kws=matKeywords(m);
  var open=!!S.expOpen[m.id];
  var openCard=per?psCard(m,null,null,{bare:1}):wkCard(m,null,1); /* 展开卡：瘦身行即卡头，省去不重复的标题/关键词（bare 两池同义）。
     来源已由右上角角标承担（见下），展开卡不再重标一次（bare 形态本来也不渲染标识区） */
  /* 行结构照稿子 816:1907：标题＋变化徽标同一行（徽标原本在脚注行尾）、关键词在下、右侧 chevron、
     右上角来源角标（原先是行尾一枚行内胶囊）、原标题前那枚 ✦ 只在展开态出现（稿子上展开那一条才有）。
     那枚 ✦ 在热门素材上换成火焰（暖色实心）：热门＝被发圈任务引用，同宿主首屏行首那枚，见 isHotMat／ADR-0040。
     脚注里的分组名留着：稿子那一条只画了关键词，但「不限分组」视图下这是行上唯一能看出素材归在哪组的地方，
     整卡形态有信息区、瘦身行只有一行——删掉就是信息回归，故降级成关键词后的一小截同色文字而不是删 */
  var kwsSpan=kws.length?'<span style="overflow:hidden;text-overflow:ellipsis">'+kws.map(function(k){return '#'+esc(k)}).join(' ')+'</span>':'';
  if(!kws.length&&!hasText(m))kwsSpan='<span>无文字内容，附件可直接发送</span>'; /* 存量素材（只有附件、无关键词）：一行标题看着像丢了内容，补一句说明——口径同面板行 */
  if(!tag&&(per?S.pg:S.grp)==='全部')
    kwsSpan+='<span style="flex:none;color:#8FA8CE">· '+esc(per?pgFootTxt(m):grpFootTxt(m))+'</span>';
  return '<div class="cmp-card">'
    +(tag?srcTagHtml(tag):'') /* 「全部」档跨池混排才标来源（ADR-0009 决策3）：不标用户无法预判点下去会发生什么 */
    +'<div class="cmp-row'+(open?' on':'')+'" data-m="'+m.id+'" onclick="cmpToggle(\''+m.id+'\')">'
    +'<span class="lc-spk">'+(isHotMat(m)?hvFlame(17):hvSpk(17))+'</span>'
    +'<div class="cmp-b"><div class="lc-h"><h5>'+esc(matTitle(m))+'</h5>'+chgTagHtml(m)+'</div>'
    +(kwsSpan?'<p>'+kwsSpan+'</p>':'')+'</div>'
    +'<span class="cmp-arr">'+I('chev',17,2.2)+'</span></div>'
    +'<div class="cmp-open" style="'+(open?'':'display:none')+'"><div class="feed" style="padding:10px 14px 12px">'+openCard+'</div></div></div>';
}
function cmpToggle(id){
  var open=!S.expOpen[id];
  S.expOpen[id]=open;
  var row=document.querySelector('.cmp-row[data-m="'+id+'"]');
  if(!row){REND['library']&&REND['library']();return}
  row.classList.toggle('on',open);
  var bd=row.nextElementSibling;
  if(bd&&bd.classList.contains('cmp-open'))bd.style.display=open?'':'none';
  if(open&&row.scrollIntoView){try{row.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){}} /* 展开后滚到卡顶，减轻长卡推挤感 */
}
mePill();
/* 首页只放新增/更新的"变化流"（见 docs/03 §1），素材的长效露出靠库内分组与搜索 */
/* recById＝跨来源解析一条本机记录（企业素材 / 个人素材）——库首页最近榜与悬浮面板共用这一个入口：
   两处动作写的是同一份本机记录，两处展示面读的也该是同一份 */
function recById(id){var m=matById(id);if(m)return okLive(m)?m:null;return PS.find(function(p){return p.id===id})||null}
/* 使用记录：仅发送类动作计入（复制/发送/发圈/存图），去重后移到首位、封顶 15 条，纯本机不上传 */
function markUsed(id){
  if(!id)return;
  RECENT=[{id:id,t:Date.now()}].concat(RECENT.filter(function(r){return r.id!==id})).slice(0,15);
  pHitClearOnUse(id); /* 取用任一命中＝这一批已经办完事：命中推荐区段当场收（ADR-0080） */
}
/* 取用的那条是不是当前命中推荐里的：是就把区段收掉。所有取用路径都经过 markUsed，故挂在这一处，
   不在 pexTake／quickCopy／oneKeySend 各写一遍 */
function pHitClearOnUse(id){
  if(!panelOpen||!pHitMsgs.length)return;
  var hs=pHitMerged();
  for(var i=0;i<hs.length;i++){
    if(hs[i].id===id){pHitMsgs=[];pHitNew=0;pRowsDraw();return} /* 整段收：一批里取走任一条，这一批就算办完（产品口径） */
  }
}

  var mom=S.momOnly;

/* 个人档空态：分清「还没建过素材」与「被分组／能力收窄筛空」——后两种素材都在，出口各自不同。

  var inPg=function(p){return S.pg==='全部'||psInGroup(p,S.pg)};

function psMore(id,btn){ /* 稿子 816:4066：贴着「⋯ 更多」展开的气泡菜单，两项——编辑素材 / 删除素材。

/* ---------- 个人素材编排编辑器：1–10 条消息（文本/图片/视频/语音/文件）自由编排，拖拽调序 ----------

var PS_TYPES=[['text','文本','message'],['image','图片','image'],['video','视频','play'],['voice','语音','mic'],['file','文件','file']];
var psSteps=[],psDragIx=-1;
function psTypeOf(t){for(var i=0;i<PS_TYPES.length;i++)if(PS_TYPES[i][0]===t)return PS_TYPES[i];return PS_TYPES[0]}

function psStepsOf(p){

function psDraw(){

/* 关键词字段随编排实时同步：编排里没有文本消息＝关键词无处可用（只匹配文本消息）→ dim 不可配＋解释、不藏字段；

function psKwSync(){

var PS_FILES={image:['折扣图.png','客户案例图.jpg','产品对比.png'],video:['演示视频.mp4','案例实拍.mov'],file:['报价单.pdf','产品手册.pdf','合作方案.docx']};

/* ---------- 语音录制页（仅手机端个人素材；企业素材与后台创建表单都没有语音这一档，ADR-0016） ----------

var PS_REC_MAX=60,psRecIx=-1,psRecOn=false,psRecSec=0,psRecDone=0,psRecTk=null;
function psRecOpen(i){

function psRecHalt(){if(psRecTk){clearInterval(psRecTk);psRecTk=null}psRecOn=false}

function psRecStopNow(){if(!psRecOn)return;psRecHalt();psRecDone=Math.max(1,psRecSec);psRecDraw()}

function pHitMerged(){
  var seen={},out=[];

    }

  var n=0;
  for(var i=0;i<pHitMsgs.length;i++)if(kwMatch(pHitMsgs[i]).length)n++;

function pHitAdd(msg){
  if(!msg||pHitMsgs[pHitMsgs.length-1]===msg)return;
  if(!kwMatch(msg).length)return;

/* 区段标头：跨池的那两枚视图（最近使用／朋友圈）只写视图名（＋能力名），**不点来源档与分组名**——
   那两个轴对这份列表不参与，写上「最近使用 · 部门素材 · N 条」等于说"这份榜是部门素材里的"，是假的（ADR-0031 决策 5）；
   单一来源的三枚视图照旧点名当前组合：分组名（不限分组时点名来源档——企业档不再混说成「全部素材」）。
   ADR-0075 把最近使用／朋友圈从叠加 chip 升成一级视图，这条口径没跟着变：升了级的那两枚仍是跨池的 */
function pSecHead(n){
  var ic=S.pRec?'clock':(S.pMom?'photos':'folder');
  var tags=[];
  if(S.pRec)tags.push('最近使用');
  if(S.pMom)tags.push('可发朋友圈');
  var base=(S.pRec||S.pMom)?'':((S.pGrp==='全部')?pSrcName():pGrpLabel(S.pGrp));
  var t=tags.length?(base?tags.join(' · ')+' · '+base:tags.join(' · ')):base;
  return I(ic,12,2.4)+' '+esc(t)+' · '+n+' 条';
}
/* 池空诚实空态：点名原因＋最小出口（换个视图／看全部），口径与库首页空态一致。
   那两枚跨池视图（最近使用／朋友圈）的空态不带分组名、与 recentEmpty 同一套措辞（ADR-0031）：
   分组与来源对这份列表不参与，点名它们会指错原因。
   出口一律改成**换视图**（pViewPick('全部')）：ADR-0075 把这两枚升成一级视图之后，
   「关闭最近使用」这种说法就不成立了——它不是一层叠着的筛选，是排上的一枚，关不掉、只能换走。
   改前那两条出口（pRecSet／pMomSet）与「最近使用里没有可发朋友圈的素材」那支一并退休：
   视图互斥之后「最近使用 ∩ 朋友圈」在面板里不可达（见 PVIEWS 那段），那支永远进不去，留着就是死影子 */
function pPoolEmpty(){
  if(S.pRec&&!recentPool(false).length)
    return pEmptyRow('还没有使用记录','发送、复制素材后，你最近用过的会出现在这里（仅记在本机）','看全部素材',"pViewPick('全部')");
  if(S.pMom)
    return pEmptyRow('暂无可发朋友圈的素材','可发 = 纯文字、≤9 图或单视频（不含文件、语音消息）','看全部素材',"pViewPick('全部')");
  if(S.pGrp!=='全部')return pGrpEmpty('「'+esc(pGrpLabel(S.pGrp))+'」暂无素材'); /* 被分组收窄筛空：出口＝看全部（见 pGrpEmpty） */
  /* 这一档本来就没素材：不摆「看全部」（都到顶了，点了是死钮），只把为什么没有说清 */
  if(S.pSrc==='部门')return pEmptyRow('本部门暂无素材','专门发给本部门的素材由管理员按可见范围下发','','');
  if(S.pSrc==='个人')return pEmptyRow('暂无个人素材','个人素材由你自己新建、仅你可见','','');
  return pEmptyRow('暂无素材','素材由管理员下发并归组，在这里按下发时间倒序排列','','');
}
function pEmptyRow(txt,tip,btnTxt,fn){ /* 出口按需给：没说清原因就摆一个「看全部」是敷衍，没有出口就不占那行 */
  return '<div style="text-align:center;padding:14px 0 6px;font-size:12px;color:var(--on-surface-variant)">'+txt+'</div>'
    +'<div style="text-align:center;padding:0 0 6px;font-size:11px;color:var(--on-surface-variant)">'+tip+'</div>'
    +(btnTxt?'<div style="text-align:center;padding:0 0 14px;font-size:12px;color:var(--primary);font-weight:500;cursor:pointer" onclick="'+fn+'">'+btnTxt+'</div>':'');
}
/* 筛选 icon 状态：**它现在只管分组一段**（来源已搬进头部那排一级视图，ADR-0075 ③）——所以 icon 仍常驻。
   改前它在「全部」档也常驻（那一档能从它切到企业／部门／个人，藏起来会断掉唯一入口，ADR-0012）；
   现在来源在头上，这一档的常驻理由换了个说法：分组在四档里都可选（「全部」档没有分组维度、只出一行说明），
   收起来反而断掉分组的唯一入口。
   有筛选（**分组≠全部**）→ 点亮＋圆点；popover 开着 → icon 高亮。
   唯一不出现的场合＝搜索态：搜索覆盖一切筛选，popover 压在搜索条上也没法用。
   **点亮条件比改前窄了一档**：不再把「来源≠全部」算作有筛选——来源是视图了，
   点「企业」是换了一屏、不是给这一屏加了一层筛选，再点亮那个漏斗等于说"这屏还被别的条件收着"（假话） */
function pFltSync(){
  var f=$('pFlt');if(!f)return;
  if(pSOn){ /* 搜索态不摆筛选钮：搜索覆盖一切筛选 */
    S.pFltOpen=false;f.style.display='none';f.classList.remove('on','open');pFltPopDraw();pHeadSync();return;
  }
  f.style.display='flex';
  f.classList.toggle('on',S.pGrp!=='全部');
  pFltPopDraw();pHeadSync();
}
/* 头部恒一态：一排一级视图（#pNav，内容由 pNavPaint 铺）＋三枚 icon（筛选 → 搜索 → ✕）——**没有标题行**
   （ADR-0075 ①：「素材库 · 快捷面板」那枚撤掉，面板就长在素材库的入口上，再说一遍自己是素材库是废话）。
   搜索态收起初筛选与搜索两枚 icon，只留 ✕（搜索条自己占一行，见 pSearchSync），
   那排一级视图同时整排收起——**只在有关键词时收**（pQ 非空），只是摊开条子还没输入时照常摆着：
   搜索条只管查找，不替用户熄视图（改前那行叠加 chips 是同一条处置） */
function pHeadSync(){
  var nv=$('pNav'),f=$('pFlt'),sb=$('phSearch');
  if(nv)nv.style.display=pQ?'none':'';
  if(f)f.style.display=pSOn?'none':'flex';
  if(sb)sb.style.display=pSOn?'none':'';
}
/* 素材页列表：来源在前（四档互斥单选常驻，与库首页同源）——
   「全部」=企业素材（含部门）∪ 个人素材跨池混排、不分组（ADR-0009）；企业=对本销售可见的全部企业素材；
   部门=其中可见范围含我部门（含子部门）的定向素材，是企业档的收窄视角（ADR-0008/0012）；
   个人=PS 按组（全部／分组，组名残留回落全部）。企业·部门档吃 S.pGrp（组名／'全部'），个人档吃 'pg: 分组 id' 值 */
function pScriptList(){
  if(S.pSrc==='全部')return visMats().filter(function(m){return m.type==='script'}).concat(PS);
  if(S.pSrc==='个人'){
    if(S.pGrp==='全部')return PS.slice();
    if(S.pGrp.indexOf('pg:')!==0)return PS.slice(); /* 企业分组残留值落到个人来源：回落全部（与旧行为一致） */
    return PS.filter(function(p){return psInGroup(p,S.pGrp.slice(3))});
  }
  /* 企业分组值＝分组**名**（面板与库首页同款；ADR-0030 起销售端按名认组） */
  var gid=(S.pGrp==='全部'||S.pGrp.indexOf('pg:')===0)?null:S.pGrp;
  return visMats().filter(function(m){
    return m.type==='script'
      &&(S.pSrc!=='部门'||deptTargeted(m)) /* 部门档＝可见池再收窄到「点名发给某部门」的那部分（ADR-0030） */
      &&(!gid||inGroup(m,gid));
  });
}
/* 筛选 popover：面板内锚定筛选 icon 的下拉——**只剩分组一段**（ADR-0075 ③）。
   改前是「来源 ＋ 分组」两段（同库首页侧栏：来源是上位、分组是其子筛选，ADR-0011）；来源搬进头部那排一级视图之后，
   同一件事两个入口＝两处能改同一个量，故这一段整段退休，popover 里只留分组（段的标题也就不必再写「分组」上面还有一层）。
   分组段随视图的**来源**切换：企业·部门→企业分组（全部＋各分组）、个人→个人分组（同构）、
   「全部」与「朋友圈」两档→分组轴收起，只留一行口径说明（跨池混排两套分组树落不到一处，ADR-0009）。
   选分组即收起（收窄完成，该去看卡了）；点面板任意处或再点 icon 收起。
   不生成全屏遮罩：popover 与 mask 都在面板内，微信会话全程可见 */
function pFilterPop(open){
  S.pFltOpen=open===undefined?!S.pFltOpen:!!open;
  pFltPopDraw();
}
function pFltPopDraw(){
  var p=$('pFltPop'),mk=$('pFltMask'),f=$('pFlt');
  if(!p||!mk){if(f)f.classList.remove('open');return}
  if(!S.pFltOpen||pSOn||pQ){ /* 搜索态非法：搜索覆盖一切筛选 */
    S.pFltOpen=false;p.style.display='none';mk.style.display='none';
    if(f)f.classList.remove('open');return;
  }
  p.style.display='';mk.style.display='';if(f)f.classList.add('open');
  p.innerHTML='<div class="pfp-sec">分组</div>'+pGrpSegHtml();
}
function pGrpSegHtml(){ /* 分组段随来源走：「全部」档没有分组维度 → 只出说明行，不摆一个点了没用的菜单 */
  if(S.pSrc==='全部')
    return '<p class="pfp-note">'+I('info',12,2.2)+'<span>企业素材与个人素材合并、按发布时间排列，<b>不分组</b>。切企业／部门／个人后可按分组筛选。</span></p>';
  var opts=(S.pSrc==='个人')?pGrpOptsPersonal():pGrpOptsEnt(),h='';
  for(var i=0;i<opts.length;i++)h+=pChipBtn(opts[i].n,S.pGrp===opts[i].v,"pGrpPick('"+jsq(opts[i].v)+"')");
  return '<div class="pfp-chips">'+h+'</div>';
}
/* 面板分组值 → 展示名：企业侧自 ADR-0030 起就是组名本身；个人侧带 'pg:' 前缀（个人分组允许重名，只能靠 id 认，名字只用来显示） */
function pGrpLabel(v){
  if(v==='全部')return '全部';
  if(v.indexOf('pg:')===0){var g=PG.find(function(x){return x.id===v.slice(3)});return g?g.n:'—'}
  return v;
}
function pSrcName(){return {全部:'全部素材',企业:'企业素材',部门:'部门素材',个人:'个人素材'}[S.pSrc]||'全部素材'}
function pGrpOptsEnt(){ /* 企业分组段：全部＋各分组（部门自上而下、部门内按后台序）——分组必填（ADR-0032），没有「未分组」置底项 */
  return [{v:'全部',n:'全部'}]
    .concat(entGrps().map(function(g){return {v:g.n,n:g.n}}));
}
function pGrpOptsPersonal(){
  return [{v:'全部',n:'全部'}]
    .concat(PG.map(function(g){return {v:'pg:'+g.id,n:g.n}}));
}
function pGrpPick(v){ /* 分组段内的值已经限定在当前来源里（段随来源切换），故选组不再需要反推来源。
   点任一项（含当前已选中那一项）＝退出最近榜（ADR-0031 决策 2）：面板与库首页同款互斥 */
  recentOff();
  S.pGrp=v;S.pExpId=null;pRowsDraw();pFilterPop(false);
}
function pChipBtn(n,on,fn){return '<button class="pchip'+(on?' on':'')+'" onclick="'+fn+'">'+(on?I('check',12,2.4):'')+esc(n)+'</button>'}
/* 分组筛空的诚实空态：点名分组＋「看全部」出口，避免继承筛选导致的莫名空页 */
function pGrpEmpty(txt){
  return '<div style="text-align:center;padding:14px 0 6px;font-size:12px;color:var(--on-surface-variant)">'+txt+'</div>'
    +'<div style="text-align:center;padding:0 0 14px;font-size:12px;color:var(--primary);font-weight:500;cursor:pointer" onclick="pGrpPick(\'全部\')">看全部</div>';
}
/* 面板卡（ADR-0075 ④，跨来源混排）：点卡 = 完整预览（看清再取用）；卡上两枚钮 = 直接取用（熟手快路径）。
   卡 = 标题（渐变色字）＋一行摘要＋行尾两枚圆形取用钮，来源从「行内标」改成**右上角一枚角标**（.lc-src）。
   点卡＝在原地摊开完整卡（pRowTap，两池同一入口，ADR-0023） */
function pRowHtml(m){
  var per=!m.type||m.personal; /* 个人素材（PS 原对象 / 搜索映射对象） */
  var mom=S.pMom&&!pQ; /* 朋友圈视图（非搜索）＝可发子集，卡上首钮换成发圈 */
  var open=S.pExpId===m.id;
  var ft=firstText(m);
  var t=matTitle(m); /* 卡首＝素材标题（存量素材按派生链生成），个人素材不再拿正文当标题 */
  var cut=function(s,n){return esc(s.length>n?s.slice(0,n)+'…':s)};
  /* 角标只在混排语境挂（搜索恒跨池、「全部」与「朋友圈」两档跨池、个人素材恒挂）——单一来源视图里条条同源，挂上就是噪声。
     判定与库首页同一套（见 srcTagHtml 那条注释）；角标是同一枚皮，不是新件 */
  var tag=(pQ||S.pSrc==='全部'||per)?srcTagHtml(per?'个人':'企业'):'';
  /* 摘要＝首段截断的一行纯文字；朋友圈视图前缀可发图标；
     存量素材无文本时这一行说清，而不是留一个空省略号。来源那截文字（改前是「企业 · 」/「个人 · 」）撤了——它上了角标。
     **行尾那截组成条（compStrip）也撤了**（ADR-0075 追补）：稿上摘要就是纯文字一行；且这一行 nowrap＋ellipsis，
     文字满行时它本就被裁在框外、只在「无文字内容…」这种短句上冒头——正是那儿已经用文字说明了附件，
     留它等于同一件事说两遍，还多出 17px 的 inline-flex 把行盒撑高 0.7px（卡成 74.3 而非稿上的 73.6）。
     「还有内容」这件事改由轻点摊开那条路回答（面板内原地展开，ADR-0023），不去挤这一行 */
  var sub=per
    ?(ft?cut(ft,34):'无文字内容，附件可直接发送')
    :(mom
      ?I('photos',11,2.2)+' '+(ft?cut(ft,30):'无文字内容，附件可直接发送')
      :(ft?cut(ft,30):'这条素材只有附件、没有文字内容'));
  /* 两枚取用钮（稿上就是这两枚圆底：#F0F4FF 底、蓝紫两色字形）：重动作在内侧（对话＝发送／朋友圈＝发圈），收尾动作守右缘（肌肉记忆零迁移）。
     右缘那枚按视图分岔：对话＝复制（复制并填入输入框），**朋友圈＝保存**（下载全部附件＋复制文案，2026-10-16 产品点名）。
     朋友圈这边不再单给"复制文案"：保存里已经含了文案那一半，同一个动作不摆两个入口；
     且朋友圈语境下「填入会话输入框」本就没有对象——右缘那枚换成"把这条带走的全部内容落到手边"，才是这个视图要的那一下。
     卡整块可点（点了摊开），故两枚钮都得 stopPropagation——不然按「发送」会连带把这条摊开（全站同一处写法见宿主待办那枚钮） */
  var acts=mom
    ?'<button class="pc-btn" onclick="event.stopPropagation();oneKeyPost(\''+m.id+'\')" title="一键发圈">'+I('zap',13,2.2)+'</button>'
      +'<button class="pc-btn pur" onclick="event.stopPropagation();momentsA(\''+m.id+'\')" title="保存素材（下载全部附件＋复制文案）">'+I('download',13,2.2)+'</button>'
    :'<button class="pc-btn" onclick="event.stopPropagation();oneKeySend(\''+m.id+'\')" title="一键发送（文字＋附件）">'+I('send',13,2.2)+'</button>'
      +'<button class="pc-btn pur" onclick="event.stopPropagation();quickCopy(\''+m.id+'\')" title="'+(ft?'复制并填入输入框':'这条素材没有文字内容，附件可直接发送')+'">'+I('copy',13,2.2)+'</button>';
  return '<div class="p-card" onclick="pRowTap(\''+m.id+'\')">'+tag
    +'<div class="pc-b"><h5>'+esc(t)+'</h5><p>'+sub+'</p></div>'
    +'<div class="pc-acts">'+acts+'</div>'
    +'</div>'
    +(open?pExpHtml(m):'');
}
/* 行原地摊开的展开区：统一微信发送模拟（文本段绿气泡＋附件按微信消息形态逐条直出）；
   朋友圈页（S.pMom）展开=朋友圈排版。
   底部动作钮已删（ADR-0079）：取用全走这块面上的手势，不再占一行高。
   朋友圈视图不挂手势，那边照旧用卡上行尾的两枚 icon（保存／一键发圈） */
function pExpHtml(m){
  var mom=S.pMom&&!pQ;
  /* data-take/data-mat＝这块展开区接三档取用手势（单击＝下载附件＋填入输入框／双击＝发送／长按＝保存附件＋复制，见 pexTake）。
     **朋友圈视图那块不挂**：它是"看朋友圈排版"的预览面，且朋友圈没有会话输入框可填——
     那边的操作落成卡上行尾那两枚 icon（保存／一键发圈）。 */
  return '<div class="pexp"'+(mom?'':' data-take="1" data-mat="'+m.id+'"')+'>'+(mom?momPrevBody(m):wxSendSim(m))+'</div>';
}
function pRowTap(id){ /* 手风琴：开新行收旧行，再点同一行收起 */
  S.pExpId=S.pExpId===id?null:id;
  pRowsDraw();
  if(S.pExpId){var el=document.querySelector('.pexp');if(el&&el.scrollIntoView){try{el.scrollIntoView({behavior:'smooth',block:'nearest'})}catch(x){}}}
}
function pExpClose(){S.pExpId=null;if(panelOpen)pRowsDraw()}

/* ---------- 展开卡的三档取用手势：单击／双击／长按（2026-10-16 产品点名） ----------
   作用面＝**已经摊开的那一条**（收起态上那一下仍然是"摊开"）：面板的 `.pexp` 与两处浮层共用的 `.ra-hit-exp`，
   两块都靠 `data-take` 声明"我接手势"，`data-mat` 带上这条是哪个素材。三档：
     · 单击＝下载全部附件（按真实类型分别落，见 attsDesc）＋ 素材文字**填入微信输入框**（只填不发）。面板不关，留着接着翻库；
     · 双击＝一键发送（文字＋附件按编排整组发出，同一键发送那条路）；
     · 长按＝下载全部附件 ＋ 素材文字**复制到剪贴板**（＝保存＋复制）。
   为什么展开区要吃手势：它本来就是"看清了、就地取用"的那一屏；ADR-0079 起底部那排动作钮已删，
   手势是这块面**唯一**的取用方式，也把那 32px 一行还给内容。

/* ---------- 滚动指示层：瞬时滚动条（通用 · M3 触屏惯例）----------

var SB_RULES=[

  {sel:'.panel-list', inset:14},  /* 悬浮面板列表：上下内缩避让面板圆角 */
  {sel:'.sheet-body', inset:14},  /* 底部浮层内容区：同面板——浮层底角同为 28dp 圆角 */

  host.appendChild(ov);

/* 到宿主定位父级的偏移：一路累加 offsetTop/offsetLeft（布局像素）。

          · 侧边菜单（li.ykMenuItemLi）：菜单项文本 = 模块页名 → 跳该页；一级分类名 → 跳该分类
            第一个模块页；

          （出口是「侧栏项 / 新建按钮 / 详情链接」三种，实测跑过 BFS）：18 个模块页靠侧栏，

     抓存内容填**；详情页里没有的字段一律写「-」（详情页自己也是这么表示空的）。

     注入的样式表只命中 .rea-nav / .rea-off 这类原本不存在的类，默认态无任何视觉变化

  var REA_CSS = 'li.ykMenuItemLi.rea-nav{cursor:pointer}'

  /* ============================================================
     逐页覆盖（ADR-0043）——未覆盖的页一个字节都不动；被覆盖的页换新稿或补交互，
     但设计语言仍是现网那一套。谁被覆盖、新稿在哪，见下表 REA_COVER 与 docs/09 §2.3。
     两页入表，两种形态：
       微小助看板      换稿：载体 srcBoard（正文整段替换）＋ REA_BOARD_CSS ＋ reaBoardJs
       素材库 · 新建   补交互：**没有 html 载体**，正文仍是快照那一段，

  var REA_BOARD_PAGE = '微小助看板';      // 只服务 reaLanding()（视图③的落地页），与覆盖是两件事
  var REA_MAT_PAGE = '素材库 · 新建';     // 素材库的「· 新建」子页（独立表单路由，见 docs/09 §2.2）

  /* 本页自带的样式。前缀一律 .rea-bd-*，绝不下探未覆盖页——

     #1677ff / #ff4d4f / #fffbe6），这是 ADR-0043 规则 B 的要求。 */
  var REA_BOARD_CSS =
      '.rea-bd-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px 10px;padding:16px 0 0}'

    + '.rea-bd-tabs .ant-tabs-tab{cursor:pointer}'
    + '.rea-bd-tabs .ant-tabs-nav-list{flex-wrap:wrap}'
    /* 换行是分段的手段：这一条让执行型与配置／资产型各占一行（页签条一行装不下 12 个）。

    + '.rea-bd-tabs-break{flex:0 0 100%;height:0;margin:0;padding:0}'

    + '.rea-bd-tabs-lab{flex:none;align-self:center;margin-right:12px;color:#999999;font-size:12px;line-height:1;white-space:nowrap}'

    + '.rea-bd-table [data-rea-d]{white-space:nowrap}'

    +   'border-radius:4px;color:#ff4d4f;font-size:12px;line-height:1.7}'
    + '.rea-bd-bad[hidden]{display:none}'
    /* 按窗口整块收起的几处：这些块自带 display，UA 的 [hidden] 压不住，
       各补一条 display:none（同 .rea-bd-bad 的写法） */
    + '#rea-bd-todaynote[hidden]{display:none}'
    + '#rea-bd-mat-tabs[hidden],#rea-bd-mat-nodata[hidden]{display:none}';

  /* 注入进覆盖页的脚本。与 REA_FX 的分工：REA_FX 只认 AntD 自己的类名
     （单选框、开关、表格行悬停），本脚本只管本页新加的那几块，两者不交叉。

  function reaBoardJs(){
   return [
    '(function(){',
    'var PAD=function(n){return (n<10?"0":"")+n};',

    '/* 日期一律相对真钟写。快照里的日期是写死的，过一天就在真实浏览器里腐坏',
    '   （本仓库踩过一次，见 tools/smoke.js 钉时钟那套做法）。',
    '   规格：now | d[+|-k]，可带 @now / @hhmm / @HH:mm[:ss]。 */',
    'function when(d,t){',
    '  var s=d.getFullYear()+"-"+PAD(d.getMonth()+1)+"-"+PAD(d.getDate());',
    '  if(!t)return s;',
    '  if(t==="now")return s+" "+PAD(d.getHours())+":"+PAD(d.getMinutes())+":"+PAD(d.getSeconds());',
    '  if(t==="hhmm")return s+" "+PAD(d.getHours())+":"+PAD(d.getMinutes());',

    '}',
    'function stamp(){',
    '  var es=document.querySelectorAll("[data-rea-d]"),i,m,d;',
    '  for(i=0;i<es.length;i++){',
    '    m=/^(now|d(?:[+-]\\d+)?)(?:@(now|hhmm|\\d{2}:\\d{2}(?::\\d{2})?))?$/.exec(es[i].getAttribute("data-rea-d"));',
    '    if(!m)continue;',
    '    d=new Date();',
    '    if(m[1]!=="now")d.setDate(d.getDate()+(parseInt(m[1].slice(1),10)||0));',
    '    es[i].textContent=when(d,m[2]);',
    '  }',
    '}',

    'var BAD=[];',
    'function bad(s){BAD.push(s)}',
    'function rows(){return document.querySelectorAll("[data-bd-row]")}',
    'function tally(rs){',
    '  var t={need:0,done:0,over:0,org:{}},i,r,o,n,d,a;',
    '  for(i=0;i<rs.length;i++){',
    '    r=rs[i];o=r.getAttribute("data-bd-org");',
    '    n=+r.getAttribute("data-bd-need");d=+r.getAttribute("data-bd-done");',
    '    t.need+=n;t.done+=d;',
    '    t.over+=+r.getAttribute("data-bd-over");',
    '    a=t.org[o]||(t.org[o]={need:0,done:0});a.need+=n;a.done+=d;',

    '  t.left=t.need-t.done;t.n=rs.length;return t;',

    '/* 三张卡与合计行的取值——全部由那九行算出来，一个都不另写。',
    '   每条都能被别的数算回来，是这份演示数据集的第一条自律（docs/11 §1）。 */',

    '  need:function(t){return String(t.need)},',
    '  done:function(t){return String(t.done)},',
    '  left:function(t){return String(t.left)},',
    '  over:function(t){return String(t.over)},',
    '  rate:function(t){return (t.need?t.done/t.need*100:0).toFixed(1)+"%"},',
    '  "rate-frac":function(t){return t.done+" ÷ "+t.need},',
    '  "left-of-need":function(t){return (t.need?t.left/t.need*100:0).toFixed(1)+"%"},',
    '  "over-of-left":function(t){return (t.left?t.over/t.left*100:0).toFixed(1)+"%"}',
    '};',
    '/* 静态正文里写的那一份数＝**默认窗口（昨天）**那一份，跑起来跟算出来的对一遍。',
    '   但换窗口换的就是同一个坑位，所以期望值必须在开跑前抄一份留底，',
    '   不能拿元素当下的文本去比——那样第二次换窗口就会自己跟自己比、误报一片。 */',
    'var AUTH={};',
    'function auth(scope,attr,pfx){',
    '  if(!scope)return;',
    '  var es=scope.querySelectorAll("["+attr+"]"),i;',
    '  for(i=0;i<es.length;i++)AUTH[pfx+es[i].getAttribute(attr)]=(es[i].textContent||"").trim();',
    '}',
    'function chk(key,val){',
    '  var a=AUTH[key];',
    '  if(a!==undefined&&a!==val)bad("「"+key+"」静态正文写的是 "+a+"，算出来是 "+val);',
    '}',
    '/* chkOn 只在渲染默认窗口时给 true：别的窗口没有第二份手写副本可比。',
    '   合计行永远 false——它跟页签过滤走，本来就该变。 */',
    'function fill(scope,t,chkOn){',
    '  if(!scope)return;',
    '  var es=scope.querySelectorAll("[data-rea-sum]"),i,k,f,v;',
    '  for(i=0;i<es.length;i++){',
    '    k=es[i].getAttribute("data-rea-sum");f=SUM[k];if(!f)continue;',
    '    v=f(t);if(chkOn)chk("sum:"+k,v);',
    '    /* 合计行的完成率格跟明细行长一个样（数字 ＋ 横条），所以先认里头的数字格；',
    '       认不出才整格当文本写。 */',
    '    if(es[i].querySelector("[data-rea-rate-num]"))paintRate(es[i],parseFloat(v));',
    '    else es[i].textContent=v;',
    '  }',
    '}',

    '/* 逐行自检——这份数据集最容易漂的一处口径，守在这条路上：',
    '   逾期未做 ＝ 有效期已过 ∩ 仍未执行：逾期数与有效期必须一起变。 */',
    '/* 完成率那一格是「数字 ＋ 细横条」：条长按百分比给，同色。',
    '   条只编码值，不判读——没有"低于多少算差"的阈值色（PRD §5.6）。 */',
    'function paintRate(el,p){',
    '  var nm=el.querySelector("[data-rea-rate-num]"),b=el.querySelector(".rea-bd-bar>i");',
    '  if(nm)nm.textContent=p.toFixed(1)+"%";',
    '  if(b)b.style.width=(p>100?100:(p<0?0:p)).toFixed(1)+"%";',
    '}',
    'function rowCheck(){',
    '  var rs=rows(),i,r,name,n,d,l,o,cell,end,e,exp,want,now=new Date();',
    '  for(i=0;i<rs.length;i++){',
    '    r=rs[i];cell=r.cells&&r.cells[0];',
    '    name=((cell&&cell.textContent)||("#"+(i+1))).replace(/\\s+/g,"");',
    '    n=+r.getAttribute("data-bd-need");d=+r.getAttribute("data-bd-done");',
    '    l=+r.getAttribute("data-bd-left");o=+r.getAttribute("data-bd-over");',
    '    if(n!==d+l)bad(name+"：应执行 "+n+" ≠ 已执行 "+d+" + 未执行 "+l);',
    '    if(o>l)bad(name+"：逾期数 "+o+" 超过了未执行 "+l);',
    '    exp=false;end=r.querySelector("[data-bd-end]");',
    '    if(end){',
    '      e=/(\\d{4})-(\\d{2})-(\\d{2}) (\\d{2}):(\\d{2})/.exec(end.textContent||"");',
    '      if(e)exp=new Date(+e[1],+e[2]-1,+e[3],+e[4],+e[5],59)<now;',
    '    }',
    '    want=exp?l:0;',
    '    if(o!==want)bad(name+"：有效期"+(exp?"已过":"未过")+"，逾期数应为 "+want+"，表里写的是 "+o);',
    '    cell=r.querySelector("[data-rea-over]");if(cell)cell.textContent=String(o);',
    '    cell=r.querySelector("[data-rea-rate]");',
    '    if(cell){',
    '      var rp=n?d/n*100:0,pct=rp.toFixed(1)+"%",was=(cell.textContent||"").trim();',
    '      if(was!==pct)bad(name+"：完成率表里写 "+was+"，按 "+d+"÷"+n+" 是 "+pct);',
    '      paintRate(cell,rp);',
    '    }',
    '    cell=r.querySelector("[data-rea-state]");',
    '    if(cell){',
    '      var cls=l===0?"ant-tag ant-tag-green css-vgijab":(exp?"ant-tag css-vgijab":"ant-tag ant-tag-blue css-vgijab");',
    '      var txt=l===0?"已完成":(exp?"已结束":"进行中"),was2=(cell.textContent||"").trim();',
    '      if(was2!==txt)bad(name+"：状态算出来是「"+txt+"」，表里写的是「"+was2+"」");',
    '      cell.innerHTML="<span class=\\""+cls+"\\">"+txt+"</span>";',
    '    }',
    '  }',
    '}',

    '/* 大区排行（手写的内联 SVG，不引图表库）：柱长按 5px/%，柱子同色。',
    '   本页不做"多少算差"的着色——阈值换红、阈值虚线、阈值告警一起删掉了（PRD §5.6），',
    '   差异只由柱长与右侧那串完成率自己说。 */',
    'function fillOrg(t){',
    '  var i,k,a,p,bs=document.querySelectorAll("[data-rea-org-bar]"),ts=document.querySelectorAll("[data-rea-org-rate]");',
    '  for(i=0;i<bs.length;i++){',
    '    k=bs[i].getAttribute("data-rea-org-bar");a=t.org[k];',
    '    if(!a){bad("大区「"+k+"」在明细表里一行都没有");continue}',
    '    p=a.need?a.done/a.need*100:0;',
    '    bs[i].setAttribute("width",String(p*5));',
    '  }',
    '  for(i=0;i<ts.length;i++){',
    '    k=ts[i].getAttribute("data-rea-org-rate");a=t.org[k];if(!a)continue;',
    '    p=a.need?a.done/a.need*100:0;',
    '    ts[i].textContent=p.toFixed(1)+"%";',
    '    if(ts[i].tagName.toLowerCase()==="text")ts[i].setAttribute("x",String(80+p*5+8));',
    '  }',
    '  var svg=document.querySelector(".rea-bd-rank"),lab=[];',
    '  for(i=0;i<bs.length;i++){',
    '    k=bs[i].getAttribute("data-rea-org-bar");a=t.org[k];if(!a)continue;',
    '    lab.push(k+" "+(a.need?a.done/a.need*100:0).toFixed(1)+"%");',
    '  }',
    '  if(svg&&lab.length)svg.setAttribute("aria-label","各大区完成率："+lab.join("，"));',
    '}',

    '/* 页签：执行型 7 类共用一个面板（按任务类型过滤同一张表），',
    '   配置／资产型 4 类各有一个面板——两段不许套同一套指标（docs/10 §4a）。 */',
    '/* 明细表同时过两道筛：**窗口**（这一行属于哪一天）与**页签**（任务类型）。',
    '   窗口在外层、页签在内层，两个轴正交——换窗口不动页签（PRD §4.2）。 */',
    'function filterRows(f){',
    '  CURF=f;',
    '  var rs=rows(),vis=[],i,on,d=DAY[CURW];',
    '  for(i=0;i<rs.length;i++){',
    '    on=(rs[i].getAttribute("data-bd-day")===d)&&(f==="all"||rs[i].getAttribute("data-bd-type")===f);',
    '    rs[i].style.display=on?"":"none";',
    '    if(on)vis.push(rs[i]);',
    '  }',
    '  var tot=document.getElementById("rea-bd-total");',
    '  if(tot)tot.textContent="共 "+vis.length+" 条记录";',
    '  var sr=document.querySelector("[data-bd-tally]");',
    '  if(sr){',
    '    fill(sr,tally(vis),true);',
    '    sr.cells[1].textContent=(f==="all")?vis.length+" 条 · 执行型 7 类":vis.length+" 条";',
    '    sr.cells[2].textContent=(f==="all")?"3 人":"—";',
    '    if(f!=="all"){sr.cells[3].textContent="—";sr.cells[4].textContent="—"}',
    '    else{sr.cells[3].textContent="—";sr.cells[4].textContent="—"}',
    '  }',
    '  return vis.length;',
    '}',
    'function tabs(g){',
    '  var ts=g.querySelectorAll(".ant-tabs-tab"),ps=g.querySelectorAll(".ant-tabs-tabpane"),',
    '      ink=g.querySelector(".ant-tabs-ink-bar"),i,j;',
    '  function show(t){',
    '    var k=t.getAttribute("data-bd-pane"),on,b;',
    '    for(j=0;j<ts.length;j++){',
    '      on=ts[j]===t;',
    '      ts[j].classList.toggle("ant-tabs-tab-active",on);',
    '      b=ts[j].querySelector(".ant-tabs-tab-btn");',
    '      if(b){b.setAttribute("aria-selected",on?"true":"false");b.setAttribute("tabindex",on?"0":"-1")}',
    '    }',
    '    for(j=0;j<ps.length;j++){',
    '      on=ps[j].getAttribute("data-bd-pane")===k;',
    '      ps[j].classList.toggle("ant-tabs-tabpane-active",on);',
    '      ps[j].classList.toggle("ant-tabs-tabpane-hidden",!on);',
    '      ps[j].setAttribute("aria-hidden",on?"false":"true");',
    '    }',
    '    /* 页签条会换行（执行型一行、配置／资产型一行），下划线得跟着当前那一行走：',
    '       只认 bottom:0 的话它永远贴在整条的最底下，切到第一行的页签就指错地方了。 */',
    '    if(ink){ink.style.width=t.offsetWidth+"px";',
    '      ink.style.left=(t.offsetLeft+t.offsetWidth/2)+"px";',
    '      ink.style.top=(t.offsetTop+t.offsetHeight-2)+"px";',
    '      ink.style.bottom="auto";',
    '      ink.style.transform="translateX(-50%)";}',
    '    var f=t.getAttribute("data-bd-filter");',
    '    if(f!==null)filterRows(f);',
    '  }',
    '  for(i=0;i<ts.length;i++)ts[i].addEventListener("click",function(){show(this)});',
    '  show(g.querySelector(".ant-tabs-tab-active")||ts[0]);',
    '}',

    '/* ================= 时间窗（PRD §2.2／§4.2／§4.4） =================',
    '   八个固定档。本页演示数据只落到两天：昨天（D0−1，已完成态／T+1 出数）',
    '   与今日（D0，进行中态／准实时）。其余六档**没有对应的演示集**——点它不换窗口，',
    '   页上也不给说明（docs/11 §8.3）。宁可少给一个态，也不拿两天的并集去冒充「近一周」',
    '   （docs/11 §1 第一条自律：指不回来源的指标不许出现）。 */',
    'var DAY={today:"0",d1:"-1"};   /* 行上的 data-bd-day：0＝今日下发的，-1＝昨天下的 */',
    'var WIRED={today:1,d1:1};       /* 只有这两档接上了数 */',
    'var DEFW="d1";                  /* 默认窗口——静态正文里那份数就是它那一份 */',
    'var CURW=DEFW,CURF="all";       /* 当前窗口 ／ 当前页签过滤：两个正交的轴 */',
    'function winRows(w){',
    '  var rs=rows(),out=[],i,d=DAY[w];',
    '  for(i=0;i<rs.length;i++)if(rs[i].getAttribute("data-bd-day")===d)out.push(rs[i]);',
    '  return out;',
    '}',

    'function setEffect(w){',
    '  var mat=document.getElementById("rea-bd-mat-tabs"),nd=document.getElementById("rea-bd-mat-nodata"),',
    '      off=(w==="today");',
    '  if(mat)mat.hidden=off;',

  /* 覆盖登记表（ADR-0043）：页名 → 该页的覆盖块。与 docs/09 §2.3 那张表一一对应，加页两处一起加。
       html  该页正文段的载体块 id（省略＝正文仍用快照那一段，只补交互）
       css   该页专用样式（只在这页注入；未覆盖页拿不到，这是「逐页覆盖」的底线）
       js    该页自己的注入脚本（在 REA_FX **之后**跑，见 reaDoc）
     四张覆盖页，两种形态：
       微小助看板          换稿——正文整段换成 srcBoard，配 REA_BOARD_CSS ＋ reaBoardJs
       素材库 · 新建       补交互——**没有 html**，正文就是快照那一段，只多样式与脚本
       新小红书运营         改文案——**只有脚本**：筛选标签、输入框提示、表头列名
       新小红书运营 · 新建  文案 ＋ 补配置行——**没有 html 也没有 css**，正文仍是快照；脚本做标签/提示语替换，
                              并在「评论承接」里注入联动私信的配置行（clone 快照行，见函数注释）
     没有 html 的页，reaSplice 原样放过；这不是省事，是刻意：正文抄一份进来就成了会过期的副本，
     重抓源目录后静默与线上脱钩，而这一页的正文本来就不该变。 */
  var REA_COVER = {
    '微小助看板':    { html: 'srcBoard', css: REA_BOARD_CSS, js: reaBoardJs },
    '素材库 · 新建': { css: REA_MAT_CSS, js: reaMatJs },
    '新小红书运营': { js: reaXhsListJs },
    '新小红书运营 · 新建': { js: reaXhsJs }
  };

  /* 把被覆盖页的正文区（contentStart..contentEnd，构建脚本给出的那道缝）换成它登记表里那个载体的内容。
     只换**登记了 html 的**覆盖页；只补交互、正文仍用快照的那页（素材库 · 新建）原样放过。
     缝对不上就原样退回快照，并在 console 里说一声——宁可退回旧稿，也不要把半截 HTML 拼进去。
     页名与缝都由 _online-admin.js 提供，所以重跑构建后这里一个字都不用改。 */
  function reaSplice(p, rest){
    var cv = REA_COVER[p.name];
    if (!cv || !cv.html) return rest;
    var a = p.contentStart, b = p.contentEnd;
    if (typeof a !== 'number' || typeof b !== 'number' || b <= a || b > rest.length){
      reaWarn('覆盖块未生效（' + p.name + '）：正文区偏移不可用（contentStart/contentEnd = '
        + a + ' / ' + b + '）。重跑 python3 tools/build_online_admin.py 后重试。');
      return rest;
    }
    return rest.slice(0, a) + reaCoverHtml(cv.html) + rest.slice(b);
  }

  /* 视图③的落地页＝微小助看板（ADR-0043：它是微小助模块的脸）。
     按页名反查、不写死下标——页序跟着线上后台走，写死会在下次重抓后静默错页。 */
  function reaLanding(){
    var P = window.__REAL_ADMIN__;
    for (var i = 0; i < P.pages.length; i++){
      if (P.pages[i].name === REA_BOARD_PAGE) return i;
    }
    return 0;
  }

    '  var t=e.target;if(!t||t.nodeType!==1)return;',

     顶栏那一串 li 里恒有且只有一个带 ant-menu-item-selected——与「当前在哪一页」同源。 */
  function reaTopOf(rest){

  function reaJson(v){

      .replace(/</g, '\\u003c').replace(/>/g, '\\u003e')

  /* 页内导航脚本：接快照自带的**两级导航**（侧边菜单 ＋ 顶部一级导航）→ postMessage 回外壳。

       · 面包屑第一枚链接（如「新小红书运营 / 新建任务」里的「新小红书运营」）——快照里它是

      + 'var CAT=' + reaJson(reaCatFirst) + ';'
      + 'var TOP=' + reaJson(reaTopFirst) + ';'

      + 'var CUR=' + reaJson(curName) + ';'

        + 'var hit=page(t);if(hit)return hit;'
        + 'var last=null;'
        + 'for(var i=0;i<NAMES.length;i++){'

          + 'if(to===CUR||t===CUR)continue;'         /* 就是当前这一页／当前这一组：不接，也不标 off */

  /* 从某页的 rest 里读出它侧栏二级菜单列出的兄弟页名（按线上顺序） */
  function reaSeqOf(rest){
    var m = rest.indexOf(REA_LIST);
    if (m < 0) return [];
    var e = rest.indexOf('</ul>', m);
    var seg = e < 0 ? rest.slice(m) : rest.slice(m, e);
    var out = [], re = /ykMenuText" title="([^"]*)"/g, x;

  /* 建四张反查表，全程按数据推导、不写死任何页名：
       reaNewOf    模块页名 → 它的「XX · 新建」页名（模块页那枚新建按钮跳过去）
       reaDetailOf 模块页名 → 它的「XX · 详情」页名（列表行那枚详情按钮跳过去）
       reaCatFirst 一级分类名 → 该分类的落地模块页名（侧栏一级项点下去跳到哪）
       reaTopFirst 顶部一级导航名 → 该导航的落地模块页名（顶栏那项点下去跳到哪）
     只建索引、不建 DOM——换页入口一律是线上后台**自带**的那两级导航（侧栏 ＋ 顶栏），本视图不另造导航。 */
  function reaIndex(){
    var P = window.__REAL_ADMIN__;
    var i, j, c, order = [], seen = {};
    /* 「XX · 新建 / XX · 详情」反查模块页名，供页内按钮和「详情」跳转用。

    for (i = 0; i < P.pages.length; i++){
      var cut = P.pages[i].name.indexOf(' · ');
      if (cut < 0) continue;
      var mod = P.pages[i].name.slice(0, cut), suf = P.pages[i].name.slice(cut + 3);
      if (suf === '新建') reaNewOf[mod] = P.pages[i].name;
      else if (suf === '详情') reaDetailOf[mod] = P.pages[i].name;
    }
    /* 一级分类的落地页 = 该分类里排在**线上侧栏最前**的那一页。
       散页（没有二级列表的，如「微信客户列表」——它的一级菜单直接就是页本身）不参与。 */
    for (i = 0; i < P.pages.length; i++){
      c = reaCatOf(P.pages[i].rest);
      if (!c) continue;
      if (!seen[c]){ seen[c] = []; order.push(c); }
      seen[c].push(i);
    }
    for (i = 0; i < order.length; i++){
      c = order[i];
      /* 同组的页列的是同一串兄弟页，取组内任一份即可还原线上顺序 */
      var want = reaSeqOf(P.pages[seen[c][0]].rest), rank = {};
      for (j = 0; j < want.length; j++) if (!(want[j] in rank)) rank[want[j]] = j;
      /* 「XX · 新建 / XX · 详情」这类子页侧栏里没有，按它模块的名字挂到模块页后面：
         新建占 +0.5 档、详情占 +0.75 档，同模块内排成 模块页 → 新建 → 详情。 */
      var SUB = { '新建': 0.5, '详情': 0.75 };
      function rankOf(name){
        if (name in rank) return rank[name];
        for (var w in rank){
          if (name.indexOf(w) !== 0) continue;
          var at = name.indexOf(' · ');
          return rank[w] + (at < 0 ? 0.5 : (SUB[name.slice(at + 3)] || 0.9));
        }
        return 1e9;
      }
      seen[c].sort(function(a, b){
        return rankOf(P.pages[a].name) - rankOf(P.pages[b].name) || a - b;
      });
      reaCatFirst[c] = P.pages[seen[c][0]].name;
    }
    /* 顶部一级导航的落地页 = 落在该导航下、pages[] 里最靠前的那一页。

       新建／详情页的顶栏与它模块页同属一个导航，所以这一遍把子页也一起算进来，无妨：
       子页按源文件名排在模块页之后，抢不到「最靠前」。 */
    for (i = 0; i < P.pages.length; i++){
      var nav = reaTopOf(P.pages[i].rest);
      if (nav && !(nav in reaTopFirst)) reaTopFirst[nav] = P.pages[i].name;
    }
    /* 素材库新建页的「所属分组」下拉，选项就是列表页侧栏那棵树里的真分组——
       从快照里读，不另编一份；重抓后分组变了，下拉跟着变。 */
    for (i = 0; i < P.pages.length; i++){
      if (P.pages[i].name === REA_MAT_LIST){ reaGroupNames = reaGroupsOf(P.pages[i].rest); break; }
    }
    reaIndexed = true;
  }

     但「历史版本」里的快照放在 prototype/_history/all-NNNN.html，得回上一层找。
     故按顺序试这两个相对路径。注：快照读到的永远是**当前**那份载体，
     因为载体复刻的是线上后台，不是本仓库的历史——这点与 _history 的语义不同，已知即可。 */
  var REA_SRC = ['_online-admin.js', '../_online-admin.js'];
  function reaLoad(cb){
    if (window.__REAL_ADMIN__){ cb(); return; }
    if (reaWait){ reaWait.push(cb); return; }
    reaWait = [cb];
    var i = 0;
    function attempt(){
      var s = document.createElement('script');
      s.src = REA_SRC[i];
      s.onload = function(){
        var w = reaWait; reaWait = null;
        if (!window.__REAL_ADMIN__){
          reaSay('载体文件已加载，但未取到 window.__REAL_ADMIN__。');
          return;
        }
        for (var k = 0; k < w.length; k++) w[k]();
      };
      s.onerror = function(){
        if (++i < REA_SRC.length){ attempt(); return; }
        reaWait = null;
        reaSay(
          '线上后台复刻未能加载：没找到 _online-admin.js（约 7.8MB 的快照载体）。'
          + '它应与 all.html 同目录、随仓库一起分发。');
      };
      document.head.appendChild(s);
    }
    attempt();
  }

  /* 页内侧栏点回来 → 换页；新建页点保存 → 收下这条素材、回列表页并报一条提示 */
  window.addEventListener('message', function(e){
    var d = e.data;
    if (!d || !window.__REAL_ADMIN__) return;
    if (!d.reaPage && !d.reaSave) return;
    var P = window.__REAL_ADMIN__;
    var name = d.reaPage;
    if (!name && d.reaSave){
      reaSaved.push(d.reaSave);
      reaFlash = '素材「' + d.reaSave.title + '」已保存并发布';
      name = REA_MAT_LIST;
    }
    for (var i = 0; i < P.pages.length; i++){
      if (P.pages[i].name === name){ reaRender(i); return; }
    }
  });

  var cur = null;
  function set(k){
    if (k === cur) return;
    cur = k;
    Object.keys(views).forEach(function(n){ views[n].classList.toggle('on', n === k); });
    var bs = document.querySelectorAll('.seg-b');
    for (var i = 0; i < bs.length; i++){
      bs[i].classList.toggle('on', bs[i].dataset.k === k);
      bs[i].setAttribute('aria-selected', bs[i].dataset.k === k ? 'true' : 'false');
    }
    document.title = titles[k];
    history.replaceState(null, '', '#' + k);
    if (k === 'real') reaLoad(reaEnter);
  }
  /* 认得出的只剩 #app / #real；旧链接的 #admin 随视图②下线（ADR-0048），一律落默认视图 */
  set(location.hash === '#real' ? 'real' : 'app');

  var bs2 = document.querySelectorAll('.seg-b');
  for (var j = 0; j < bs2.length; j++){
    bs2[j].addEventListener('click', function(){ set(this.dataset.k); });
  }
  /* 焦点在顶栏/外壳时可用数字键切换（焦点进入 iframe 后按键归原型自身）。
     1·2 与顶栏按钮同序；旧的 3（管理后台）随视图②下线，不再绑（ADR-0048）。 */
  document.addEventListener('keydown', function(e){
    if (e.key === '1') set('app');
    else if (e.key === '2') set('real');
  });

})();
</script>

<!-- 历史版本切换器（只挂在外壳层；载体 srcdoc 内的同名标签按父页解析、无文件名，永不挂载） -->
</body>

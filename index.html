   这里只把它的**点区**撑到 44（那颗圆只有 30，靠整行兜着；这里行矮，得自己撑）。 */
.hva-scope-row{display:flex;align-items:center;gap:10px;padding:9px 8px 9px 15px;position:relative}
.hva-scope-row+.hva-scope-row{box-shadow:inset 0 1px 0 #EFF2F9}
.hva-scope-grip{flex:none;display:flex;color:#C6D1E2}
.hva-scope-nm{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:#17263F;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hva-scope-x{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;border-radius:50%}
.hva-scope-x i{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#8C9BB8;background:#F2F4FA}
.hva-scope-add{display:flex;align-items:center;justify-content:center;gap:6px;box-sizing:border-box;
  width:calc(100% - 30px);height:48px;margin:2px 15px 15px;
  border:1px dashed #BCC9E0;border-radius:12px;color:#2E6BFF;font-size:13.5px;font-weight:700;
  position:relative;overflow:hidden}
.hva-scope-add svg{flex:none;margin-top:-1px}
/* 范围那层里的行：左边一枚圆勾（勾上＝这项交给托管），右边是名字。
   不做「已加入」绿标签、也不把已勾的禁掉——这一层是**勾选表**，点一下就是个开关；
   摆成禁用态会让人以为「勾上了就再也取消不了」，而取消恰恰是这层要做的事之一。
   状态的交代交给两段段头那两句「已加入 N／9」「已挂 N／3」。

   **这一组一律限定在 .scp-sheet 之内，且行／名的基规则必须写全。** 2026-10-14 那次把浮窗的行
   换成 .hva-ac 卡片时，连同删掉了约定共用的 .hva-srow／.hva-scp 基规则——那两条基规则是这一层
   唯一的定位来源，删掉后 12 行退成裸 <button>（行内块、无 flex），摊成「一行 4 枚圆勾＋一行 4 个
   名字」地折行，从 v116 一直坏到 v120（见 ADR-0052）。加成 .scp-sheet 前缀是为了**只修这一层**：
   将来浮窗要是又长出「行」，不会误捡这两条。 */
.scp-sheet .hva-srow{display:flex;align-items:center;gap:11px;width:100%;padding:10px 8px;border-radius:14px;
  text-align:left;position:relative;overflow:hidden}
.scp-sheet .hva-sck{flex:none;width:38px;height:38px;display:flex;align-items:center;justify-content:center}
.scp-sheet .hva-sck i{width:23px;height:23px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1.6px solid #C6D1E2;color:transparent}
.scp-sheet .hva-scp{flex:1;min-width:0}
.scp-sheet .hva-scp b{display:block;font-size:14.5px;font-weight:700;color:#17263F}
.scp-sheet .hva-srow.on .hva-sck i{background:#2E6BFF;border-color:#2E6BFF;color:#fff}
.scp-sheet .hva-srow.on .hva-scp b{color:#12294F}
/* 第二段那几行＝「我挂的能力」（2026-10-16 加，见 ADR-0065）。与上面那 9 类**行型一致**
   （同样的圆勾、同样的字号），差别只有一处：这一行里是**两个**按钮——
   左＝勾选位（挂／摘）、右＝「设置 ›」（进这项能力自己的配置页）。
   所以它不能复用 .hva-srow：那条规则自己就是一枚按钮，一行里塞不下第二枚。
   左按钮吃满剩下的宽、右按钮贴右缘，两枚各自 overflow:hidden 吃自己的按压波纹
   （波纹要贴着各自那一块裁，不然一片糊开）。未挂的那几行**也给**「设置 ›」——
   它与挂没挂是两件事，先调好再挂上是正常用法。 */
.scp-sheet .hva-crow{display:flex;align-items:center;gap:4px}
.scp-sheet .hva-crow-b{flex:1;min-width:0;display:flex;align-items:center;gap:11px;padding:10px 4px 10px 8px;
  border-radius:14px;text-align:left;position:relative;overflow:hidden}
.scp-sheet .hva-crow.on .hva-sck i{background:#2E6BFF;border-color:#2E6BFF;color:#fff}
.scp-sheet .hva-crow.on .hva-scp b{color:#12294F}
.scp-sheet .hva-cfg{flex:none;height:34px;padding:0 12px;border-radius:17px;display:flex;align-items:center;
  font-size:13px;font-weight:700;color:#2E6BFF;background:#F1F4FE;position:relative;overflow:hidden}
/* 多开托管 · 选择账号（底部浮层）。外壳复用浮窗那套（.hva-sheet／.hva-grab／.hva-mask／.hva-slist），
   只换里面的内容。上段那条浅蓝头照线上那屏：它是这一层里唯一的「说明区」，
   往下全是可点的账号，颜色把「这里不用点」和「下面要点」分开。 */
.acct-sheet,.scp-sheet{max-height:82%}
.acct-hero{flex:none;position:relative;display:flex;align-items:center;gap:12px;overflow:hidden;
  margin:2px 12px 6px;padding:14px 15px;border-radius:18px;
  background:linear-gradient(150deg,#EAF3FF,#F6FAFF)}
.acct-heroT{position:relative;min-width:0}
.acct-heroT b{font-size:17px;font-weight:800;letter-spacing:.01em;color:#12294F}
.acct-badge{display:inline-flex;align-items:center;height:20px;margin-left:8px;padding:0 8px;
  border-radius:8px;background:#2E7BFF;color:#fff;font-size:11.5px;font-weight:700;vertical-align:2px}
.acct-heroT small{display:block;margin-top:5px;font-size:12.5px;line-height:1.5;color:#5B7099}
/* 右上角那枚装饰圆。**不摆机器人插画**——那是线上那张稿里的位图资产，本原型没有；
   用产品自己的「数智员工」星标顶上，说的是同一件事（这一层归数智员工管），不假造一张图。 */
.acct-art{position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:96px;height:96px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(150deg,#9CC6FF,#5B9BFF);opacity:.5}
.acct-heroT b,.acct-heroT small{position:relative;z-index:1}
.acct-list{padding:2px 16px 4px}
.acct-app{display:flex;align-items:center;gap:9px;margin:12px 0 8px}
.acct-app b{font-size:14.5px;font-weight:700;color:#17263F}
.acct-logo{flex:none;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff}
.acct-cnt{margin-left:auto;font-size:12px;color:#93A3BC}
/* 账号一枚＝一张竖卡：头像＋名字＋副行。**选中态是描边＋角上一枚勾**，不整枚填色——
   填色会让「已选」和「不可点」长得像（全站置灰／填色都另有含义）。 */
.acct-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acct-av{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;
  border-radius:14px;background:#F6F8FC;border:1.5px solid transparent;position:relative;overflow:hidden}
.acct-av.on{background:#EEF5FF;border-color:#2E7BFF}
.acct-fc{width:44px;height:44px;border-radius:50%;background:#E3EAF6;color:#7E90AC;
  display:flex;align-items:center;justify-content:center}
.acct-av.on .acct-fc{background:#2E7BFF;color:#fff}
.acct-nm{max-width:100%;font-size:12.5px;font-weight:600;line-height:1.35;color:#17263F;text-align:center;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.acct-sub{font-size:11px;color:#93A3BC}
.acct-ck{position:absolute;right:6px;top:6px;width:16px;height:16px;border-radius:50%;
  background:#2E7BFF;color:#fff;display:flex;align-items:center;justify-content:center}
/* 「暂无」照实说：这台手机上没登这个号。不摆灰头像占位（那读成「有一个、没读出来」）。 */
.acct-none{margin:0 0 4px;padding:14px 0;border-radius:14px;background:#F6F8FC;text-align:center;
  font-size:12.5px;color:#A9B6CD}
/* 读数那一下：手机屏幕被脚本占着，界面得把「正在动、别碰」说清楚，别让它看着像卡死 */
.acct-scan{display:flex;flex-direction:column;align-items:center;gap:8px;padding:44px 0 52px;text-align:center;color:#5B7099}
.acct-scan svg{animation:acctSpin 1.1s linear infinite;color:#2E7BFF}
.acct-scan b{font-size:14.5px;font-weight:700;color:#17263F}
.acct-scan small{font-size:12.5px;color:#71809A}
@keyframes acctSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.acct-scan svg{animation:none}}
.acct-foot{flex:none;display:flex;flex-direction:column;gap:9px;padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
/* 员工详情／新建：顶部一个大头像＋名字＋状态，下面才是表单 */
.hva-prof{display:flex;flex-direction:column;align-items:center;gap:9px;padding:4px 16px 20px}
.hva-pav{width:84px;height:84px;border-radius:26px;display:flex;align-items:center;justify-content:center;
  color:#fff;position:relative;overflow:hidden;box-shadow:0 16px 30px -18px rgba(96,84,255,.95)}
.hva-pav::after{content:"";position:absolute;inset:0;background:linear-gradient(150deg,rgba(255,255,255,.42),transparent 62%)}
.hva-pav svg{position:relative;z-index:1}
.hva-prof b{font-size:20px;font-weight:700;letter-spacing:.01em}
.hva-prof .st{font-size:12.5px;font-weight:600;color:#8C9BB8}
.hva-foot{padding:6px 16px 20px}

/* ---- 托管动作配置（二级页）· 照现网设置截图 ----
   控件一律复用壳里已有的：互斥多档＝.tk-seg（与本模块「闲置时长」同一枚）、
   互斥列表＝.hva-radio（M3 radio：20dp 圈，选中＝主色圈＋10dp 实心点）、
   开关＝.switch（M3 52×32）、输入＝.input（M3 filled，只有上圆角）。这里第一次把它们
   按「一屏设置」凑成排版，所以只补行距与行分隔，不另造一套控件。
   行分隔沿用 AI托管那套 inset 1px 浅线（.hva-cell 的口径：卡自己不画外框，线由行与行之间出），
   且**只在同类行之间出**——卡标题（.hva-form-h）底下不画线：标题与第一行只隔 2px，
   那条线会贴着标题贴出一条像下划线的东西。 */
.hva-actrow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 15px;text-align:left;
  background:transparent;border:0;font:inherit;color:var(--on-surface);position:relative;overflow:hidden}
.hva-actrow .lb{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:#2A4A7E}
/* 行里那枚开关不吃事件：整行才是那个开关（role/aria-checked 挂在行上），按压波纹该贴着行铺。
   开关自己若还能当 e.target，closest(RIP_SEL) 就落在它身上，波纹缩进那 52×32 里去了。 */
.hva-actrow .switch{pointer-events:none}
.hva-radio{display:flex;align-items:center;gap:12px;width:100%;padding:13px 15px;text-align:left;
  background:transparent;border:0;font:inherit;color:var(--on-surface);position:relative;overflow:hidden}
.hva-radio .lb{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:#2A4A7E}
.hva-radio .rd{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid #C6D1E2;
  display:flex;align-items:center;justify-content:center}
.hva-radio.on .rd{border-color:var(--primary)}
.hva-radio.on .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary)}
.hva-actin{display:flex;align-items:center;gap:12px;padding:13px 15px}
.hva-actin .lb{flex:none;font-size:13.5px;font-weight:600;color:#2A4A7E}
.hva-actin .input{flex:1;min-width:0}
/* 输入框右边那枚单位（AI智能回复的「自定义分钟」）。写死在框外而不是塞进 placeholder：
   一打字 placeholder 就没了，那行只剩一个孤零零的数字，读不出是分钟还是秒。 */
.hva-actin .unit{flex:none;font-size:13px;font-weight:600;color:#71809A}
/* 这一行若落在 .hva-segpad 里（分段器下面那枚「自定义分钟」输入框），左右留白由外层给，
   行自己只留零——不然内边距叠两次，输入框会缩进一圈、和上面的分段器对不齐。
   上边那 14px 得自己补：.hva-form .tk-seg{margin:0}（卡内分段器不带段距，见那条注释），
   不补的话输入框会贴在分段器上。 */
.hva-segpad>.hva-actin{padding:0;margin-top:14px}
.hva-acthint{padding:0 15px 14px;font-size:12.5px;line-height:1.62;color:#93A3BC}
/* 多选行（「选择回复平台」）。一行一个平台：左边一枚品牌色方块标，右边一枚勾。
   **勾不占位**——没勾时留白（visibility，不是 display）：用 display 的话，勾一出现整列名字
   就往左跳一下，勾一取消又跳回来。行比上面几类行略高（方块标撑起来的），内边距相应收到 10px。
   方块里那枚标一律是白描图标或白字标（色块＋同构图形，见 HVA_REPLY_PLATS 的注释）。 */
.hva-plat{display:flex;align-items:center;gap:11px;width:100%;padding:10px 15px;text-align:left;
  background:transparent;border:0;font:inherit;color:var(--on-surface);position:relative;overflow:hidden}
.hva-plat .lg{flex:none;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;color:#fff;font-size:8.5px;font-weight:700;letter-spacing:-.3px}
.hva-plat .lb{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:#2A4A7E}
.hva-plat .ck{flex:none;width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  color:var(--primary);visibility:hidden}
.hva-plat.on .ck{visibility:visible}
.hva-form>.hva-actrow+.hva-actrow,.hva-form>.hva-radio+.hva-radio,
.hva-form>.hva-radio+.hva-actin,.hva-form>.hva-plat+.hva-plat{box-shadow:inset 0 1px 0 #EFF2F9}

/* ---------------- 宿主 App 我的页（底部 Tab「我的」）· 照 Figma 节点 461:945 复刻 ----------------
   口径与前三个宿主屏同：视觉照抄稿子（浅蓝雾顶、白模块卡、蓝紫渐变图标块、渐变字），
   长度按 412/750 折算（×0.5493）；字体栈仍走 --f（稿子通篇 PingFang，打在 SKILL.md 的禁止清单上）。
   稿子上头像是位图、每枚功能图标是一张 3D 彩色玻璃块——原型不带外部位图，
   一律用 CSS 拼同构的形（同首屏光泽球、工具页顶右插画、任务页猫耳机器人的画法：只求神似，不求逐像素）。
   **例外：顶上那张会员卡已不照本节点**——2026-10-16 按 Figma **370:597**（「我的（会员身份）」三卡规格表）
   重画成三档三张（见下方卡片段头与 ADR-0072）；本节点那张单卡（写着「聊天辅助版」）作废。
   ★ 三处**稿子管不着、由本项目规则定死**的，钉在这里免得日后被「对齐设计稿」改回去：
     ① 稿子底部那条 iOS home indicator 不画：本壳已有 Android 手势条（.sysnav），再叠一条就是两条。
     ② 「企业会员到期时间」稿子的文本节点写 2023-06-08，同一张卡渲染出来却是 2025-06-08（图与字打架）。
        本屏取 2025-06-08——一处屏幕上不留两个到期日。
     ③ 姓名取当前登录销售（ME），与宿主首屏问候同一份真值（首屏那次「不再写死字面量」的口径）；
        稿子上的「张晓强」是宿主登录态的演示值，这里跟着登录态走。公司名是宿主侧的租户，
        本模块不建模（素材库只消费宿主给出的部门归属），故照稿固定。 */
#host-me{background:linear-gradient(180deg,#D9E9FA 0%,#E7F1FD 20%,#F4F9FE 36%,#FFFFFF 50%)}
/* 顶部蓝雾：稿子上是一张 750×1630 的背景图，这里用两层径向渐变近似，到 ~470px 处化白 */
.hm-glow{position:absolute;left:0;right:0;top:0;height:470px;pointer-events:none;
  background:radial-gradient(96% 58% at 6% -6%,rgba(86,150,240,.34),transparent 64%),
             radial-gradient(124% 60% at 98% 4%,rgba(132,188,250,.30),transparent 66%)}
.hm-scroll{position:relative;z-index:1;padding:0 19px 14px}
/* 头部：圆角方块头像（描一圈半透明白边）＋右下角编辑徽章 ＋ 右侧姓名／公司两行 */
.hm-hero{position:relative;display:flex;align-items:center;gap:13px;padding:17px 0 2px 3px}
.hm-ava{position:relative;width:68px;height:68px;flex:none;border-radius:22px;box-sizing:content-box;
  border:2.7px solid rgba(255,255,255,.6);overflow:hidden;background:linear-gradient(120deg,#A2E0FA,#62B1F7)}
.hm-ava i{position:absolute;display:block}
.hm-ava .bd{left:50%;bottom:-3px;width:52px;height:26px;margin-left:-26px;border-radius:26px 26px 0 0;
  background:linear-gradient(180deg,#FFFFFF,#DDEEFF)}
.hm-ava .fc{left:50%;top:13px;width:31px;height:31px;margin-left:-15.5px;border-radius:50%;
  background:linear-gradient(180deg,#333A5C 0 9px,#F9DFC4 9px 100%)}
/* 眼镜：一横条会被看成蒙眼布，改画两片镜片＋中间留缝 */
.hm-ava .gl{left:50%;top:23px;width:25px;height:7px;margin-left:-12.5px;background:none}
.hm-ava .gl::before,.hm-ava .gl::after{content:"";position:absolute;top:0;width:9.5px;height:7px;border-radius:3px;background:#333A5C}
.hm-ava .gl::before{left:0}
.hm-ava .gl::after{right:0}
/* 编辑徽章：稿子上压在头像右下角（130 方框的 73.8% 处），不越出头像外沿 */
.hm-edit{position:absolute;left:57px;top:71px;width:18px;height:18px;border-radius:50%;z-index:2;
  display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden;
  background:linear-gradient(140deg,#8FB4F7,#4E7BFF);box-shadow:0 3px 7px -3px rgba(50,105,215,.95),0 0 0 2px #fff}
.hm-who{display:flex;flex-direction:column;gap:3px;min-width:0}
.hm-name{font-size:21px;font-weight:600;color:#102953;letter-spacing:.01em;line-height:1.25}
.hm-co{font-size:12px;color:#5A79AB;letter-spacing:.01em}
/* 会员卡：卡面写的是**当前演示版本**（旗舰版／高级版／标准版），由 REND['host-me'] 按 VER 现填——
   侧栏一切版本这一屏就重渲染，卡跟着换，不需要另加联动。
   视觉照 Figma 370:597 的三张卡（深蓝「智能托管版」／浅蓝「高级版」／米白「标准版」各一张）；
   **卡上只借视觉，文案用本项目的版本名**：稿子顶档写「智能托管版会员」，本仓库那一档叫旗舰版
   （二期 PRD §1.4），照抄会凭空多出一个不存在的档。
   三张卡版式只有一份，差异全走 CSS 变量：--vtg 斜纹／--vgl 右上光晕／--vrim 冠边／--vglass 玻璃面／
   --vgem 钻／--vring 轨道环／--vball 球／--vhalo 冠后辉光／--vtag* 小牌／--vtt 标题渐变字／--vsub 副标。 */
.hm-vipwrap{position:relative;margin-top:11px}
/* 变量挂在**壳**上、不在卡上：卡右侧那顶冠是卡的**兄弟**（要越出 overflow:hidden 的卡，只能挂在卡外），
   变量只沿 DOM 向下继承，挂卡上就传不到冠那一支——冠、环、球会静默变透明，只剩卡面。
   所以变量一律定义在 .hm-vipwrap.v-*，卡和插画都从壳上继承 */
.hm-vip{position:relative;height:83px;border-radius:9px;overflow:hidden;isolation:isolate;
  background:var(--vcard);box-shadow:var(--vshadow)}
/* 卡身那道斜纹三张都有，只是深浅不同（稿子是位图，这里用 -56° 的重复渐变近似） */
.hm-vip::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(-56deg,var(--vtg) 0 1px,transparent 1px 5px)}
.hm-vip::after{content:"";position:absolute;inset:0;pointer-events:none;background:var(--vgl)}
.hm-vipwrap.v-pro{
  --vtg:rgba(255,255,255,.05);
  --vgl:radial-gradient(74% 132% at 90% 2%,rgba(158,118,255,.26),transparent 62%);
  --vrim:linear-gradient(150deg,#FFFFFF 0%,#FCE6FF 26%,#EDA6FF 58%,#B44BFB 88%,#8E2BF2 100%);
  --vglass:linear-gradient(158deg,rgba(255,255,255,.96) 0%,rgba(255,214,255,.72) 42%,rgba(206,120,255,.62) 100%);
  --vgem:linear-gradient(158deg,#F6E2FF 0%,#C77BFD 30%,#9A3BF7 62%,#6A1CE6 100%);
  --vring:rgba(255,234,255,.95);
  --vball:radial-gradient(circle at 34% 28%,#FFFFFF,#F4CDFD 46%,#B93BF0);
  --vhalo:radial-gradient(56% 56% at 50% 48%,rgba(196,140,255,.34),rgba(138,80,255,.10) 66%,transparent 88%);
  --vtagfg:#A9ABCF;--vtagbg:#0C0E19;
  --vtt:linear-gradient(96deg,#F3F1FF,#D9D3FF);
  --vsub:rgba(255,255,255,.65);
  --vcard:linear-gradient(112deg,#0C0E19 0%,#12182C 46%,#1D1F37 72%,#23384D 100%);
  --vshadow:0 14px 28px -22px rgba(8,16,48,.95)}
.hm-vipwrap.v-adv{
  --vtg:rgba(255,255,255,.34);
  --vgl:radial-gradient(74% 132% at 90% 2%,rgba(255,255,255,.5),transparent 62%),
        radial-gradient(64% 96% at 2% 96%,rgba(255,252,244,.85),transparent 62%);
  --vrim:linear-gradient(150deg,#FFFFFF 0%,#FFFCF6 30%,#FFEEDA 64%,#F8D6B8 88%,#EFC29C 100%);
  --vglass:linear-gradient(158deg,rgba(255,255,255,.96) 0%,rgba(255,226,214,.78) 40%,rgba(255,150,160,.66) 100%);
  --vgem:linear-gradient(158deg,#FFE1D6 0%,#FD8C84 30%,#F5433A 62%,#C81E22 100%);
  --vring:rgba(255,244,232,.95);
  --vball:radial-gradient(circle at 34% 28%,#FFFFFF,#FFE0C6 46%,#E2A87E);
  --vhalo:radial-gradient(56% 56% at 50% 48%,rgba(255,190,160,.36),rgba(250,150,130,.10) 66%,transparent 88%);
  --vtagfg:#A04000;--vtagbg:#FFE7D0;
  --vtt:linear-gradient(96deg,#9D2700,#A04000);
  --vsub:rgba(131,33,0,.7);
  --vcard:linear-gradient(118deg,#FFE3CA 0%,#FFE9D4 34%,#FFF8EB 74%,#FFEAD4 100%);
  --vshadow:0 14px 28px -22px rgba(196,120,70,.9)}
.hm-vipwrap.v-std{
  --vtg:rgba(255,255,255,.3);
  --vgl:radial-gradient(74% 132% at 90% 2%,rgba(255,255,255,.55),transparent 62%),
        radial-gradient(60% 92% at 2% 96%,rgba(226,240,255,.8),transparent 60%);
  --vrim:linear-gradient(150deg,#FFFFFF 0%,#F4F7FF 30%,#DFE6FF 64%,#BACAFB 88%,#93AAFA 100%);
  --vglass:linear-gradient(158deg,rgba(255,255,255,.96) 0%,rgba(214,238,255,.78) 44%,rgba(140,220,225,.70) 100%);
  --vgem:linear-gradient(158deg,#EAF0FF 0%,#8FB4FF 30%,#3D6BEE 62%,#1839AE 100%);
  --vring:rgba(240,244,255,.95);
  --vball:radial-gradient(circle at 34% 28%,#FFFFFF,#D8DEFF 46%,#8FA4F5);
  --vhalo:radial-gradient(56% 56% at 50% 48%,rgba(215,235,255,.42),rgba(150,190,255,.12) 66%,transparent 88%);
  --vtagfg:#DFF0FF;--vtagbg:linear-gradient(150deg,#6FA6F1,#4A91E7);
  --vtt:linear-gradient(96deg,#1355A5,#0C3971);
  --vsub:rgba(0,62,139,.72);
  --vcard:linear-gradient(112deg,#6AA3EF 0%,#9BCEFD 42%,#7FC2FE 72%,#59B0FE 100%);
  --vshadow:0 14px 28px -22px rgba(30,90,190,.9)}
/* 「企业」小牌：左上角跟卡同圆角、右下角一个大圆角（稿子逐行扫出来是 43×18.7，右下圆角半径 ~15）。
   字压到 10.5px／500——按稿子量出的字宽反推的字号，写 11 会宽出一截、牌被顶满 */
.hm-vtag{position:absolute;left:0;top:0;width:43px;height:19px;border-radius:9px 0 15px 0;z-index:2;
  box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:2px 6px 0 0;
  font-size:10.5px;font-weight:500;letter-spacing:.02em;color:var(--vtagfg);background:var(--vtagbg)}
/* 标题行：小冠图标 22px ＋ 19px 渐变字。图标与标题的纵向中心在稿子上基本齐平，直接 align-items:center */
.hm-vrow{position:absolute;left:15px;top:24px;display:flex;align-items:center;gap:9px;z-index:2}
.hm-vic{width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center}
.hm-vtt{font-size:19px;font-weight:600;letter-spacing:.01em;line-height:26px;
  background-image:var(--vtt);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent}
.hm-vsub{position:absolute;left:15px;top:57px;font-size:11px;line-height:15px;letter-spacing:.01em;color:var(--vsub)}
/* 插画：一顶玻璃冠 ＋ 一颗钻 ＋ 一圈斜轨道环，纯 CSS（同工具页顶右插画口径：远看是那个意思即可）。
   冠比卡高 22px ⇒ 得挂在卡外的定位壳上，放进 overflow:hidden 的卡里顶会被切平。
   轨道环切两半：后弧从冠左上绕过去、前弧横压冠身——一条完整椭圆做不出「一半在冠后一半在冠前」。
   冠那串 27 点轮廓是照稿子逐行扫出来的，不是随手画的；要改先看一眼 Figma 370:597 那张三卡规格表。
   子元素一律挂在 .hm-vip-art 下，不裸用 .pane／.orb 这类泛名去撞壳里别处的同名类 */
.hm-vip-art{position:absolute;right:17px;top:-12px;width:120px;height:83px;pointer-events:none;z-index:2}
.hm-vip-art .halo{position:absolute;left:14px;top:2px;width:88px;height:80px;border-radius:50%;
  filter:blur(9px);background:var(--vhalo)}
.hm-vip-art .ring{position:absolute;left:1.5px;top:37px;width:117px;height:36px;border-radius:50%;
  border:2.6px solid var(--vring);transform:rotate(-16deg)}
.hm-vip-art .ring.back{z-index:1;clip-path:inset(0 0 50% 0)}
.hm-vip-art .ring.front{z-index:5;clip-path:inset(50% 0 0 0)}
.hm-vip-art .crown{position:absolute;left:17px;top:0;width:82.5px;height:82.5px;z-index:3}
.hm-vip-art .crown>*{position:absolute;left:0;top:0;width:100%;height:100%;
  clip-path:polygon(42.7% 0,32% 10.7%,25.3% 19.3%,22% 23.3%,4.7% 25.3%,2.7% 27.3%,0 34%,0 40.7%,6.7% 70.7%,
    11.3% 94%,17.3% 99.3%,26.7% 100%,50.7% 100%,72% 99.3%,79.3% 98.7%,85.3% 95.3%,88% 91.3%,94.7% 60.7%,
    99.3% 34%,100% 30.7%,99.3% 25.3%,95.3% 21.3%,91.3% 19.3%,72% 17.3%,62% 14%,56% 7.3%,48% 0)}
.hm-vip-art .rim{background:var(--vrim);filter:drop-shadow(0 5px 10px rgba(14,8,48,.6))}
/* 内嵌的「玻璃」＝同形缩一档：外圈留下的那道边就是稿子上那圈厚边 */
.hm-vip-art .glass{background:var(--vglass);transform:scale(.82)}
/* 钻：经典圆钻的侧俯视——顶面一条平边、腰围左右各一个尖、底下收成一点。
   刻面靠三层背景叠出来：亭部从底尖发散的楔形、台面一片亮、底下是本变体的主色 */
.hm-vip-art .gem{clip-path:polygon(28% 36%,72% 36%,86% 55%,48% 84%,14% 55%);
  background:
    repeating-conic-gradient(from 186deg at 50% 100%,rgba(255,255,255,.26) 0 5deg,rgba(255,255,255,0) 5deg 11.5deg),
    linear-gradient(180deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,.5) 20%,rgba(255,255,255,0) 42%),
    var(--vgem)}
/* 冠部两条棱线：从台面两角斜到腰围 */
.hm-vip-art .gem::before{content:"";position:absolute;inset:0;
  background:
    linear-gradient(63deg,transparent 27%,rgba(255,255,255,.6) 27.4%,rgba(255,255,255,.6) 28%,transparent 28.4%),
    linear-gradient(-63deg,transparent 27%,rgba(255,255,255,.6) 27.4%,rgba(255,255,255,.6) 28%,transparent 28.4%)}
.hm-vip-art .gem::after{content:"";position:absolute;left:6%;top:55%;width:88%;height:1.2px;
  background:rgba(255,255,255,.7)}
.hm-vip-art .ball{position:absolute;width:7.4px;height:7.4px;border-radius:50%;z-index:6;background:var(--vball)}
.hm-vip-art .ball.b1{left:0;top:67.5px}
.hm-vip-art .ball.b2{left:112.3px;top:35.2px}
/* 功能模块卡：白卡 ＋ 四列宫格（稿子两段都是四列；「常用功能」第二行只有一枚，网格自然落在首列）。
   图标＝同色系光晕 ＋ 渐变圆角块 ＋ 白色线性图标，与工具页 45 枚工具同一套画法 */
.hm-mod{position:relative;margin-top:14px;border-radius:16px;background:#fff;padding:15px 15px 14px;
  box-shadow:0 12px 26px -22px rgba(46,72,150,.9)}
.hm-mh h4{font-size:18px;font-weight:500;color:#333;letter-spacing:.01em;line-height:26px}
.hm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px;margin-top:9px}
.hm-item{display:flex;flex-direction:column;align-items:center;gap:5px;border-radius:14px;padding:2px 2px 4px;
  position:relative;overflow:hidden;background:none}
.hm-il{position:relative;width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center}
.hm-halo{position:absolute;left:0;top:0;width:44px;height:44px;border-radius:50%;filter:blur(3px)}
.hm-sq{position:relative;width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff}
.hm-nm{font-size:12.5px;font-weight:400;color:#333;line-height:17px;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hm-nm.sm{font-size:11.5px} /* 稿子上六字（AI点数明细）自己降了一档，照办 */
/* #host-me .tk-seg（「演示」卡里那枚排法分段器的卡内间距）2026-10-16 删：
   那张卡比的是托管清单的排法，清单没了卡也就没了（见本屏静态段那条注释与 ADR-0065）。 */
/* 这一屏的底部 Tab 与其余四屏同一条宿主全局导航（五枚、AI托管居中抬起），只有选中位不同：紫底紫标。
   :not(.ai) 与下面那条白图标，是把 id 规则从抬起的 AI 那枚身上让开——照工具页／任务页的处理 */
#host-me .hv-tab button.on:not(.ai){background:#EFEBFF}
#host-me .hv-tab button.on .ic{color:#7B5BFF}
#host-me .hv-tab button.ai .ic{color:#fff}

/* ---------------- 宿主 App「设置」（二级页 · 工具页「设置」胶囊进）· 照安卓截图 1:1 复刻 ----------------
   口径：结构、文案、层级照截图逐条搬（截图 12 张卡，到「关联好友」为止）；视觉归到本壳。
   2026-10-12 按用户要求动了三处：私聊／群聊两组设置删除、数智员工选择挪到辅助回复下方、
   话术库弹窗那张卡先隐藏（见 JS 里 REND 的注释）——所以现在实渲染 11 张卡。
   页面名也从「悬浮窗设置」改成了「设置」（标题／工具页入口／侧栏／卡内文案四处齐改）。
   ★ 三处**截图管不着、由本项目规则定死**的，钉在这里免得日后被「对齐截图」改回去：
     ① 强调色用 --primary（M3 紫 #5A54F9），不是截图里的蓝 #1A6DFF。本壳全套只有一个种子色，
        单给这一屏留一条蓝，用户会以为「蓝＝另一类动作」（工具页那次同口径）。
     ② 截图右下那枚白色悬浮球不画：它是宿主系统级浮层，不属于这一屏的内容，本壳的悬浮球另有其屏。
     ③ 标题左对齐不居中，也不画系统状态栏／手势条：本壳已有 Android 外壳（.statusbar／.sysnav），
        再叠一层就是两层导航（SKILL.md 的返工线）。
     另：「修改」一律弹 Snackbar 报演示范围外——这一屏的数值都归宿主后台管，
     原型里给它一个真能改的入口，等于替本模块承诺了一件它做不到的事（同工具页那 44 枚）。
   两种控件都尽量复用壳里已有的：开关＝.switch（M3 52×32），提示＝.toast（底部 Snackbar）；
   只有 M3 单选按钮是这一屏新起的（app 载体此前没有）。 */
#host-fwset{background:linear-gradient(180deg,#F5F6FE 0%,#FAFAFE 34%,#FFFFFF 100%)}
.fw-pg{padding:2px 14px 22px}
/* 本屏屏底那枚「微信聊天演示」pill（演示件，ADR-0076）占 16(下缘)+34(身高)＝50px，滚动区底垫得给它让出来
   ——不让就让最后一张卡的「修改」压在 pill 底下（库首页那枚 pill 一直是这个毛病，那边没人抱怨，这屏照办）。
   **只加在本屏**：三级页 #host-fwset-assist 没有这枚 pill，别跟着多垫一截。 */
#host-fwset .fw-pg{padding-bottom:58px}
.fw-bar{padding-right:12px}
.fw-save{height:34px;padding:0 18px;font-size:13.5px;font-weight:700}
/* 卡片：整屏只有这一种卡（白底、圆角 16、无描边）。行与行靠留白＋一道 1px 线断开，不靠换卡 */
.fw-card{margin-bottom:12px;border-radius:16px;background:#fff;padding:13px 14px;
  box-shadow:0 14px 30px -26px rgba(40,70,150,.95)}
/* 卡内「段」标题与「项」标题——两级，字号拉开才分得清哪行是分组名、哪行是一个具体项 */
.fw-h{font-size:16px;font-weight:700;color:var(--on-surface);letter-spacing:.01em}
.fw-cap{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-top:14px;
  font-size:14.5px;font-weight:700;color:var(--on-surface)}
.fw-cap .sf{font-size:12px;font-weight:400;color:var(--on-surface-variant)}
/* 曾有一枚 .fw-rule（段名底下那道线，截图里「微信」底下就有一道）。2026-10-14（ADR-0053）撤掉
   「微信」段名之后它就没有使用者了，一并删——本屏每一张卡都是一件事，段名不再是分组的抬头 */
/* 灰字说明：行高松一点，别和正文糊成一坨 */
.fw-hint{font-size:12.5px;line-height:1.6;color:var(--on-surface-variant);margin-top:6px}
/* 开关行（标题＋可选灰色后缀＋右侧 M3 开关）。后缀是「适用于…平台」这种限定语，跟在标题下不换卡 */
.fw-sw{display:flex;align-items:center;gap:12px}
.fw-sw .tx{flex:1;min-width:0}
.fw-sw b{display:block;font-size:15px;font-weight:700;color:var(--on-surface);letter-spacing:.01em}
.fw-sw .sf{display:block;font-size:12px;line-height:1.5;color:var(--on-surface-variant);margin-top:3px}
/* 浅灰子行：截图里「值行」和「单选组」共用同一枚底座，就同一枚件（语义不同才分件） */
.fw-box{margin-top:9px;padding:12px 13px;border-radius:10px;background:var(--sc-low)}
.fw-box.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  position:relative;overflow:hidden}
.fw-box .tx{flex:1;min-width:0;font-size:14.5px;font-weight:500;color:var(--on-surface);line-height:1.5}
.fw-box .rt{flex:none;font-size:12.5px;color:var(--on-surface-variant)}
.fw-box .sf{display:block;font-size:12px;font-weight:400;color:var(--on-surface-variant);margin-top:4px}
/* 数值：一屏里凡是「可调的数」一律主色——扫一眼就知道哪些数归后台管 */
.fw-box .num,.fw-lim .num{color:var(--primary);font-weight:700}
/* 只读行不做成按钮：点了没反应的按钮比一枚锁更让人犯嘀咕（壳里那条老口径） */
.fw-ed{flex:none;font-size:13.5px;font-weight:700;color:var(--primary)}
/* 单选组：一组＝一枚浅灰盒，选项横排换行。选中＝主色圆环＋实心点（M3 radio），文案同时转主色 */
.fw-rds{display:flex;flex-wrap:wrap;gap:9px 16px}
.fw-opt{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--on-surface);
  position:relative;overflow:hidden;border-radius:8px;padding:2px 5px;margin:-2px -5px;text-align:left}
.fw-opt.on{color:var(--primary);font-weight:600}
.fw-r{flex:none;width:19px;height:19px;border-radius:50%;border:2px solid var(--outline);position:relative}
.fw-opt.on .fw-r{border-color:var(--primary)}
.fw-opt.on .fw-r::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--primary)}
/* 限额行（标题＋主色数值／灰色建议＋右侧「修改」）。行间一道 1px 线——一卡里那几条是并列关系，不是主从 */
.fw-lim{display:flex;align-items:flex-start;gap:10px;margin-top:12px;padding-top:12px;box-shadow:inset 0 1px 0 #EFF2F9}
.fw-lim.first{margin-top:11px;padding-top:0;box-shadow:none}
.fw-lim .tx{flex:1;min-width:0}
.fw-lim .t1{display:block;font-size:14.5px;font-weight:500;color:var(--on-surface);line-height:1.55}
.fw-lim .t2{display:block;font-size:12px;color:var(--on-surface-variant);line-height:1.55;margin-top:4px}
.fw-lim .ed{flex:none;font-size:13.5px;font-weight:700;color:var(--primary);align-self:center;
  position:relative;overflow:hidden;border-radius:8px;padding:6px 8px;margin:-6px -8px}
/* 桌面小部件行：右边那串是「已选的小部件」，不是第二级入口——整行只有一个动作，就别摆两枚箭头 */
.fw-link{display:flex;align-items:center;gap:10px;width:100%;text-align:left;position:relative;overflow:hidden}
.fw-link .tx{flex:1;min-width:0}
.fw-link b{display:block;font-size:15px;font-weight:700;color:var(--on-surface);letter-spacing:.01em}
.fw-link .sf{display:block;font-size:12px;line-height:1.5;color:var(--on-surface-variant);margin-top:4px}
.fw-link .cv{flex:none;color:var(--outline);display:flex}
/* 曾有一枚 .fw-link.mt（给「跟在段标题那道线下面」的跳转行补上距）。2026-10-14（ADR-0053）撤掉
   「微信」段名与那道线之后，位置没了、修饰类也跟着删——留着它只会让下一枚行莫名其妙地多一截上距 */

/* ===== 辅助回复设置页（#host-fwset-assist）· 2026-10-14 新增（ADR-0044，卡① 见 ADR-0053）=====
   本仓库第一处「预览 ＋ 控件」界面，也是第一枚滑动条。这页回答两件事：① 辅助回复用哪位数智员工
   ——一枚「已选择 X ＋ 修改」的值行，点「修改」跳 AI配置那张员工列表去点选（ADR-0053）
   ② 浮层透明度——**滑块只驱动本页那枚微信小样上的浮层，真实 #aiPanel 恒不透明**（用户明确的口径：
   演示件不得读作产品能力；冒烟有一条断言专钉这件事）。页面底色沿用设置页那道浅蓝洗色
   （页面底不是控件，§5 第 2 条禁的是「按钮／FAB 用渐变填充」），页内控件一律纯色。
   卡① 两枚件都不新造：段名走 .fw-h、值行走 .fw-box.row＋.fw-ed（＝v105 那枚 fwEditRow 的形状）。 */
#host-fwset-assist{background:linear-gradient(180deg,#F5F6FE 0%,#FAFAFE 34%,#FFFFFF 100%)}
/* 预览：一枚微信聊天小样（灰底、两条气泡），辅助浮层的缩小件叠在上面，其 opacity ＝ FW_OP/100。
   浮层调淡时底下的绿泡透出来——这就是「看得见的效果」。小样里的浮层**不复用 #aiPanel 的类**：
   那是 384.5px 的实物、这里是缩样，尺寸口径不同，混用会让两处互相牵制（色值照搬，结构自己一份）。 */
.fw-pv{position:relative;margin-top:10px;height:188px;border-radius:12px;background:#EDEDED;
  overflow:hidden;padding:10px}
.fw-pv .pv-r{display:flex;margin-bottom:8px}
.fw-pv .pv-r.me{justify-content:flex-end}
.fw-pv .pv-b{max-width:76%;border-radius:9px;padding:7px 10px;font-size:12px;line-height:1.6}
.fw-pv .pv-r.you .pv-b{background:#fff;color:#1A1A1A;border-top-left-radius:3px}
.fw-pv .pv-r.me .pv-b{background:#95EC69;color:#06380F;border-top-right-radius:3px}
.fw-fl{position:absolute;left:12px;right:12px;top:42px;border-radius:11px;background:#EFF0FF;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6);padding:9px 10px 11px}
.fw-fl .fl-st{display:flex;align-items:center;gap:5px;height:15px;font-size:11px;line-height:1;color:#587ad9}
.fw-fl .fl-st i{width:4px;height:4px;border-radius:50%;background:#00D991;flex:none}
.fw-fl .fl-x{position:absolute;right:0;top:0;width:24px;height:15px;border-radius:0 11px 0 11px;
  background:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;color:#AAC1E5}
.fw-fl .fl-cd{margin-top:7px;border-radius:8px;background:rgba(255,255,255,.9);padding:9px;
  box-shadow:0 2px 10px rgba(217,229,255,.5)}
.fw-fl .fl-cd span{display:block;height:7px;border-radius:4px;background:#E4E9F7}
.fw-fl .fl-cd span+span{margin-top:7px;width:68%}
/* 滑动条（本仓库第一枚）· M3 形制：轨道 4dp 圆角、已选段 --primary、未选段 surface-variant、
   滑块 20dp 圆、触碰区高 44dp。三件套＝轨道底（::before）／已选段（.sld-f）／滑块（.sld-k），
   后两者的宽度与位移由 JS 按档位写成 calc()——轨道左右各内缩 10px（＝滑块半径），
   否则最低／最高档时滑块会有一半探出轨道外。
   从零画而不用 <input type=range>：原生件那道「已选段填充」只能靠 background 渐变实现，
   而这一屏不引入任何渐变，且自画的才带得住 M3 的 44dp 触碰区与 20dp 滑块这套比例。
   touch-action:pan-y 而非 none——竖直方向让页面照常滚，横向拖动才归滑块。 */
.fw-sld{margin-top:12px;display:flex;align-items:center;gap:12px}
.sld-t{position:relative;flex:1;min-width:0;height:44px;cursor:pointer;touch-action:pan-y}
.sld-t::before{content:"";position:absolute;left:10px;right:10px;top:50%;height:4px;margin-top:-2px;
  border-radius:2px;background:var(--surface-variant)}
.sld-f{position:absolute;left:10px;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:var(--primary)}
.sld-k{position:absolute;left:10px;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;
  background:var(--primary);box-shadow:0 1px 3px rgba(26,27,33,.32)}
.sld-t:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:8px}
.fw-sld .sld-v{flex:none;width:46px;text-align:right;font-size:13.5px;font-weight:700;color:var(--primary);
  font-variant-numeric:tabular-nums}

/* ================= 宿主App「小组件」（二级页）· 2026-10-16 照 Figma 节点 776:161（750×2200）复刻（ADR-0070） =================
   入口＝设置页① 那枚「桌面小部件」行（此前只弹「演示范围外」，这一笔才真开出这一屏）。
   口径与工具页／任务页／AI托管升级页三屏同一套：**视觉照抄稿子**（浅蓝雾底、粗圆角卡、
   蓝→紫渐变字与渐变胶囊），**长度按 412/750 折算（×0.5493）**——而**字体栈仍走 --f**：
   稿子通篇 PingFang，那落在 M3 的禁止清单上，不照抄。
   稿子上那四张「模块产品图」是位图，原型不带外部位图（ADR-0042）：照既有画法用 HTML/CSS 拼同构的形
   （三张指标卡／三行素材／三行任务／3×2 宫格）。
   ★ 这一屏的标题**居中**，与设置页那两屏（左对齐）不同——稿子就是这么画的，照它；先例见 #psEdit。
   ★ 名字一处对齐（稿子 → 仓库口径，四条都记在 ADR-0070）：今日推荐→素材推荐、话术库→素材库、
     今日概览→今日概况；稿子上的「自动回复」**保持**（宿主首屏那排也叫这个名）。
   ★ 「添加组件」在稿子上是真按钮（每卡一枚、共四枚），本屏一律走「演示范围外」——
     这一屏演示的是「小部件长什么样」，不是安装流程（与工具页那 45 枚同一口径）。
   ★ 第五枚「AI托管状态」是**二期 PRD §2.7 新增的那一枚**，稿子上没有它：旗舰版下与别的卡同长相；
     非旗舰版（标准版／高级版）／安全模式下**整卡灰显**、右下那枚胶囊换成只说「旗舰版能力」的静态件。
     那句话与升级提示页那句是**同一句**（§2.2 ②／§2.7 规则 3）；它**不做成按钮**——§2.2 说
     「升级提示页只有这一处入口」，别在这一屏再开第二扇门，摆一个说不通的入口不如把状态说清楚。 */
#host-widgets{background:linear-gradient(170deg,#F3F8FF 0%,#F5F8FE 34%,#F8F9FC 100%)}
/* 稿子顶端那片雾：稿上是两张位图（opacity .7），这里用两团径向斑还原 */
.hw-glow{position:absolute;left:0;right:0;top:0;height:330px;pointer-events:none;
  background:radial-gradient(52% 32% at 20% -8%,rgba(150,178,255,.32),transparent 72%),
             radial-gradient(46% 28% at 98% 0%,rgba(182,160,255,.24),transparent 74%)}
/* 标题居中照稿（稿子标题 34px 居中，本壳 .appbar-back h3 默认左对齐）：先例同 #psEdit */
#host-widgets .appbar-back{position:relative}
#host-widgets .appbar-back h3{position:absolute;left:44px;right:44px;top:0;bottom:0;display:flex;
  align-items:center;justify-content:center;padding:0;pointer-events:none;
  font-size:18.7px;font-weight:500;color:#102953}   /* 34px×.5493；稿子上是 Medium 字重 */
.hw-pg{position:relative;z-index:1;padding:2px 0 26px}
/* 卡：稿子 690 宽（左右各留 30）、圆角 30、卡间距 44、四张高 320/452/450/570，
   → 本机 380 宽＝左右各 16、圆角 16.5、间距 24.2、高 175.8/248.3/247.2/313.1。
   那四个高度**不写死**，是「预览区内容自高 ＋ 51.6 的文案条」自然撑出来的：
   写死就等于下次改一句文案就得回来重算一遍。 */
.hw-card{margin:0 16px 24.2px;border-radius:16.5px;overflow:hidden;
  background:linear-gradient(168deg,#EAEEFE 0%,#F1F4FE 46%,#F6F7FE 100%);
  box-shadow:0 14px 26px -22px rgba(50,80,170,.95),inset 0 0 0 1px rgba(255,255,255,.6)}
/* 预览区：稿子上四张产品图一律从卡顶下 21 设计px（＝11.5）起排、左右各缩 21（11.5） */
.hw-pv{padding:11.5px 11.5px 0}
/* 文案条：稿高 94（＝51.6）——左边一句渐变字、右边一枚「添加组件」胶囊，两侧各缩 32（17.6） */
.hw-cap{display:flex;align-items:center;gap:10px;height:51.6px;padding:0 17.6px}
.hw-cap .t{flex:1;min-width:0;font-size:17.6px;font-weight:700;line-height:1.1;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background-image:linear-gradient(90deg,#1677FF,#9452FF);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent}
/* 「添加组件」：稿 172×60 全圆角、蓝→紫（#2D85FF→#AC78FF），左端一枚白底加号圆（32→17.6） */
.hw-add{flex:none;display:flex;align-items:center;gap:8.8px;height:33px;padding:0 10px 0 8.8px;
  border:0;border-radius:999px;font-family:inherit;font-size:13.2px;font-weight:600;color:#fff;
  background:linear-gradient(90deg,#2D85FF,#AC78FF);cursor:pointer;position:relative;overflow:hidden}
.hw-add .ic{flex:none;width:17.6px;height:17.6px;border-radius:50%;background:rgba(255,255,255,.94);
  display:flex;align-items:center;justify-content:center;color:#4B7BFF}
/* —— 预览一：今日概况（三张指标卡，数字吃渐变、标签浅蓝灰） */
.hw-stats{display:flex;gap:4.4px;height:112.7px}
.hw-stat{flex:1;min-width:0;border-radius:10px;background:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;box-shadow:0 6px 14px -12px rgba(50,80,170,.9)}
.hw-stat b{font-size:22px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;
  background-image:linear-gradient(96deg,#1677FF,#9452FF);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent}
.hw-stat span{font-size:11px;color:#8A9CC4}
/* —— 预览二／三：素材推荐／今日待办（三行白卡）。行高 58.6——稿子那两张量出来是 58.8 与 58.4，
   同一件东西的两处误差，取中当一档，不为 0.4px 分两个类 */
.hw-rows{display:flex;flex-direction:column;gap:4.4px}
.hw-row{display:flex;align-items:center;gap:8px;height:58.6px;padding:0 12px;border-radius:10px;background:#fff;
  box-shadow:0 6px 14px -12px rgba(50,80,170,.9)}
.hw-row .b{flex:1;min-width:0;font-size:14.3px;font-weight:500;color:#1F2A44;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hw-row .rt{flex:none;font-size:10.5px;color:#93A3C0}
.hw-row .cv{flex:none;color:#B7C6DD;display:flex}
/* 行首那枚图标块（只有今日待办那三行有）：稿子上是彩色渐变圆角块＋白色线性图标 */
.hw-ic{flex:none;width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff}
/* 状态标签三档＝照素材库那三档的配色（即将到期＝红／已更新＝蓝／NEW＝绿）——稿子上也是这三色 */
.hw-tag{flex:none;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;letter-spacing:.02em}
.hw-tag.red{background:#FFECEC;color:#F2545B}
.hw-tag.upd{background:#E3EFFF;color:#1677FF}
.hw-tag.new{background:#E6FFF0;color:#17D861}
/* —— 预览四：快捷工具（3×2 宫格，每格＝白卡＋一枚渐变圆角块＋名字）。稿子格高 122、列距 4.4、行距 5.5 */
.hw-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5.5px 4.4px}
.hw-cell{height:122px;border-radius:10px;background:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:7px;box-shadow:0 6px 14px -12px rgba(50,80,170,.9)}
.hw-sq{flex:none;width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff}
.hw-nm{font-size:12.5px;font-weight:500;color:#1F2A44;white-space:nowrap}
/* —— 预览五：AI托管状态（PRD §2.7 新增那一枚，稿子上没有它）。
   形状照 §2.7 那张表的三件：开关卡（托管记号＋伙伴名＋状态标题＋开关）／工作时段行／「进入 AI托管 ›」。
   三行里的字读的都是托管那一侧的真值（HVA_HOST_AGENT／HVA_ON／HVA_WORK／HVA_IDLE），**不写死**——
   组件上写的必须是 App 里那个状态（§2.7 规则 1：与 App 同源）。 */
.hw-aicard{display:flex;align-items:center;border-radius:10px;background:#fff;
  box-shadow:0 6px 14px -12px rgba(50,80,170,.9)}
.hw-aicard+.hw-aicard{margin-top:4.4px}
.hw-aih{gap:8px;padding:10px 12px}
.hw-aih .orb{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;background:linear-gradient(150deg,#EFEAFF,#D9E2FF);color:#6C5CE7}
.hw-aih .tx{flex:1;min-width:0}
.hw-aih .tx small{display:block;font-size:10.5px;line-height:1.5;color:#8A9CC4}
.hw-aih .tx b{display:block;font-size:15px;font-weight:700;line-height:1.35;
  background-image:linear-gradient(96deg,#0F2A58,#2A62B4);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent}
/* 这枚开关只是**画**出当前状态（读 HVA_ON），不是这一屏的开关——真开关在 AI托管主页那张卡上，
   组件上拨动要走后台那条确认链，原型不演示（§2.7 规则 1 那句的落点） */
.hw-sw{flex:none;width:34px;height:20px;border-radius:999px;background:#D7DEEE;position:relative}
.hw-sw i{position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(30,45,90,.3)}
.hw-sw.on{background:#4B7BFF}
.hw-sw.on i{left:16px}
.hw-aic{padding:0 12px;height:34px}
.hw-aic .tm{display:flex;align-items:center;gap:5px;font-size:11.5px;color:#7890B8}
.hw-go{padding:0 12px;height:36px;justify-content:space-between;font-size:12.5px;font-weight:600;color:#4B7BFF}
/* 非旗舰版／安全模式：整卡灰显 ＋ 那枚胶囊换成只说「旗舰版能力」的静态件（同一句，见 PRD §2.2 ②） */
.hw-card.lock .hw-pv,.hw-card.lock .hw-cap .t{opacity:.45;filter:grayscale(1)}
.hw-lock{flex:none;display:flex;align-items:center;height:33px;padding:0 14px;border-radius:999px;
  font-size:13.2px;font-weight:600;color:#8494B4;background:#E7EAF3}

/* ---------------- 素材库首页（顶栏 + 搜索 + 两级横向选择 + 单列流） ---------------- */
/* 第一级：六个内容视图互斥单选。横向可滚，不把分组挤成侧栏；选中用 M3 主色指示条。 */
.fltw{position:relative;flex:none;background:var(--surface)}
.fltbar{display:flex;align-items:stretch;gap:18px;min-height:48px;overflow-x:auto;scrollbar-width:none;padding:0 16px;background:var(--surface)}
.fltbar::-webkit-scrollbar{display:none}
.lib-tab{position:relative;flex:none;min-width:42px;height:48px;padding:0 2px;color:var(--on-surface-variant);font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden}
.lib-tab.on{color:var(--primary);font-weight:600}
.lib-tab.on::after{content:"";position:absolute;left:4px;right:4px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--primary)}
.lib-tab:focus-visible,.gri:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
/* 第二级：当前视图的分组 filter chips。分组仍是收窄器，但从侧栏改为搜索下的横向行。 */
.grail{flex:none;min-height:48px;background:var(--sc-low);overflow:hidden;border-bottom:1px solid var(--outline-variant)}
.grail-in{display:flex;align-items:center;gap:8px;min-width:100%;height:48px;overflow-x:auto;scrollbar-width:none;padding:7px 16px}
.grail-in::-webkit-scrollbar{display:none}
.gri{display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;height:32px;padding:0 12px;border:1px solid var(--outline);border-radius:var(--shape-s);font-size:12px;font-weight:500;color:var(--on-surface-variant);white-space:nowrap;position:relative;overflow:hidden}
.gri.on{background:var(--secondary-container);border-color:transparent;color:var(--on-secondary-container)}
.gri.on::before{content:"";width:9px;height:5px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg) translateY(-1px);flex:none}
.gri.action{border-style:dashed;color:var(--primary)}
.gri-div{flex:none;width:1px;height:20px;background:var(--outline-variant)}
.gri-note{display:inline-flex;align-items:center;gap:6px;flex:none;height:32px;padding:0 4px;font-size:11px;color:var(--on-surface-variant);white-space:nowrap}
.gri-t{display:none}
.lib-split{flex:1;min-height:0;display:flex;position:relative}
.lib-split .scroll{min-width:0;flex:1}
.rail-tab{display:none}
/* 能力不足的动作禁用态（M3：降透明度、保留可点，点按弹原因 Snackbar） */
.btn.dim,.rp-btn.dim{opacity:.38}
.fchip{flex:none;height:32px;padding:0 12px;border-radius:var(--shape-s);border:1px solid var(--outline);background:transparent;color:var(--on-surface-variant);font-size:12px;font-weight:500;display:inline-flex;align-items:center;cursor:pointer}
.fchip.on{background:var(--secondary-container);border-color:transparent;color:var(--on-secondary-container)}
.fltbar>.fchip{margin:auto 0}
.fdiv{flex:none;width:1px;height:20px;background:var(--outline-variant)}
/* 瘦身行原位展开的卡片体入场 */
@keyframes rowIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.feed{display:flex;flex-direction:column;gap:10px;padding:0 16px}
/* 瘦身行：一行一条（标题打头＋关键词脚注；行首不设类型 icon——类型进脚注文字），点行原位展开完整卡。
   分组筛选选中某组时这份列表就只剩该组——筛选只换池、不改形态（分组不是分段，见 ADR-0011） */
.cmp-list{display:flex;flex-direction:column;gap:10px;margin:0 16px 4px}
.cmp-card{background:var(--sc);border-radius:var(--shape-m);overflow:hidden}
.cmp-row{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 14px;cursor:pointer;position:relative;overflow:hidden}
.cmp-b{flex:1;min-width:0}
.cmp-b h5{font-size:14px;font-weight:500;color:var(--on-surface);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp-b p{font-size:11px;color:var(--on-surface-variant);margin-top:3px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.cmp-b p .tag{flex:none}
.cmp-arr{flex:none;color:var(--on-surface-variant);display:inline-flex;transition:transform .2s var(--emph)}
.cmp-row.on .cmp-arr{transform:rotate(90deg)}
.cmp-open{border-top:1px solid var(--outline-variant);animation:rowIn .18s var(--emph)}
/* 库首页底部演示开关（非最终设计的一部分）：切换「当前销售」以演示个人素材池 */
.demo-pill{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;z-index:8;height:34px;padding:0 16px;border-radius:17px;border:0;cursor:pointer;background:rgba(26,27,33,.82);color:#fff;font-size:12px;font-weight:500;box-shadow:0 2px 10px rgba(26,27,33,.32);backdrop-filter:blur(4px)}

/* ---------------- 卡面／缩略图（卡片即操作面，不设详情页） ---------------- */
.tile{border-radius:var(--shape-s);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.85);font-size:11px;font-weight:500;letter-spacing:.06em}
.tile::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 10px,transparent 10px 20px)}
.g1{background:linear-gradient(150deg,#7C74F7,#4E46D8)}
.g2{background:linear-gradient(150deg,#39B8E0,#2563C9)}
.g3{background:linear-gradient(150deg,#F2A93B,#E0633A)}
.g4{background:linear-gradient(150deg,#4AC58F,#1D9A6C)}
.g5{background:linear-gradient(150deg,#EC6FAE,#B44FD0)}
.g6{background:linear-gradient(150deg,#8B93A8,#4A5570)}
.g7{background:linear-gradient(150deg,#C9CB5A,#7FA03A)}
.g8{background:linear-gradient(150deg,#6F7BF3,#9A6FF0)}

/* ---------------- 微信场景（刻意仿真微信，不改 M3） ---------------- */
.wx{background:#EDEDED}
.wx-head{flex:none;background:#EDEDED;padding:8px 12px 10px;display:flex;align-items:center;gap:10px;border-bottom:.5px solid #DDDDDD}
.wx-head h4{flex:1;text-align:center;font-size:16px;font-weight:500;color:#1A1A1A}
.wx-head .ic{color:#1A1A1A;width:30px;display:flex;justify-content:center}
.wx-dock{flex:none;display:flex;gap:8px;align-items:center;padding:9px 12px;background:var(--inverse-surface);font-size:11px;color:var(--inverse-on-surface)}
.wx-dock .dk{background:rgba(255,255,255,.1);border-radius:999px;padding:6px 12px;font-weight:500;position:relative;overflow:hidden}
.wx-dock .dk.hl{background:var(--primary);color:#fff}
.chat-scroll{flex:1;overflow-y:auto;padding:14px 13px 18px;scrollbar-width:none}
.chat-scroll::-webkit-scrollbar{display:none}
.bub-row{display:flex;margin-bottom:14px;animation:bubIn .3s var(--emph)}
.bub-row.me{justify-content:flex-end}   /* 侧别取值与 bub(side,…) 一致：other＝客户来问，me＝销售发出 */
@keyframes bubIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.ava{width:37px;height:37px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:#9AA3AD;color:#fff;font-size:13px;font-weight:500}
.bub{max-width:74%;padding:10px 13px;border-radius:12px;font-size:14.5px;line-height:1.55;position:relative;word-break:break-word}
.bub-row.other .bub{background:#fff;margin-left:9px;color:#1A1A1A}
.bub-row.me .bub{background:#95EC69;margin-right:9px;color:#06380F}
.bub .b-hit{display:inline-flex;align-items:center;background:var(--primary-container);color:var(--on-primary-container);border-radius:5px;padding:0 3px;font-weight:700}
.bub-time{text-align:center;font-size:10.5px;color:#9A9CA4;margin:4px 0 14px}
.typing{display:flex;gap:4px;padding:12px 14px;background:#fff;border-radius:12px;margin-left:9px;width:64px}
.typing i{width:7px;height:7px;border-radius:50%;background:#C3C4CB;animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.16s}.typing i:nth-child(3){animation-delay:.32s}
@keyframes tp{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.wx-inputbar{flex:none;background:#F7F7F7;border-top:.5px solid #DEDEDE;display:flex;gap:9px;padding:9px 11px;align-items:center}
.wx-input{flex:1;background:#fff;border-radius:9px;padding:9px 12px;font-size:15px;color:#1A1A1A;box-shadow:0 0 0 .5px rgba(0,0,0,.04)}
.wx-send{width:62px;height:37px;border-radius:9px;background:var(--wx);color:#fff;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}

/* 悬浮球（产品 UI · M3） */
.ball{position:absolute;width:54px;height:54px;border-radius:50%;background:var(--primary);color:var(--on-primary);z-index:73;
  display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;user-select:none;
  box-shadow:var(--e3),0 0 0 1px rgba(255,255,255,.7);overflow:visible}
.ball.drag{cursor:grabbing}
.ball.hit{animation:pulse 1s var(--emph) 2}
@keyframes pulse{0%{box-shadow:var(--e3),0 0 0 4px rgba(255,255,255,.7)}50%{box-shadow:0 4px 12px 2px rgba(186,26,26,.45),0 0 0 9px rgba(186,26,26,.18)}100%{box-shadow:var(--e3),0 0 0 4px rgba(255,255,255,.7)}}
/* AI 模块球（ADR-0078）＝聊天辅助浮层收起后的**自己的**折叠态，与全局素材球是两颗独立的球：
   全局球恒在、只有单击＋拖动；这一颗在辅助浮层被收起/顶掉后出现、点它＝重开辅助浮层。
   42px（比 54 的全局球小一档，避免两颗球等权）、tertiary-container 与菜单里那枚「聊天辅助」同一套色；
   **自由拖拽、不贴边**（产品口径「独立拖到任意位置」）：位置只由 left/top 记住，不做 edge 半隐藏。 */
.mball{position:absolute;right:14px;top:100px;width:42px;height:42px;border-radius:50%;
  background:var(--tertiary-container);color:var(--on-tertiary-container);z-index:73;
  display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;user-select:none;
  box-shadow:var(--e3),0 0 0 1px rgba(255,255,255,.7)}
.mball.drag{cursor:grabbing}
.ball-badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;border-radius:10px;background:var(--error);color:#fff;
  font-size:10.5px;font-weight:500;display:none;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 0 0 2.5px #fff}
.ball-badge.show{display:flex}
@keyframes popCard{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:none}}
/* 「命中推荐弹卡」（.rec-pop／.rp-h／.rp-item／.rp-acts／.rp-more）已于 2026-10-15 整块删除（ADR-0061）：
   未开启聊天辅助时的命中改由浮层 #hpPanel 承担，弹卡那条路径不再存在。
   **.rp-btn 三态留着**——它不是弹卡专属，AI 浮层的命中行与展开区、素材卡展开区都用它。 */
.rp-btn{flex:1;height:32px;border-radius:999px;font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:4px;position:relative;overflow:hidden}
.rp-btn.ghost{background:var(--secondary-container);color:var(--on-secondary-container)}
.rp-btn.pri{background:var(--wx);color:#fff}
.rp-btn.amber{background:#F59E0B;color:#fff}
/* 卡片「⋯ 更多」的锚定气泡菜单（稿子 816:4066）：M3 菜单是「对着某个东西做点什么」，
   贴着那枚按钮展开——位置本身就是那份指代；底部弹层说的是「换个上下文」，用在这里会把人从卡片上带走 */
.pop-scrim{position:absolute;inset:0}
.pop{position:absolute;display:none;width:168px;padding:5px 0;background:var(--sc-lowest);
  border-radius:var(--shape-m);box-shadow:var(--e3);animation:popCard .18s var(--emph);overflow:hidden}
.pop-i{display:flex;align-items:center;gap:10px;width:100%;padding:12px 16px;border:0;background:none;font:inherit;
  font-size:13.5px;color:var(--on-surface);text-align:left;cursor:pointer;position:relative;overflow:hidden}
.pop-i svg{flex:none;color:var(--on-surface-variant)}
.pop-i.danger,.pop-i.danger svg{color:var(--error)}
/* 悬浮球点开＝两选一菜单（话术库 / 聊天辅助）：外壳沿用 .pop／.bmenu 那套贴边小卡，行结构另写（不是素材卡） */
.bmenu{position:absolute;z-index:73;width:214px;background:var(--sc-lowest);border-radius:var(--shape-m);box-shadow:var(--e3);overflow:hidden;animation:popCard .24s var(--emph)}
.bm-row{display:flex;align-items:center;gap:11px;padding:11px 13px;position:relative;overflow:hidden;cursor:pointer}
.bm-row+.bm-row{border-top:1px solid var(--outline-variant)}
.bm-ic{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}
.bm-ic.lib{background:var(--primary-container);color:var(--on-primary-container)}    /* 话术库＝素材库主色，与浮层强调色同一套 */
.bm-ic.ai{background:var(--tertiary-container);color:var(--on-tertiary-container)}    /* 聊天辅助＝tertiary，与实时辅助浮层同一套 */
.bm-t{flex:1;min-width:0;font-size:13.5px;font-weight:500;color:var(--on-surface)}
.bm-s{display:block;font-size:10.5px;font-weight:400;color:var(--on-surface-variant);margin-top:2px}

/* 「实时辅助」浮层（宿主模块「聊天辅助」· 与素材面板同层级、互斥；ADR-0036）
   外壳按 Figma「销售助手（新版）」节点 831:5114「模块」1:1 复刻：几何以 k = 412/750 换算自 750px 设计稿，
   面板本体/头部/内容卡/回答模块/底部药丸的尺寸与配色见下面的 #aiPanel 覆盖块与 ADR-0041。
   内容模型**照旧**：每条客户消息一轮的时间线（客户原话 → 命中素材 → AI 话术卡），只换容器与视觉语言。
   ADR-0036 要求的头部「演示」徽章 ＋ 底部脚注双标注已按新稿去掉（ADR-0042／0036 修订一，标注职责收回文档），
   所以这里不再有 .ai-badge；「命中素材」一段仍走 --primary 素材库色，故意不染成新稿的蓝紫。 */
/* 回答卡：.ra-card＝盒模型（旧轮/最新轮同款视觉），.ai-card＝只在**最新一轮**上再加的交互三件套。
   拆开是硬约束：tools/smoke.js 的 aiCard() 是 `querySelector('#aiPanel .ai-card')`（取文档序第一个），
   时间线是「旧轮在上、最新在下」，所以旧轮**绝不能**带 .ai-card——否则冒烟取到的是最旧那轮。
   新消息追加走全量重建（aiRender），类名在构建期就定好，没有「原地降级」这一步（监听器与 _txt 都拔不掉）。 */
/* padding 四边 13.7：原为 `0 13.7px 13.7px`（顶边交给 .ra-sec 抬头那块），抬头删除后自己补回来（ADR-0044）。 */
.ra-card{background:linear-gradient(90deg,rgba(237,238,255,.6),rgba(237,238,255,.4));border-radius:16.5px;
  padding:13.7px;position:relative;overflow:hidden;transition:box-shadow .15s,transform .15s}
.ai-card{cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.ai-card.lp{transform:scale(.985);box-shadow:0 0 0 1.5px #7c8cff} /* 长按进行中：给到"松手就发"的预反馈 */
.ai-foot{display:flex;align-items:center;gap:5px;font-size:12.1px;color:#6a91e4;padding-top:11px}
.ai-chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--on-surface-variant);padding:14px 0 18px;cursor:pointer}
.ai-chk input{width:18px;height:18px;accent-color:var(--primary);flex:none}
/* 实时辅助（聊天辅助）浮层的**时间线**：每条客户消息一轮（.ra-round），轮内自上而下是
   客户原话 → 命中素材 → AI 话术卡。旧的往上堆、最新一轮在最后（可滚回去看）。
   2026-10-14（ADR-0044）：原「客户在问」标签与「AI 建议／AI 推荐话术」抬头两行删除，轮内只剩
   客户原话、命中素材（没命中就整段不输出）、话术卡三块。 */
.ra-round{margin-bottom:14px}
/* 群聊暂停提示条：AI 侧的事，跟着面板的新蓝紫走（原 tertiary 的藕紫在新稿蓝底上会打架） */
.ra-notice{display:flex;align-items:center;gap:7px;font-size:11.5px;line-height:1.5;color:#4a5fd0;background:#e8ecff;border-radius:8px;padding:9px 11px;margin-bottom:10px}
/* 客户原话段：问题直接落在浮层底上，没有包围盒。
   2026-10-14（ADR-0044）按用户要求删掉顶上那颗「客户在问」胶囊——问题本身就是上下文，不必再贴一枚标签。
   同日再改（ADR-0046）：那一行剩下的「换一组」也从「问题上方单独一行、右对齐」**挪进问题行内部**，
   见 .ra-q / .ra-swap。原先的排法在时间线上会被读成**上一轮卡片的右下角**（上一轮的卡结束、隔 14px
   就是这一行），用户原话：「换一组从右下角挪到每一个问题模块的右上角」。.ra-ctx-h 随之删除。 */
.ra-ctx{background:none;border-radius:0;padding:0;margin-bottom:11px}
/* 「换一组」：新稿是**渐变文字 ＋ 渐变描边图标**（#1677ff→#9452ff），没有胶囊底。
   -webkit-text-fill-color 只作用于文字字形，所以 svg 的 currentColor 仍是兜底的 #1677ff；
   图标再被下面这条 stroke 规则换成同一支渐变（#aiSwapGrad 在文档顶部的 defs 里）。
   position:relative + overflow:hidden 是 ripple（RIP_SEL 收了 .ra-swap）的硬前提，别删。
   2026-10-14（ADR-0046）**右浮动**在 .ra-q 的首行右上角：它只占首行那一格，问句从第二行起照旧顶格
   排满整宽（用 flex 行的话每一行都会被让掉 47px，长问句会整段缩进）。
   **每一轮都挂一枚**（占位轮除外）——点它换的是**那一轮**的措辞，见 aiRender 与 raSwap。 */
.ra-swap{float:right;margin:-2px 0 2px 8px;display:inline-flex;align-items:center;gap:4px;font-size:12.1px;font-weight:500;color:#1677ff;
  background:linear-gradient(90deg,#1677ff,#9452ff);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;border:none;border-radius:999px;padding:3px 6px;cursor:pointer;font-family:inherit;position:relative;overflow:hidden}
.ra-swap svg{stroke:url(#aiSwapGrad)}
/* overflow:hidden 只为一件事：把上面那枚右浮动的「换一组」**兜在问句块里**（浮动不占流，块子不建 BFC
   就收不住它，短问句时按钮会探到下面的命中素材行里去）。问句本身不裁任何东西。 */
.ra-q{font-size:14.8px;line-height:1.33;color:#102953;font-weight:500;overflow:hidden}
/* 回答模块的抬头（.ra-sec，写「AI 建议」／「AI 推荐话术」／占位轮「AI 参考话术」）2026-10-14 按用户要求
   整个删除（ADR-0044）。它原是 .ra-card 的**上半截**：两块同款水平渐变（左 .6 → 右 .4）、接缝处逐点同色，
   靠下面这条拼接规则拼成新稿那一整块——
     .ra-sec{border-radius:16.5px 16.5px 0 0; …}
     .ra-sec + .ra-card{border-radius:0 0 16.5px 16.5px;padding-top:0}
   抬头没了，卡就得自己是一个完整卡片：.ra-card 的 padding 由 `0 13.7px 13.7px` 补回四边 13.7px
   （见 .ra-card 那条），拼接规则随 .ra-sec 一起删掉。别只删 .ra-sec 留着那条拼接——卡会秃顶。 */
.ra-lead{font-size:13.7px;line-height:1.45;color:#174084;margin-bottom:7px}
.ra-pts{margin:0 0 7px;padding-left:18px;font-size:13.7px;line-height:1.45;color:#174084}
.ra-pts li{margin-bottom:4px}
.ra-tail{font-size:13.7px;line-height:1.45;color:#174084}
/* 「AI 正在生成」：话术流式生成前的思考停顿（见 raStreamPlay）。三点跳动**有意复用** .typing 的 @keyframes tp（L477），
   不新造第二套——微信「对方正在输入」与这里表达的是同一件事。色用 tertiary（= AI 侧身份色）而非微信灰。 */
.ra-gen{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--on-surface-variant);padding:2px 0 4px}
.ra-gen i{width:6px;height:6px;border-radius:50%;background:#6b8cff;animation:tp 1s infinite}
.ra-gen i:nth-child(2){animation-delay:.16s}.ra-gen i:nth-child(3){animation-delay:.32s}
@media (prefers-reduced-motion:reduce){ .ra-gen i{animation:none} }
/* 「命中素材」段：素材库的关键词命中落进实时辅助浮层（段落在客户原话与 AI 话术卡之间）。
   2026-10-14（ADR-0044）：**没命中就整段不出现**——素材库的徽章、条数、说明一律不画（原 .ra-hit-empty
   那行说明已随 raHitsEmpty() 一起删除），直接接话术卡。这一段只在真有命中时才有存在的理由。
   身份色用 primary——这段是**素材库**的能力，与 AI 话术卡一眼分开。
   行＋原地摊开的观感与素材面板 .p-card/.pexp 同构，但类名独立（ra-hit-*）：pRowTap 的滚动定位是
   document.querySelector('.pexp') 全局查询，共用类名会把两个面板的展开态串起来。
   有意复用的只有全产品同一套按钮 .psend/.rp-btn 与 wxSendSim 产出的 .wx-sim。
   ===== 别在这条注释里再手滑提前收尾（2026-10-14，ADR-0046）=====
   上面那几行中文原先落在注释**外面**（注释的收尾符被提前写在了第三行末尾），成了 CSS 里的裸文本。
   解析器把这段裸文本连同紧跟其后的 `.ra-hit-sec{…}` 一整个当成**非法选择器**吃掉，于是这条规则
   从未生效：「命中素材」那几字丢了 color/font-size，掉回从祖先继承来的 16px 与近白色（--sc），
   屏幕上就是「字变大、还变白了」（用户报的第 2 条）。教训是**只看元素在不在的断言抓不到死规则**——
   冒烟当时查的是 `.ra-hit-sec` 存不存在，全绿；现已补一条量计算样式的（tools/smoke.js）。
   写 CSS 注释时：收尾符只出现一次、且只在该出现的行尾；正文里要提到它就拆开写，别连成一个词。 */
.ra-hit-sec{display:flex;align-items:center;gap:6px;padding:2px 2px 7px;font-size:11px;font-weight:500;color:var(--primary)}
.ra-hit-badge{font-size:9.5px;font-weight:600;color:var(--on-primary-container);background:var(--primary-container);border-radius:999px;padding:2px 7px;flex:none}
.ra-hit-badge.new{background:var(--primary);color:#fff}
.ra-hit-n{font-weight:400;color:var(--on-surface-variant)}
.ra-hit-row{display:flex;align-items:center;gap:11px;background:var(--sc);border-radius:var(--shape-m);padding:11px 13px;margin-bottom:9px;position:relative;overflow:hidden;cursor:pointer}
.ra-hit-row .rah-b{flex:1;min-width:0}
.ra-hit-row .rah-b h5{font-size:16px;font-weight:500;color:var(--on-surface);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ra-hit-row .rah-b p{font-size:10.5px;color:var(--on-surface-variant);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ra-hit-src{color:var(--primary)}
/* 行内「命中「×××」」那半句：只在 #hpPanel（未开启聊天辅助时自动弹出的素材浮层，ADR-0061）里出现。
   AI 浮层的时间线**不挂它**——那条线的分区头已经说了"这句客户原话命中了素材"，逐行再点一次词是重复。
   浮层那份是**扁平一张清单**，没有分区头可依，行内不点名就没有任何东西能说明"它为什么在这儿"。 */
.rah-kw{color:var(--primary);font-weight:500}
.rah-q{flex:none;display:flex;align-items:center;gap:6px}
.rah-chev{flex:none;display:flex;color:var(--on-surface-variant);transition:transform .15s}
.ra-hit-exp{background:var(--sc-high);border-radius:var(--shape-m);margin:-5px 0 9px;padding:11px 13px;animation:fade .15s}
.ra-hit-exp .ra-hit-acts{display:flex;gap:8px;flex-wrap:wrap}
@keyframes raHitIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ra-hit-row.fresh{animation:raHitIn .34s var(--emph);box-shadow:0 0 0 1.5px var(--primary)}

/* 顶部命中横幅（#hpTip · 2026-10-15 新增，ADR-0061）：**未开启聊天辅助**时，客户消息命中素材关键词，
   先在屏顶弹这条通知；**点它才展开 #hpPanel**。
   为什么中间要加这一跳：命中是引擎自己发现的，而用户此刻正在打字——直接把浮层推上来，会连输入框
   和刚敲的半句话一起盖掉；横幅只占屏顶一条，说清"发现了什么、点一下看"，看不看由他。
   它不是 .panel 那一族：不可拖、不参与「后开者胜」（ADR-0028 决策 3）、不进 overlayRoot——它是**通知**，
   不是面板。z-index 74 压在状态栏（55）、悬浮球（70）、#panel／#aiPanel（72）、两选一菜单（73）之上，
   **那 3 秒里它就是屏上最上面的一件**（参考截图里这条通知确实盖住了状态栏那一条），仍在 overlayRoot（80）之下。
   头像用的是**悬浮球本人**：同一枚主色圆＋同一支 ball 字形——弹它的和留在屏上的本来就是同一个助手，
   这是"球 → 横幅 → 浮层"三段能读成一条线的关键。红点只说"有新的"，**条数交给面板标题**，
   横幅上再报一次数，两处就会对不上。
   位置取左右各 8px（比浮层的 14px 更贴边）：通知是贴着屏边的一条，与内容区不同层。 */
.hp-tip{position:absolute;left:8px;top:8px;width:396px;z-index:74;display:none;flex-direction:column;
  align-items:center;cursor:pointer;user-select:none;touch-action:manipulation}
.hp-tip.show{display:flex;animation:tipIn .28s var(--emph)}
@keyframes tipIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.hp-tip-card{width:100%;height:64px;box-sizing:border-box;padding:0 13px;position:relative;overflow:hidden;
  display:flex;align-items:center;gap:11px;background:var(--sc-lowest);border-radius:14px;box-shadow:var(--e3)}
.hp-tip-av{flex:none;width:32px;height:32px;border-radius:50%;background:var(--primary);color:var(--on-primary);
  display:flex;align-items:center;justify-content:center;position:relative}
.hp-tip-av i{position:absolute;top:-1px;right:-1px;width:9px;height:9px;border-radius:50%;background:var(--error);
  box-shadow:0 0 0 2px var(--sc-lowest)}
.hp-tip-b{flex:1;min-width:0}
.hp-tip-b b{display:block;font-size:13.5px;font-weight:500;color:var(--on-surface);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 子选择器 `>` 不能省：`.hp-tip-b span` 会连第 1 行里那枚 `.hp-tip-kw` 一起选中，
   把它也变成 block 11.5px 的灰副行——关键词就自己掉到第二行去了（真踩过）。 */
.hp-tip-b>span{display:block;font-size:11.5px;color:var(--on-surface-variant);margin-top:3px}
.hp-tip-kw{color:var(--primary)}
/* 倒计时：3S→2S→1S。tabular-nums 是必需的——逐秒跳字时比例数字会让整块左右抖 */
.hp-tip-t{flex:none;font-size:15px;font-weight:500;color:var(--on-surface-variant);font-variant-numeric:tabular-nums}
/* 卡下那枚朝上的折角＝「下面还能展开」，也是照着参考截图里那枚画的。它与卡同属一个点区
   （整条都点得开），是装饰不是第二个按钮。
   **负外边距是必须的、不是随手调的**：参考截图里卡下面是一片浅色（聊天背景），折角落在那儿正好；
   本壳同样位置上压着的是那条深色的关键词坞（.wx-dock，就在页头下面、紧挨着卡底），照原样摆会变成
   一块糊在深色条上的浅色污渍。压到卡自己的下沿（-9px，半个折角悬在卡外）后，读法反而更准：
   它不是"外面还有东西"，而是**这张卡自己的把手**——点了就往下一层摊开。 */
.hp-tip-chev{flex:none;margin-top:-9px;color:#B6C3DA;position:relative}

/* 悬浮素材面板（球 = 折叠态 · M3 浮层） */
.panel{position:absolute;width:330px;height:46%;background:var(--sc-low);border-radius:var(--shape-xl);
  box-shadow:var(--e3);display:flex;flex-direction:column;animation:popCard .3s var(--emph);z-index:72;overflow:hidden}
.panel-head{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px 8px;background:var(--sc-low);border-bottom:1px solid var(--outline-variant);cursor:grab;touch-action:none;user-select:none}
/* 面板搜索条：常态不占行（收进头部一枚 icon），点开才摊在头部下方——面板列表因此常态多一行 */
.panel-search{flex:none;display:flex;align-items:center;gap:8px;background:var(--sc-high);border-radius:999px;height:44px;padding:0 16px;color:var(--on-surface-variant);font-size:13px;animation:fade .15s}
.panel-search .iconbtn{width:32px;height:32px;margin-left:-8px}
.psic{flex:none;display:flex;align-items:center}
.panel-list{flex:1;overflow-y:auto;padding:10px 16px 14px;scrollbar-width:none}
.panel-list::-webkit-scrollbar{display:none}

/* ===== 素材库面板形态重做（ADR-0075）· 按 Figma 节点 1079:373「悬浮窗」复刻 =====
   换算与全壳同一条：稿 750 画布 × k = 412/750 = 0.54933（.phone-inner 恒 412 布局像素宽）。
   面板 714×840 → 392.2×461.4；稿上它贴在屏底（下缘距屏底 38 → 20.9）：916 − 461.4 − 20.9 = 433.7，取 434。
   圆角量出来 ≈46 → 25.3（不是 M3 的哪一档，故不套 --shape-*，直接写换算值）。
   底色换成稿上那块近白蓝 #EDEFFF——.panel 基类那层 --sc-low 是另外两个浮层在用的，这里按稿覆盖。
   **只加 id 特异性覆盖，一个字节都不动 .panel 基类**：基类是三块浮层共用的一副壳，理由同 #aiPanel 那条（ADR-0042）。
   头部一条（稿 93 → 51.1）：一排一级视图（全部／企业／部门／个人／朋友圈／最近使用，与素材库首页**同一套、同一顺序**）
   ＋ 右端三枚常驻 icon，**面板里没有标题行**（ADR-0075 ①）。
   头部内衬按稿：左 13.2（稿 24）、右 9.3（稿 17）；上 4 是为把那 40 高的一级视图摆到稿上那个位置
   （稿：字块 top 34、指示条 top 74 —— 4 + (51.1−4−40)/2 = 7.5 起，字与条都落在稿上 ±0.5px 内）。
   icon 三枚之间不留 gap：稿上三枚的间距是 61（圆心距 33.5），而本壳的钮是 32 的触摸靶、不是稿上那个 32 的 glyph 框，
   留 gap 就把整排挤出面板。三枚贴排 = 96，圆心距 32，与稿上 33.5 基本同拍。
   于是 .pnav 的可用宽 = 392.2 − 13.2 − 9.3 − 96 − 8（留给筛选 icon 的呼吸位）= 265.7；
   六枚字自带 214.5 ＋ 5×8 间距 = 254.5 —— 排得下，还余 11 的安全量。
   **稿上这一排其实是排不下的**：六枚文字排到 x 574（522–626）、右端筛选 icon 从 561 起，文字与 icon 直接相撞
   （ADR-0075 待产品拍 ①：稿子截图里「最」后面就是漏斗）。本壳按「六枚横排」落、间距收到 8（不砍项、不换行），
   并给 .pnav 兜一条 overflow-x:auto：字宽真多出来（换字体／换语言）时整排横滑，不压 icon；pNavPaint 会把当前那枚滚进可视区。
   （这条只作兜底，滑法是滚轮／触控板：**触屏上这一排滑不动是有意的**——头部整条（含这一排 tab）是拖拽把手，
   按住不撒手就是拖面板，见 .pnav 那条与 panelDrag 里的手势补记。）
   产品若给一版不撞的间距、或点名砍哪一枚，改的就是这一段。 */
#panel{left:9.9px;top:434px;width:392.2px;height:461.4px;border-radius:25.3px;background:#EDEFFF}
#panel .panel-head{height:51.1px;padding:4px 9.3px 0 13.2px;gap:0;background:none;border-bottom:none}
/* 一级视图排（ADR-0075 ①②）：头部第一件、吃掉所有剩余宽度、六枚一级视图横排。
   六枚＝全部／企业／部门／个人／朋友圈／最近使用，与素材库首页**同一套、同一顺序**；
   改前它是「叠在来源之上的一行 chips（最近使用／朋友圈）」——那两枚升成一级视图里的两项，那行整行退休：
   它俩本来就是互斥单选语义，摊成一级视图比叠成 chip 更直白（面板这排不叠：库首页那枚「朋友圈」是能与最近使用叠着亮的
   能力交集，面板这排里它俩是并列的两个视图，故面板里点「朋友圈」＝离开「最近使用」）。 */
/* touch-action:none 必须显式写在 .pnav 这一层，不能只靠 .panel-head 那条：
   触屏手势归谁，是按「按下那个元素 → 往上直到最近的可滚动祖先」这条链上的值取交集算的，
   而 .pnav 自己就是那个滚动容器（overflow-x:auto）——链到它为止，祖先那条 touch-action:none 够不着。
   少了这一句，横着拖这一排会被引擎判成「滚这一排」并顺手 pointercancel 掉拖拽，
   于是「抓着 tab 那一行按住不撒手」拖不动面板（正是最想拖的那一处：那是头部最大的可抓面）。
   写死在最里面这层，任何引擎都只剩一条路：拖面板。 */
.pnav{flex:1;min-width:0;margin-right:8px;display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;touch-action:none}
.pnav::-webkit-scrollbar{display:none}
/* 面板里的一级视图＝库首页 .lib-tab 的同一件（选中态同一套：主色文字 ＋ 底下一条渐变指示条，ADR-0075 ⑤），
   只是按稿瘦下来：稿 26 → 14.3px、字重 Regular／选中 Medium（库首页那排是 16px／SemiBold），
   两色仍取库首页那两支 #526E9C／#102953。指示条稿 25×5 → 13.7×2.8、居中、离钮底 4.1（＝库首页那条的同款画法）。 */
#panel .lib-tab{height:40px;font-size:14.3px;font-weight:400;color:#526E9C;min-width:0;padding:0;letter-spacing:0}
#panel .lib-tab.on{color:#102953;font-weight:500}
#panel .lib-tab.on::after{left:50%;right:auto;width:13.7px;height:2.8px;border-radius:2px;bottom:4.1px;transform:translateX(-50%);
  background:linear-gradient(90deg,#1650FF,#9452FF)}
/* 列表内衬：卡左右各距面板 22 → 12.1；上内衬 0——「面板顶到第一张卡顶」那 51.1（稿 93）已经由头部高度占满 */
#panel .panel-list{padding:0 12.1px 14px}

/* ===== 「实时辅助」浮层外壳 · 按 Figma 节点 831:5114「模块」（700×746 @750 画布）1:1 复刻 =====
   全部尺寸＝设计稿像素 × k，k = 412/750 = 0.54933（.phone-inner 恒 412 布局像素宽）。
   #aiPanel 用 id 特异性压过 .panel 基类（.panel 与素材库 #panel 共用，此处**不得**改动 .panel 本身）：
   面板 384.5×409.8 / 头部 40 / 内容卡 355.0 / 下距 14.8 —— 四者相加正好 409.8，落差为零。
   （2026-10-14 头部两修：先由 65.4 瘦到 19.8 见 ADR-0044，再因「太窄了特别丑」回到 40 见 ADR-0046。）
   底色不是蓝色渐变，是设计稿那层近白的 EEEFFF→F0F1FF，外沿一圈 2px 白 60% 描边（用 inset 阴影画，
   不占盒模型——用 border 的话内容区会被吃掉 4px，高度账就对不上了）。设计稿没有投影，故压掉 --e3。
   ===== 2026-10-15（ADR-0061）：这层外壳现在**挂两个浮层**——#aiPanel（聊天辅助开着）与
   #hpPanel（未开启聊天辅助、关键词命中时自动弹出的素材浮层）。二者共用同一副壳子：下面每条 id 规则
   都写成 `#aiPanel,#hpPanel`，尺寸/配色/头部/内容卡/药丸**只有一份**，谁都不许另起一套。
   两个 id 仍然是**并列**的（不是 `#aiPanel .panel-head{…} #hpPanel .panel-head{…}` 抄两遍），
   改壳子时一处生效两处同改——这正是"面板沿用聊天辅助面板的设计"的字面实现。
   类名 .ai-sub/.ai-content/.ai-drag/.ai-close **不为第二个面板改名**：它们是这副壳子的零件，
   不是"实时辅助"的专属（改名会连带 smoke 里那一串断言与 panelDrag 的 .ai-panel 判据一起动）。
   #hpPanel 靠 .ai-panel 这个**已有**类落进 panelDrag 的 412 空间分支，故两个面板的拖拽夹取口径本来就一致。 */
#aiPanel,#hpPanel{left:14px;top:47px;width:384.5px;height:409.8px;border-radius:16.5px;
  background:linear-gradient(90deg,#EEEFFF,#F0F1FF);border:none;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
/* 头部：透明、只剩拖拽职责（cursor:grab/touch-action:none 由 .panel-head 基类带过来）。
   2026-10-14 按用户要求瘦身（ADR-0044）：头像／主标题「实时辅助」／「重置为本会话」三件删除，只剩副标题一件。
   同日再修（ADR-0046）：瘦到 **19.8＝副标题自身行高**那一版**贴得太死**——字紧着面板的顶边与左上圆角走，
   用户看下来是「挤压得太窄了特别丑」。现给回 **40**：副标题在头里垂直居中（上 10.1 ＋ 行高 19.8 ＋ 下 10.1），
   仍占头部左上、靠左不居中；头部也不再另添任何装饰。高度账相应重算：
   **头部 40 ＋ 内容卡 355.0 ＋ 下距 14.8 ＝ 409.8**，外框不变、落差仍为零（省下的 20.2 由 .ai-content 的 flex:1 让出）。
   40 同时是这块拖拽把手（panelDrag）的触摸高度——比原来的 19.8 好按。 */
#aiPanel .panel-head,#hpPanel .panel-head{position:relative;height:40px;padding:0;gap:0;background:none;border-bottom:none}
/* 副标题 + 绿点：头部如今只剩它一件，故落在左上角（left 取原头像的 14.8；原先跟在头像与标题右侧，
   是 73.1／39.6）。top:10.1 ＝ (40 − 19.8)/2，即在头里垂直居中（ADR-0046 由 top:0 改来）。
   点与字仍在一行里 flex 对齐，比分别绝对定位稳。
   2026-10-15（ADR-0061）起这条**只有 #aiPanel 在用**：#hpPanel 的头部改挂 .ra-hit-sec（见下一条）。 */
.ai-sub{position:absolute;left:14.8px;top:10.1px;height:19.8px;display:flex;align-items:center;gap:3.8px;
  font-size:14.3px;line-height:1;color:#587ad9}
.ai-sub i{width:4.4px;height:4.4px;border-radius:50%;background:#00D991;flex:none}
/* #hpPanel 的头部**不用 .ai-sub**：它的标题就是把正文里那张分区头（.ra-hit-sec＝「素材库」徽章 ＋「命中素材 · N 条」）
   整块搬上来占同一格（left/top 与 .ai-sub 逐字相同）。用户的原话是"把素材库标签 命中素材 n 条替换到面板的标题上"，
   并且明确不要「未开启聊天辅助 · 正在按关键词推素材」那句——理由也顺：**这个浮层只有一种来源**（命中才弹），
   再写一句"为什么在这儿"是把已经由横幅说过的话说第二遍；而"命中了几条"是要紧的，它得在标题上，第一眼就看得见。
   复用 .ra-hit-sec 而不另写一套：它在时间线里是"这一轮命中了什么"，在这里是"这份清单有几条"，
   两处都是**素材库给出的命中**这一个东西，配色（primary）与徽章样式就该是同一个。
   ⚠ **选择器指名落到 #hpTitle 的子元素上**，不写 `#hpPanel .ra-hit-sec`（2026-10-15 加固，ADR-0061 决策 6）。
   宽泛那条的坏法：raHitsHead() 吐出来的就是整个 `<div class="ra-hit-sec">`，它落在 #hpTitle 里面；
   壳**若也带同一个类**，两层就都被这条规则绝对定位——外壳的在流子节点归零、宽度算成 0px，
   里子再按 0 宽去 shrink-to-fit，中文 min-content＝一个字，标题就一个字一行竖排下来
   （2026-10-15 真实出现过：截图与探针都量到外壳 0px）。写成 `#hpTitle>.ra-hit-sec` 之后，
   壳带不带这个类都进不了这条规则，那个坏法在结构上不再存在——壳上有没有这个类从此只是冗余，
   不是正确性的一部分（tools/smoke.js 第 5e 组有一条照这个口径的反向断言：强行把类加回外壳，
   标题仍必须是一行、宽度仍须 > 60px）。 */
#hpPanel #hpTitle>.ra-hit-sec{position:absolute;left:14.8px;top:10.1px;height:19.8px;padding:0}
/* 关闭：贴着面板右上角的角块，白 50%。左上/右下取直、右上/左下取 16.5 圆角——
   右上那 16.5 是**跟着面板自身的圆角走**的（设计稿路径：M0 0 L28 0 C…58 30 V36 H30 C…0 6 Z）。
   ✕ 用设计稿原路径（#AAC1E5 实心），不复用 .iconbtn：它是 48px 圆形，压不住这个角块形状。
   高度＝头部高（ADR-0046 由 19.8 随头部一起改到 40）：块子只跟头部齐高才吃得住面板那个 16.5 圆角
   ——只把高度留在 19.8、往下挪 10 的话，块子自己的右上圆角会伸到面板圆角之外被 .panel 裁掉。
   ✕ 由 flex 居中，落点恰在头部中线上，与左边那行副标题同一水平线。 */
.ai-close{position:absolute;right:0;top:0;width:31.9px;height:40px;border-radius:0 16.5px 0 16.5px;
  background:rgba(255,255,255,.5);border:none;cursor:pointer;padding:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.ai-close svg{display:block}
/* 内容白卡：设计稿是白 90% + 0 2px 15px 的浅蓝投影。必须是 flex 列且 min-height:0，
   否则里面 #aiBody 的 flex:1 撑不出高度、列表不滚；position:relative + overflow:hidden 是
   滚动指示层（SB_RULES 的 .panel-list 那条）的宿主条件——sbMount 取的是 el.parentElement，
   所以这一层代替了原来 .panel 当宿主的角色。 */
.ai-content{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column;
  margin:0 11px 14.8px;border-radius:13.2px;background:rgba(255,255,255,.9);
  box-shadow:0 2px 15px rgba(217,229,255,.5)}
/* 列表内衬改 13.7（= 设计稿回答模块距内容卡左边那 25px 的换算值）。只改内衬——
   flex:1 / overflow-y:auto / 隐藏滚动条 一条都不能动。 */
#aiPanel .panel-list,#hpPanel .panel-list{padding:13.7px}
/* 底部拖拽药丸：纯装饰，不吃指针事件（压在内容卡下沿之上） */
.ai-drag{position:absolute;left:50%;bottom:5.5px;transform:translateX(-50%);width:30.8px;height:2.8px;
  border-radius:20px;background:#cbd4e7;pointer-events:none}

/* ===== 素材库面板的卡（ADR-0075 ④）：标题（渐变色字）＋一行摘要＋行尾两枚取用钮、右上角一枚来源角标 =====
   稿 670×134、行距 146 → 368×73.6、行距 80.2（卡间距 6.6）；白卡 90% 底、圆角 26 → 14.3、
   阴影 0 2px 15px rgba(217,229,255,.5)；标题 30 → 16.5（PingFang Medium；字色是**渐变**，
   稿上由右向左 #102953→#245bb9，故取 background-clip:text 那套写法），摘要 24 → 13.2（#6387C0）；
   卡内衬 左 17.03／上 14.83／下 12.08，摘要距标题 7.1。高 73.6 = 14.83＋19.8＋7.1＋19.8＋12.08，
   与稿逐项对上。**退休的是 `.p-row` 那一族（旧行形态）**——`.psend` 另有三处真身（命中浮层、托管清单），
   留在下面不动；本卡那两枚钮是新件 .pc-btn，不复用 .psend/.rp-btn：稿上是圆底无描边（#F0F4FF）
   另一种观感，硬套 .rp-btn 会把旧观感带回来。 */
.p-card{display:flex;align-items:center;gap:18.1px;background:rgba(255,255,255,.9);border-radius:14.3px;
  padding:14.83px 15.9px 12.08px 17.03px;margin-bottom:6.6px;position:relative;overflow:hidden;cursor:pointer;
  box-shadow:0 2px 15px rgba(217,229,255,.5)}
.p-card .pc-b{flex:1;min-width:0}
.p-card .pc-b h5{font-size:16.5px;font-weight:500;line-height:19.8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:linear-gradient(to left,#102953,#245bb9);-webkit-background-clip:text;background-clip:text;color:transparent}
/* 摘要一行（13.2/19.8）：卡高是量出来的 14.83＋19.8＋7.1＋19.8＋12.08 = 73.6，与稿同。
   这一行不再挂组成条（ADR-0075 追补：稿上就是纯文字一行），行盒恒 19.8，一行行卡严丝合缝 */
.p-card .pc-b p{font-size:13.2px;line-height:19.8px;color:#6387C0;margin-top:7.1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 行尾两枚取用钮：转发／发圈（蓝）＋ 复制（紫）——稿上两枚字形就是这两支色 */
.pc-acts{flex:none;display:flex;align-items:center;gap:16.5px}
.pc-btn{width:26.4px;height:26.4px;flex:none;border:none;border-radius:50%;background:#F0F4FF;color:#1650FF;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.pc-btn.pur{color:#9452FF}
/* 卡上的来源角标：直接复用全站那枚 .lc-src（它注释里写着"下一个『这东西从哪来』的问题直接调它"）。
   只把贴角那侧的圆角按本卡的 14.3 重写——.lc-src 自带的是 11（库首页素材卡的半径），
   比本卡小 3px 会在角上露出一道白边（宿主 overflow:hidden 只裁外缘，裁不掉小圆角内侧） */
#panel .p-card .lc-src{border-radius:0 14.3px 1px 8px}
/* 企业素材行尾发送快取：主色圆底icon，居复制内侧（复制守右缘）——命中浮层与托管清单在用，非面板件 */
.psend{width:28px;height:28px;border:none;border-radius:50%;background:var(--primary-container);color:var(--on-primary-container);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
/* 面板分区标题（命中推荐 / 最近使用 / 各页计数头） */
.p-sec{display:flex;align-items:center;gap:5px;padding:6px 2px 6px;font-size:11px;font-weight:500;color:var(--on-surface-variant)}
/* ===== 面板内命中呈现（ADR-0078）=====
   命中在面板里不再走横幅／不再把面板顶掉：
   · 「命中推荐」区段**常驻列表最顶部**（pRowsDraw），整块包一层 #pHitSec 供脉冲；
   · 区段**看不见**时（滚走了 / 正在搜索）才在头部下方出一条粘性提示 #pHitBar
     「找到 N 条相关素材 · 查看」——点它＝退出搜索、回顶部、脉冲区段；
     不自动滚、不自动切视图：用户手上正在做的事不被打断；
   · 头部角标＝当前那枚一级视图右上角一枚主色小圆点（有未看的新命中时亮）。
   可见性判据只看「搜索态 + #pRows.scrollTop」，不看 rect：jsdom 无布局，几何断言会假绿。 */
.p-hitsec{border-radius:14px}
/* 区段右上角的「主动收起」口（ADR-0080）：取用任一命中或关面板也会收，这枚是给"我现在不想看"的一条明路 */
.p-hitx{flex:none;margin-left:auto;width:20px;height:20px;border:0;padding:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:transparent;color:var(--on-surface-variant);cursor:pointer}
.p-hitx:active{background:rgba(0,0,0,.06)}
/* 「最近 N 条消息」：这一批合并了几条原话（ADR-0081）。只在 >1 时出现，不抢「命中推荐」的读点 */
.p-hitfrom{font-size:10px;font-weight:400;color:var(--on-surface-variant);margin-left:4px}
.p-hitsec.fresh{animation:hitPulse 1.5s var(--emph)}
@keyframes hitPulse{0%{background:rgba(22,80,255,.12);box-shadow:0 0 0 1.5px rgba(22,80,255,.5)}
  70%{background:rgba(22,80,255,.05);box-shadow:0 0 0 1.5px rgba(22,80,255,.18)}
  100%{background:transparent;box-shadow:0 0 0 1.5px rgba(22,80,255,0)}}
.p-hitbar{flex:none;display:flex;align-items:center;gap:6px;margin:0 12.1px 8px;padding:9px 12px;border-radius:999px;
  background:var(--primary-container);color:var(--on-primary-container);font-size:12px;cursor:pointer;
  animation:fade .15s var(--emph)}
.p-hitbar .hic{flex:none;display:flex}
.p-hitbar .ht{flex:1;min-width:0;font-weight:500}
.p-hitbar .hgo{flex:none;font-weight:600;color:var(--primary)}
#panel .lib-tab{position:relative}
.p-navdot{position:absolute;top:3px;right:-3px;width:6px;height:6px;border-radius:50%;background:var(--primary);
  box-shadow:0 0 0 2px #EDEFFF;pointer-events:none}
/* 面板真搜索 + 筛选 popover 里的分组 chips（M3 filter chip：32dp、选中 secondary-container＋check；与库首页 chip 同款语义） */
.panel-search input{flex:1;min-width:0;background:none;border:none;outline:none;font-size:13px;color:var(--on-surface);font-family:var(--f)}
.panel-search input::placeholder{color:var(--on-surface-variant)}
.pclr{flex:none;display:flex;align-items:center;justify-content:center;width:26px;height:26px;border:none;background:none;color:var(--outline);cursor:pointer}
.pchip{flex:none;height:32px;padding:0 12px;border-radius:var(--shape-s);border:1px solid var(--outline);background:transparent;
  color:var(--on-surface-variant);font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:5px;cursor:pointer;position:relative;overflow:hidden}
.pchip.on{background:var(--secondary-container);border-color:transparent;color:var(--on-secondary-container)}
/* 筛选 icon（头部，钉在搜索 icon 左边）：**现在只剩分组一段**（ADR-0075 ③）——来源已搬进头部那排一级视图，
   故本钮是"分组"的唯一入口，仍常驻（只在搜索态收起）。尺寸/圆底与头部另两枚 icon 一致（32dp）
   有筛选（分组≠全部）时点亮＋圆点；popover 开着时 icon 高亮 */
.pflt{flex:none;width:32px;height:32px;border-radius:50%;border:none;background:transparent;color:var(--on-surface-variant);
  display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.pflt.on{color:var(--primary)}
.pflt.on::after{content:'';position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--primary)}
.pflt.open{color:var(--primary)}
/* 筛选 popover：锚在筛选 icon（头部）正下方——顶部落 6px＝紧贴头部下缘、盖住第一张卡（那处此刻正被 mask 冻住），
   不遮微信会话（全屏底弹层违反悬浮窗无遮罩原则，已弃）；
   **只剩分组一段**（ADR-0075 ③；改前是「来源 / 分组」两段，来源搬去头部了），
   max-height 兜住分组极多的情形，超出在 popover 内滚动。
   pfmask=面板内透明点击捕获，点面板任意处收起（不生成全屏遮罩）。搜索条展开时筛选钮收起，两者不会同框 */
#panelBody{position:relative}
.pfmask{position:absolute;inset:0;z-index:6}
/* 筛选 popover 的外壳与两段内容（悬浮面板筛选 icon 的 .pfpop）：与库首页筛选行下拉同一套观感（ADR-0017）。
   .popcard 只放两家相同的视觉（底/圆角/阴影/内边距/淡入/内滚） */
.popcard{background:var(--sc-low);border-radius:var(--shape-l);box-shadow:var(--e3);padding:10px 12px 12px;animation:fade .15s;overflow-y:auto;scrollbar-width:none}
.popcard::-webkit-scrollbar{display:none}
.pfpop{position:absolute;left:10px;right:10px;top:6px;z-index:7;max-height:calc(100% - 16px)}
.pfp-sec{font-size:11px;font-weight:500;color:var(--on-surface-variant);padding:2px 0 8px}
.pfp-chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 4px}
/* 「全部」档分组轴收起时的口径说明（同库首页侧栏 .gri-note 口径）：说明为什么不给分组，而不是留一个空段 */
.pfp-note{display:flex;gap:6px;align-items:flex-start;font-size:11px;line-height:1.6;color:var(--on-surface-variant);padding:2px 0 4px}
.pfp-note svg{flex:none;margin-top:2px;color:var(--outline)}
/* 悬浮窗点开＝行在原地摊开（手风琴一次一条）：预览=微信发送模拟＋就地取用，全程无底弹层、不遮微信会话 */
.pexp{background:var(--sc-high);border-radius:14.3px;margin:-2px 0 6.6px;padding:12px 14px;animation:fade .15s}
.pexp-t{font-size:12.5px;line-height:1.7;color:var(--on-surface);padding-bottom:8px;word-break:break-word} /* 独立类（不挂 .pexp 下）：悬浮窗展开区朋友圈文案用——全局壳为深色底近白字，脱离显式配色会白字不可见 */
/* 分组段末尾的动作 chip（个人档「＋ 新建分组」「管理分组」，ADR-0017）：文字主色、无描边——
   既不是「未选中的筛选 chip」（描边）、也不是「选中的」（填充＋check），三种形态互不同形，不会被当成一个可选项 */
.pfp-acts{display:flex;flex-wrap:wrap;gap:2px;margin-top:8px;padding-top:6px;border-top:1px solid var(--outline-variant)}
.pchip.act{color:var(--primary);border-color:transparent;padding:0 8px 0 4px}
/* .pexp-acts 已随 ADR-0079 删除：展开区不再摆底部动作钮，取用全走手势（单击／双击／长按） */
/* 展开区＝三档取用手势的操作面（单击／双击／长按，判据与口径见 pexTake 那段注释）。
   这一条同时管 .ra-hit-exp（两处浮层的展开行）——它们与 .pexp 是**同一层手势面**，样式也共用一份，
   免得将来只改了面板那半边、浮层那半边悄悄退回"长按弹选择手柄"。
   touch-action 取 manipulation：真机视口允许缩放（viewport 没锁 user-scalable），双击会被引擎当成"放大一档"，
   取了这个值双击才是两下点击；pan 仍在允许集里——展开区常比一屏长，竖着划照旧滚。
   user-select:none：长按落在预览文字上会拉起选择手柄，选择态一起来这串指针事件就断了（pointerup 轮不到我们）。 */
.pexp,.ra-hit-exp{touch-action:manipulation;user-select:none;-webkit-user-select:none}
.comp{display:inline-flex;gap:2px;align-items:center;vertical-align:-3px;margin-left:6px} /* 组成条：接在摘要文字后的小icon丸序列 */
/* 个人素材编排编辑器：消息步骤卡（拖拽调序） */
.ps-step{border:1px solid var(--outline-variant);border-radius:14px;padding:9px 11px;margin-top:10px;background:var(--sc)}
.ps-step.drag{opacity:.45;border-style:dashed}
.ps-grip{cursor:grab;color:var(--on-surface-variant);display:inline-flex;flex:none;transform:rotate(90deg)}
.ps-ord{font-size:11px;font-weight:600;color:var(--on-surface-variant);flex:none;width:14px;text-align:center}
/* 类型标签＝只读（类型在「加一条消息」时选定，卡片上不再提供切换；换类型＝删掉重加，ADR-0016） */
.ps-tag{height:26px;padding:0 10px;border-radius:13px;background:var(--primary-container);color:var(--on-primary-container);
  font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.ps-rt{height:26px;padding:0 10px;border:1px solid var(--outline-variant);border-radius:13px;background:transparent;color:var(--on-surface-variant);
  font-size:11px;font-weight:500;font-family:inherit;cursor:pointer;flex:none}
.ps-rt:hover{border-color:var(--primary);color:var(--primary)}
/* 语音录制页：大计时＋圆形录制按钮（录制中转红），录完给可试听的语音条 */
.ps-mic{width:96px;height:96px;border-radius:50%;border:none;background:var(--primary);color:var(--on-primary);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.ps-mic.on{background:var(--error);color:#fff;animation:psPulse 1.4s ease-out infinite}
@keyframes psPulse{0%{box-shadow:0 0 0 0 rgba(179,38,30,.45)}100%{box-shadow:0 0 0 22px rgba(179,38,30,0)}}
.ps-voice{display:flex;align-items:center;gap:11px;height:52px;padding:0 13px;border:1px solid var(--outline-variant);border-radius:12px;background:var(--sc)}
.ps-play{width:30px;height:30px;border:none;border-radius:50%;background:var(--primary);color:var(--on-primary);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;flex:none;padding:0}
.ps-wf{flex:1;min-width:0;display:flex;align-items:center;gap:2px;height:22px;overflow:hidden}
.ps-wf i{flex:1;min-width:2px;background:var(--primary);opacity:.45;border-radius:1px}
.ps-vt{font-size:12px;color:var(--on-surface-variant);font-family:monospace;flex:none}
.ps-del{width:26px;height:26px;border:none;border-radius:50%;background:transparent;color:var(--on-surface-variant);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;padding:0}
/* 只剩一条时×不消失、转 dim 保留点击（M3 不可用动作＝禁用＋解释，不吞动作；同素材卡发圈按钮的 dim 规矩） */
.ps-del.dim{opacity:.38;cursor:default}
.ps-del.dim:hover{background:transparent;color:var(--on-surface-variant)}
/* 媒体条三态：未选（虚线「＋ 选择本地文件」）→ 已选（文件名丸）→ 移除（回未选）。
   「移除附件」与行尾「删除这条消息」是两件事，分开给入口（docs/05 编排规则） */
.ps-pick{width:100%;height:44px;margin-top:8px;border:1px dashed var(--outline-variant);border-radius:12px;background:transparent;
  color:var(--on-surface-variant);font-family:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.ps-pick:hover{border-color:var(--primary);color:var(--primary)}
.ps-file{display:flex;align-items:center;gap:9px;margin-top:8px;height:44px;padding:0 8px 0 12px;border:1px solid var(--outline-variant);
  border-radius:12px;background:var(--surface)}
.ps-file .ps-fic{color:var(--primary);display:inline-flex;flex:none}
.ps-file .ps-fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--on-surface)}
.ps-frm{width:30px;height:30px;border:none;border-radius:50%;background:transparent;color:var(--on-surface-variant);cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.ps-frm:hover{background:var(--error-container);color:var(--error)}
/* 个人素材分组：表单分组字段（.pk-field）＋管理分组行（.pk-row）。分组允许重名，行内以素材数区分 */
.pk-field{display:flex;align-items:center;gap:9px;width:100%;height:48px;padding:0 14px;border:1px solid var(--outline-variant);
  border-radius:12px;background:var(--sc);color:var(--on-surface);font-size:13.5px;font-family:inherit;text-align:left;cursor:pointer;position:relative;overflow:hidden}
.pk-field .pk-v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-row{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--sc);border-radius:12px;margin-top:6px;cursor:grab}
.pk-row.drag{opacity:.45}
.pk-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;color:var(--on-surface)}
.pk-in{flex:1;min-width:0;height:36px;padding:0 10px;border:1px solid var(--primary);border-radius:8px;background:var(--surface);color:var(--on-surface);font-size:14px;font-family:inherit}
.pk-in:focus{outline:none;box-shadow:0 0 0 1px var(--primary)}
.pk-c{font-size:11.5px;color:var(--on-surface-variant);flex:none}
.pk-a{width:36px;height:36px;border:none;border-radius:50%;background:transparent;color:var(--on-surface-variant);cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex:none;padding:0;position:relative;overflow:hidden}
.pk-a.danger{color:var(--error)}
.pk-a.ok{color:var(--primary)}   /* 重命名进行中：铅笔当场变蓝✓（稿子 803:384），确认动作就落在原来那颗的位置上 */
.pk-a.dim{opacity:.35}   /* 组内非空时删除入口 dim 但保留点击（ADR-0026），点了弹「只能删除空分组」的解释 */
